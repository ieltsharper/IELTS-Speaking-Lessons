oung people."}, {"level": 3, "q": "Are there many young people in your hometown?", "use": "<b>energetic<\/b>", "hint": "Kỹ thuật 5W1H (Who + Why)", "answer": "Yes, there are loads. Students from all over the country come here for university, so the city has a really young, energetic vibe, especially at weekends."}, {"level": 3, "q": "Do you think you will continue living there for a long time?", "use": "<b>settle down<\/b>", "hint": "Kỹ thuật Tense control (tương lai) + But", "answer": "I think so. I might study abroad for a while, but in the long run I'd like to settle down here, close to my family."}], "title": "Bài tập 3: Trả lời câu hỏi trong bản dự đoán"}}}, {"num": 6, "name": "The area you live in", "purpose": ["Chủ đề này hỏi về <b>khu bạn đang sống<\/b>: ồn hay yên tĩnh, hàng xóm thế nào, có gì thay đổi. Vì phần lớn các bạn sống ở thành phố lớn, Unit này dùng từ vựng về <b>ngõ, chung cư, cửa hàng tiện lợi, công trình đang xây, kẹt xe<\/b>.", "Bản dự đoán chỉ có <b>7 câu hỏi<\/b>, nên mỗi câu xuất hiện vài lần trong bài tập với các cách trả lời khác nhau. Hãy luyện để có <b>hai cách trả lời<\/b> cho mỗi câu."], "vocab": [{"level": 1, "phrase": "a quiet alley", "meaning": "con ngõ yên tĩnh", "example": "I live in <b>a quiet alley<\/b> off a busy street."}, {"level": 1, "phrase": "a convenience store", "meaning": "cửa hàng tiện lợi", "example": "There's <b>a convenience store<\/b> right next to my building."}, {"level": 1, "phrase": "street vendors", "meaning": "người bán hàng rong", "example": "<b>Street vendors<\/b> sell sticky rice every morning."}, {"level": 1, "phrase": "say hello to", "meaning": "chào hỏi", "example": "I always <b>say hello to<\/b> the old lady next door."}, {"level": 2, "phrase": "keep to themselves", "meaning": "sống khép kín, ít giao tiếp", "example": "Most people in my building <b>keep to themselves<\/b>."}, {"level": 2, "phrase": "get on well with", "meaning": "hòa thuận với", "example": "My mum <b>gets on well with<\/b> all the neighbours."}, {"level": 2, "phrase": "a sense of community", "meaning": "tinh thần cộng đồng", "example": "There's a real <b>sense of community<\/b> in our alley."}, {"level": 2, "phrase": "green space", "meaning": "không gian xanh", "example": "There isn't much <b>green space<\/b> in my area."}, {"level": 3, "phrase": "on my doorstep", "meaning": "ngay gần nhà", "example": "Shops, a market and a gym are all <b>on my doorstep<\/b>."}, {"level": 3, "phrase": "under construction", "meaning": "đang được xây dựng", "example": "A new metro line is <b>under construction<\/b> near my house."}, {"level": 3, "phrase": "a residential area", "meaning": "khu dân cư", "example": "It's mainly <b>a residential area<\/b>, so it's quiet at night."}, {"level": 3, "phrase": "the noise from the traffic", "meaning": "tiếng ồn xe cộ", "example": "<b>The noise from the traffic<\/b> starts really early."}], "expandFormula": "Công thức: <b>trả lời ngắn → thêm lý do hoặc chi tiết (5W1H) → thêm mặt trái (But) hoặc trải nghiệm của riêng bạn (Personalization)<\/b>. Chỉ cần 2-4 câu.", "expand": [{"q": "Do you live in a noisy or a quiet area?", "short": "Noisy.", "tech": "5W1H (Why + When)", "answer": "It's quite noisy, because we live next to a main road. <b>The noise from the traffic<\/b> starts at around 6 a.m."}, {"q": "Do you know any of your neighbours?", "short": "Yes.", "tech": "Personalization", "answer": "Yes, a few of them. I know the old couple next door quite well, and they always give me fruit."}, {"q": "Do you like the area that you live in?", "short": "Yes.", "tech": "5W1H (Why) + But", "answer": "On the whole, yes. Everything's <b>on my doorstep<\/b>. <b>But<\/b> there isn't enough <b>green space<\/b>."}], "samples": [{"q": "Are the people in your neighbourhood nice and friendly?", "a": "Yes, most of them are. There's a strong sense of community, and people often chat outside in the evenings."}, {"q": "What are some changes in the area recently?", "a": "A new shopping mall has opened nearby. But because of that, the traffic has got much worse."}, {"q": "Where do you like to go in that area?", "a": "Usually the convenience store at the end of my street. After school, my friends and I often grab a drink there."}], "mistakes": [{"bad": "There have many shops near my house.", "good": "There are many shops near my house.", "note": "<i>có<\/i> (tồn tại) → <i>there is / there are<\/i>, không dùng <i>there have<\/i>."}, {"bad": "My area is very crowd.", "good": "My area is very crowded.", "note": "Cần tính từ <i>crowded<\/i> (đọc rõ /ɪd/ cuối)."}, {"bad": "Do you know any of your neighbours? → Yes, I know my neighbours.", "good": "Yes, a few of them. I often chat with the old couple next door.", "note": "Lặp lại câu hỏi và không thêm ý. Nói rõ là ai và thêm một chi tiết."}], "choose": [{"h": "neighbour / neighbourhood", "html": "<b>neighbour<\/b> là người hàng xóm: My <b>neighbours<\/b> are friendly. · <b>neighbourhood<\/b> là khu phố: I like my <b>neighbourhood<\/b>. (Chính tả Anh-Anh có <i>-our<\/i>.)"}, {"h": "noisy / crowded / busy", "html": "<b>noisy<\/b> (ồn) · <b>crowded<\/b> (đông người) · <b>busy<\/b> (nhộn nhịp, nhiều xe, nhiều hoạt động)."}], "sounds": {"lines": ["<b>-s/-es:<\/b> shop<b>s<\/b> /s/ · neighbour<b>s<\/b> /z/ · servic<b>es<\/b> /ɪz/", "<b>Phụ âm cuối (đọc rõ /t/, /k/):<\/b> stree<b>t<\/b> · par<b>k<\/b> · marke<b>t<\/b>", "<b>Trọng âm:<\/b> <b>NEIGH<\/b>bourhood · con<b>VEN<\/b>ient · resi<b>DEN<\/b>tial"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}, "ex": {"1": {"intro": "<i>Nhìn gợi ý, nói to câu hoàn chỉnh (không đọc), rồi viết lại. Mỗi câu có một cụm từ vựng của chủ đề; hãy dùng đúng cụm đó.<\/i>", "items": [{"level": 1, "cue": "I / live / quiet alley / off / busy street", "hint": "Mạo từ <i>a<\/i>; giới từ <i>in<\/i>", "answer": "I live in a quiet alley off a busy street.", "alt": "Actually, I live in a quiet alley just off a busy street.", "note": "<i>off a street<\/i> = rẽ ra từ một con phố."}, {"level": 1, "cue": "there / be / convenience store / right next to / my building", "hint": "<i>There's<\/i> + danh từ số ít", "answer": "There's a convenience store right next to my building.", "alt": "Right next to my building, there's a convenience store that's open 24 hours.", "note": "<i>a convenience store<\/i> (số ít) → <i>there's<\/i>."}, {"level": 1, "cue": "street vendors / sell / food / every morning", "hint": "Hiện tại đơn; có thể thêm nơi chốn", "answer": "Street vendors sell food there every morning.", "alt": "Every morning, street vendors sell food at the end of my street.", "note": "Chủ ngữ số nhiều <i>street vendors<\/i> → <i>sell<\/i> (không thêm -s)."}, {"level": 1, "cue": "I / always / say hello to / old lady / next door", "hint": "Mạo từ <i>the<\/i>", "answer": "I always say hello to the old lady next door.", "alt": "Every day I say hello to the old lady next door, and she always smiles back.", "note": "<i>say hello to<\/i> + người; <i>next door<\/i> = nhà bên cạnh."}, {"level": 2, "cue": "most / my neighbours / keep to themselves", "hint": "Thêm <i>of<\/i>", "answer": "Most of my neighbours keep to themselves.", "alt": "To be honest, most of my neighbours in this building keep to themselves.", "note": "<i>most of my + danh từ số nhiều<\/i>; <i>keep to themselves<\/i> = ít giao tiếp."}, {"level": 2, "cue": "there / not / much / green space / my area", "hint": "Dùng <i>There isn't much…<\/i>", "answer": "There isn't much green space in my area.", "alt": "Unfortunately, there isn't much green space in my area.", "note": "<i>green space<\/i> không đếm được → <i>much<\/i>."}, {"level": 2, "cue": "new metro station / be / under construction / near / my house", "hint": "Mạo từ <i>A<\/i>", "answer": "A new metro station is under construction near my house.", "alt": "Near my house, a new metro station is under construction at the moment.", "note": "<i>under construction<\/i> = đang xây (không cần bị động <i>is being built<\/i>)."}, {"level": 3, "cue": "Say whether your neighbourhood is friendly. Use \"a sense of community\".", "hint": "Hai câu: nhận xét + chi tiết", "answer": "Yes, mostly. There's a real sense of community in our alley, and people often chat outside in the evenings.", "alt": "I'd say so. There's a strong sense of community, especially among the older people.", "note": "<i>There's a (real/strong) sense of community<\/i> là cụm cố định."}, {"level": 3, "cue": "Say what's good about your area. Use \"on my doorstep\".", "hint": "Liệt kê 2-3 thứ cụ thể", "answer": "The best thing is that everything's on my doorstep: shops, a market and even a small park.", "alt": "What I like is having everything on my doorstep, like a supermarket, a gym and my school.", "note": "Liệt kê cụ thể (5W1H: What) sau <i>on my doorstep<\/i>."}, {"level": 3, "cue": "Say how your area has changed. Use \"a residential area\".", "hint": "Tense control: quá khứ → hiện tại hoàn thành", "answer": "It's changed a lot. It used to be quite rural, but now it's become a busy residential area with lots of apartment blocks.", "alt": "It used to be mostly rice fields, but over the years it's turned into a busy residential area.", "note": "<i>used to be<\/i> (trước kia) + <i>it's become<\/i> (đến nay đã thành)."}], "title": "Bài tập 1: Từ vựng chủ đề → câu nói"}, "2": {"intro": "<i>Câu trả lời ngắn chưa đủ ý. Nói lại câu ngắn, rồi mở rộng thêm 1-2 câu bằng gợi ý (mỗi dấu | là một câu mới hoặc một ý mới). Nói to trước, viết sau.<\/i>", "items": [{"level": 1, "q": "Do you live in a noisy or a quiet area?", "short": "It's quite noisy.", "expand": "because / live / next to / main road | traffic / start / at around 6 a.m.", "hint": "Kỹ thuật 5W1H (Why + When)", "answer": "It's quite noisy, because we live next to a main road. The traffic starts at around 6 a.m.", "alt": "It's quite noisy because we live next to a main road, and the traffic starts at around 6 a.m. every day.", "note": "Nêu lý do (Why) và thời gian (When) để chứng minh <i>noisy<\/i>."}, {"level": 1, "q": "Do you like the area that you live in?", "short": "Yes, I like it.", "expand": "really convenient | supermarket / and / my school / both / nearby", "hint": "Kỹ thuật 5W1H (Why)", "answer": "Yes, I like it. It's really convenient, because a supermarket and my school are both nearby.", "alt": "Yes, I like it, mainly because it's really convenient. A supermarket and my school are both nearby.", "note": "<i>convenient<\/i> (tiện lợi) + ví dụ cụ thể."}, {"level": 1, "q": "Do you know any of your neighbours?", "short": "Yes, a few of them.", "expand": "know / old couple / next door | always / give / me / fruit", "hint": "Kỹ thuật Personalization", "answer": "Yes, a few of them. I know the old couple next door quite well, and they always give me fruit from their garden.", "alt": "Yes, a few of them. The old couple next door always give me fruit, so I know them quite well.", "note": "Câu hỏi <i>any of your neighbours<\/i> → <i>a few of them<\/i>, rồi kể về một người cụ thể."}, {"level": 1, "q": "Where do you like to go in that area?", "short": "I like going to the park nearby.", "expand": "every evening / jog / with my dad | it / small / but / peaceful", "hint": "Kỹ thuật 5W1H (When + Who) + But", "answer": "I like going to the park nearby. Every evening I jog there with my dad. It's small, but it's really peaceful.", "alt": "I like going to the park nearby, where I jog with my dad every evening. It's small, but it's peaceful.", "note": "Thêm <i>When<\/i> và <i>Who<\/i>; <i>But<\/i> đi từ điểm chưa tốt (small) sang điểm tốt (peaceful)."}, {"level": 2, "q": "Are the people in your neighbourhood nice and friendly?", "short": "Yes, most of them are.", "expand": "sense of community | for example / help / each other / when / street / flood", "hint": "Kỹ thuật 5W1H (What) + Personalization", "answer": "Yes, most of them are. There's a strong sense of community. For example, everyone helped each other when our street flooded last year.", "alt": "Yes, most of them are, and there's a real sense of community. For example, people helped each other a lot when the street flooded.", "note": "Ý chung + ví dụ cụ thể (<i>For example…<\/i>) ở thì quá khứ."}, {"level": 2, "q": "What are some changes in the area recently?", "short": "Quite a lot has changed.", "expand": "new shopping mall / open | but / traffic / get / much worse", "hint": "Kỹ thuật Tense control + But", "answer": "Quite a lot has changed. A new shopping mall has opened nearby. But because of that, the traffic has got much worse.", "alt": "Quite a lot has changed. A new shopping mall has opened, which is nice, but the traffic has got much worse.", "note": "Thay đổi gần đây → hiện tại hoàn thành (<i>has opened, has got worse<\/i>)."}, {"level": 2, "q": "Do you know any famous people in your area?", "short": "Not really.", "expand": "but / there / famous pho restaurant / on my street | people / queue / every morning", "hint": "Kỹ thuật But", "answer": "Not really. But there's a famous pho restaurant on my street, and people queue there every morning.", "alt": "Not really, but there is a famous pho restaurant on my street. People queue outside it every morning.", "note": "Khi câu trả lời là <i>No<\/i>, dùng <i>But<\/i> để chuyển sang một ý liên quan, tránh câu trả lời cụt."}, {"level": 3, "q": "Do you know any of your neighbours?", "short": "Honestly, not many.", "expand": "in my building / most neighbours / keep to themselves | only / see / them / in the lift", "hint": "Kỹ thuật Personalization", "answer": "Honestly, not many. In my building, most neighbours keep to themselves. I only really see them in the lift.", "alt": "Honestly, not many, because most neighbours in my building keep to themselves. I only see them in the lift.", "note": "Câu trả lời tiêu cực vẫn tốt nếu có lý do và chi tiết. <i>lift<\/i> là tiếng Anh-Anh (Anh-Mỹ: <i>elevator<\/i>)."}, {"level": 3, "q": "Do you like the area that you live in?", "short": "On the whole, yes.", "expand": "everything / need / on my doorstep | but / not / enough / green space", "hint": "Kỹ thuật But", "answer": "On the whole, yes. Everything I need is on my doorstep. But there isn't enough green space, so I sometimes feel a bit trapped.", "alt": "On the whole, yes, because everything I need is on my doorstep. But there isn't enough green space for kids to play.", "note": "<i>On the whole<\/i> = nhìn chung; mở đường cho một ý <i>But<\/i> phía sau."}, {"level": 3, "q": "What are some changes in the area recently?", "short": "The biggest change is the construction.", "expand": "metro line / under construction | once / it / open / commute / much easier", "hint": "Kỹ thuật Tense control (tương lai)", "answer": "The biggest change is the construction. A new metro line is under construction, and once it opens, my commute will be much easier.", "alt": "Mostly the construction, to be honest. A metro line is under construction just down the road, and my commute will be much easier once it opens.", "note": "<i>once it opens<\/i> (hiện tại đơn) + <i>will be<\/i> (tương lai)."}], "title": "Bài tập 2: Mở rộng câu trả lời"}, "3": {"intro": "<i>Trả lời bằng 2-4 câu (khoảng 20-40 từ). Dùng cụm từ vựng cho sẵn và kỹ thuật mở rộng ở dòng gợi ý. Câu mẫu trong đáp án chỉ để tham khảo; hãy nói về cuộc sống thật của bạn.<\/i>", "items": [{"level": 1, "q": "Do you live in a noisy or a quiet area?", "use": "<b>alley<\/b>", "hint": "Kỹ thuật 5W1H (Where + What)", "answer": "It's actually quite quiet. We live in a small alley, so there aren't many cars. You can only hear motorbikes and the occasional street vendor."}, {"level": 1, "q": "Are the people in your neighbourhood nice and friendly?", "use": "<b>get on well with<\/b>", "hint": "Kỹ thuật Personalization", "answer": "Yes, they're really friendly. My mum gets on well with almost everyone, so our neighbours often drop by with snacks or just to chat."}, {"level": 1, "q": "Where do you like to go in that area?", "use": "<b>a convenience store<\/b>", "hint": "Kỹ thuật 5W1H (Where + When + Who)", "answer": "Usually the convenience store at the end of my street. After school, my friends and I often grab a drink there and hang out for a bit."}, {"level": 1, "q": "Do you know any of your neighbours?", "use": "<b>say hello to<\/b>", "hint": "Kỹ thuật But", "answer": "Yes, a few. I say hello to the people on my floor every day. But to be honest, I don't really know their names."}, {"level": 2, "q": "Do you like the area that you live in?", "use": "<b>on my doorstep<\/b>", "hint": "Kỹ thuật But", "answer": "Yes, I do. Shops, a market and even a gym are all on my doorstep. The only downside is the noise from the main road."}, {"level": 2, "q": "Do you know any famous people in your area?", "use": "<b>local<\/b>", "hint": "Kỹ thuật But", "answer": "Not that I know of. But there's a local singer who sometimes performs at the coffee shop near my house, and he's quite popular on social media."}, {"level": 2, "q": "What are some changes in the area recently?", "use": "<b>under construction<\/b>", "hint": "Kỹ thuật Tense control (hiện tại hoàn thành)", "answer": "Quite a few. A new apartment block has just been finished, and another one is still under construction, so there's dust everywhere at the moment."}, {"level": 3, "q": "Do you live in a noisy or a quiet area?", "use": "<b>a residential area<\/b>", "hint": "Kỹ thuật But (so sánh ngày và đêm)", "answer": "It depends on the time of day. During the day it's pretty noisy because of the traffic, but at night it's quiet, since it's mainly a residential area."}, {"level": 3, "q": "Are the people in your neighbourhood nice and friendly?", "use": "<b>keep to themselves<\/b>", "hint": "Kỹ thuật But", "answer": "It's a bit mixed. The older people in my alley are really warm and chatty. But the younger families tend to keep to themselves, probably because they're so busy."}, {"level": 3, "q": "Where do you like to go in that area?", "use": "<b>green space<\/b>", "hint": "Kỹ thuật Personalization", "answer": "There isn't much green space nearby, so I usually go to a small park about ten minutes away. I go there to jog or just to clear my head before exams."}], "title": "Bài tập 3: Trả lời câu hỏi trong bản dự đoán"}}}], "bankIntro": ["Tất cả câu hỏi trong bản dự đoán cho bốn chủ đề. Mỗi câu có <b>câu mở đầu gợi ý<\/b> (nói tiếp sau dấu …) và <b>từ vựng nên dùng<\/b>. Dùng bảng này để tự luyện hoặc luyện theo cặp: một bạn hỏi, một bạn trả lời 2-4 câu.", "Câu hỏi về công việc (Work) có gợi ý cho bạn <b>chưa đi làm<\/b>: hãy nói thật rằng mình còn đi học, rồi mở rộng sang việc học hoặc công việc mơ ước."], "bank": [{"topic": "Work or studies", "rows": [["What subjects are you studying?", "I'm in grade 11, so I study about ten subjects…", "do well in, the graduation exam"], ["Do you like your subject?", "Most of them, yes. My favourite subject is…", "my favourite subject, do well in"], ["Why did you choose to study that subject?", "(Sinh viên Luật) I chose law mainly because… · (Cấp 3) I'm in a science class because…", "major in, career prospects"], ["Do you think that your subject is popular in your country?", "Yes, it's really popular in Vietnam, mainly because…", "career prospects"], ["Do you have any plans for your studies in the next five years?", "Yes, I do. I'm hoping to…", "major in, the graduation exam"], ["What are the benefits of being your age?", "I'd say the biggest benefit is…", "a heavy workload, few responsibilities"], ["Do you want to change your major?", "(Sinh viên Luật) Not really, because… · (Cấp 3) I haven't chosen a major yet, but…", "major in, career prospects"], ["Do you prefer to study in the mornings or in the afternoons?", "I'd say I prefer the mornings, because…", "my mind is fresher"], ["How much time do you spend on your studies each week?", "Quite a lot, actually. Besides school, I…", "take extra classes, a heavy workload"], ["Are you looking forward to working?", "Yes, definitely. I can't wait to…", "earn my own money, career prospects"], ["What technology do you use when you study?", "I mostly use my laptop. I…", "look up new words, online lessons"], ["What changes would you like to see in your school?", "I'd love to see more…", "learning environment"], ["What work do you do?", "(Chưa đi làm) I don't work yet, because I'm still a student, but…", "I'm still a student"], ["Why did you choose to do that type of work (or that job)?", "(Chưa đi làm) I don't have a job yet, but my dream job is…, because…", "career prospects"], ["Do you like your job?", "(Chưa đi làm) I'm still a student, but I really enjoy studying, especially…", "my favourite subject"], ["What requirements did you need to meet to get your current job?", "(Chưa đi làm) I don't have a job yet, but I know that to become a lawyer, you need…", "a law degree, career prospects"], ["Do you have any plans for your work in the next five years?", "(Chưa đi làm) In five years I'll probably have just graduated, so I hope to…", "major in, career prospects"], ["What do you think is the most important at the moment?", "For me, the most important thing right now is…", "the graduation exam, keep up with"], ["Do you want to change to another job?", "(Chưa đi làm) I'm still a student, but if I could choose a job, I'd…", "career prospects"], ["Do you miss being a student?", "(Chưa đi làm) I'm still a student, so I can't miss it yet. Actually, I…", "a heavy workload"], ["What technology do you use at work?", "(Chưa đi làm) I don't work yet, but when I study, I use…", "look up, online dictionary"], ["Who helps you the most? And how?", "(Câu hỏi cũng có thể hiểu là chuyện học) I'd say my mum, because…", "keep up with, do well in"]]}, {"topic": "Home & Accommodation", "rows": [["Who do you live with?", "I live with my parents and…", "live with my parents, get on well with"], ["Do you live in an apartment or a house?", "I live in an apartment on the … floor.", "a high-rise apartment, a tube house"], ["What part of your home do you like the most?", "I like my bedroom the most, because…", "natural light, personal space"], ["What's the difference between where you are living now and where you have lived in the past?", "When I was little, we lived in…, but now…", "a bit cramped, spacious"], ["What kind of house or apartment do you want to live in in the future?", "I'd love a … house with…", "spacious, within walking distance of"], ["What room does your family spend most of the time in?", "Definitely the living room. Every evening we…", "cosy, family gatherings"], ["What do you usually do in your apartment?", "Mostly I study in my room, but…", "my own room"], ["What kinds of accommodation do you live in?", "I live in a high-rise apartment in…", "a high-rise apartment, a tube house"], ["Do you plan to live there for a long time?", "Probably not forever. After university, I'd like to…", "personal space"], ["Can you describe the place where you live?", "Sure. It's a … flat on the … floor.", "cosy, a bit cramped"], ["Do you prefer living in a house or an apartment?", "I'd say I prefer…, mainly because…", "spacious, convenient"], ["Please describe the room you live in.", "I have my own room, which is…", "my own room, natural light"], ["Are the transport facilities to your home very good?", "Yes, they're pretty good. There's a bus stop…", "within walking distance of"], ["What's your favourite room in your apartment or house?", "My favourite room is…, because…", "natural light, cosy"], ["What makes you feel pleasant in your home?", "Mainly the relaxed atmosphere. After a long day at school…", "cosy, family gatherings"], ["How long have you lived there?", "About … years now. We moved there when I was…", "(hiện tại hoàn thành) I've lived"], ["Do you think it is important to live in a comfortable environment?", "Yes, I think it's really important, because…", "living conditions"]]}, {"topic": "Hometown", "rows": [["Did you learn about the culture of your hometown in your childhood?", "Yes, I did. Every Mid-Autumn Festival, my grandparents…", "local culture"], ["Have you learned anything about the history of your hometown?", "Yes, I have. I've learned that…", "over a thousand years of history"], ["Where is your hometown?", "My hometown is… I was born and raised there.", "be born and raised in"], ["Is that a big city or a small place?", "It's a really big city. It's the capital city, and…", "the capital city"], ["Do you like your hometown?", "Yes, I'm quite fond of it, mainly because…", "cultural heritage, a fast pace of life"], ["What do you like (most) about your hometown?", "What I like most is…", "street food, be famous for"], ["Is there anything you dislike about it?", "Mostly the traffic. There are…", "traffic jams, air pollution"], ["How long have you been living there?", "My whole life. I've lived there since I was born.", "(hiện tại hoàn thành) I've lived"], ["Do you like living there?", "Yes, I do. I enjoy…, but…", "a fast pace of life"], ["Do you think you will continue living there for a long time?", "I think so. In the long run, I'd like to…", "settle down, job opportunities"], ["Please describe your hometown a little.", "Sure. It's the capital city of Vietnam, in the north…", "the capital city, street food"], ["What's your hometown famous for?", "It's best known for…", "be famous for, street food"], ["Did you learn about the history of your hometown at school?", "Yes, we did. We learned that…", "used to be called, over a thousand years of history"], ["Are there many young people in your hometown?", "Yes, loads. Lots of students from other provinces…", "energetic"], ["Is your hometown a good place for young people to pursue their careers?", "Yes, I'd say so. There are lots of job opportunities, but…", "job opportunities, the cost of living"]]}, {"topic": "The area you live in", "rows": [["Do you live in a noisy or a quiet area?", "It's quite noisy, because… / It's actually quite quiet, because…", "the noise from the traffic, a quiet alley"], ["Are the people in your neighbourhood nice and friendly?", "Yes, most of them are. There's a…", "a sense of community, get on well with"], ["Do you like the area that you live in?", "On the whole, yes. Everything I need is…", "on my doorstep, green space"], ["Where do you like to go in that area?", "I like going to … nearby, because…", "a convenience store, green space"], ["Do you know any famous people in your area?", "Not really, but there's…", "local"], ["What are some changes in the area recently?", "Quite a lot has changed. A new … has opened…", "under construction, a residential area"], ["Do you know any of your neighbours?", "Yes, a few of them. I know… / Honestly, not many, because…", "say hello to, keep to themselves"]]}], "guideTitle": "Hướng dẫn sử dụng", "unitsTitle": "Phần B Bốn chủ đề Part 1", "bankTitle": "Phụ lục: Ngân hàng câu hỏi Part 1"}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'ielts-speaking-1';
var state = load();
function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || {said:{}, text:{}}; } catch(e){ return {said:{}, text:{}}; } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) { if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Cấp độ ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- speech (browser voice) ---------- */
var voice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  var vs = speechSynthesis.getVoices();
  voice = vs.find(function(v){ return v.lang === 'en-GB'; }) || vs.find(function(v){ return /^en/.test(v.lang); }) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : 'en-GB'; if (voice) u.voice = voice; u.rate = 0.95;
  speechSynthesis.speak(u);
}
function speakBtn(text){
  if (!('speechSynthesis' in window)) return '';
  return '<button type="button" class="speak" data-say="' + esc(text) + '" aria-label="Nghe: ' + esc(text) + '" title="Nghe">🔊</button>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-say]'); if (b) say(b.getAttribute('data-say'));
});

/* ---------- recording ---------- */
var rec = null;
function toggleRecord(btn, holder){
  if (rec && rec.btn === btn) { rec.mr.stop(); return; }
  if (rec) rec.mr.stop();
  if (!navigator.mediaDevices || !window.MediaRecorder) { alert('Trình duyệt này không hỗ trợ ghi âm.'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = function(ev){ chunks.push(ev.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var a = holder.querySelector('audio'); if (a) { URL.revokeObjectURL(a.src); a.remove(); }
      a = el('audio', {controls:'', 'aria-label':'Bản ghi của bạn'});
      a.src = URL.createObjectURL(new Blob(chunks, {type: mr.mimeType || 'audio/webm'}));
      holder.appendChild(a);
      btn.setAttribute('aria-pressed', 'false'); btn.textContent = '🎙 Ghi âm lại';
      rec = null;
    };
    mr.start(); rec = {mr: mr, btn: btn};
    btn.setAttribute('aria-pressed', 'true'); btn.textContent = '■ Dừng ghi';
  }).catch(function(){ alert('Không mở được micro. Hãy cho phép trình duyệt dùng micro rồi thử lại.'); });
}

/* ---------- progress ---------- */
var ALL = [];
D.units.forEach(function(u){ ['1','2','3'].forEach(function(k){ u.ex[k].items.forEach(function(_, i){ ALL.push(u.num + '-' + k + '-' + i); }); }); });
function unitDone(u){ var n = 0, t = 0; ['1','2','3'].forEach(function(k){ u.ex[k].items.forEach(function(_, i){ t++; if (state.said[u.num + '-' + k + '-' + i]) n++; }); }); return [n, t]; }
function updateProgress(){
  var n = ALL.filter(function(id){ return state.said[id]; }).length;
  $('#progressText').textContent = 'Đã nói to ' + n + '/' + ALL.length + ' câu';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
  D.units.forEach(function(u){
    var t = document.querySelector('[data-unit-count="' + u.num + '"]');
    if (t) { var c = unitDone(u); t.textContent = c[0] + '/' + c[1]; }
  });
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Xoá toàn bộ câu đã viết và đánh dấu “Nói to” trên trình duyệt này?')) return;
  state = {said:{}, text:{}}; save(); render();
});

/* ---------- header and tabs ---------- */
$('#title').textContent = D.cover[0];
$('#sub1').textContent = D.cover[1] || '';
$('#sub2').textContent = D.cover[2] || '';
$('#sub3').textContent = D.cover[3] || '';
var TABS = [{id:'huong-dan', label:'Hướng dẫn'}];
D.units.forEach(function(u){ TABS.push({id:'unit-' + u.num, label:'Unit ' + u.num + ' · ' + u.name, unit:u}); });
TABS.push({id:'ngan-hang', label:'Ngân hàng câu hỏi'});
$('#tabs').innerHTML = TABS.map(function(t){ return '<a href="#' + t.id + '">' + esc(t.label) + '</a>'; }).join('');

function route(){
  var h = location.hash.replace('#', '').split('/');
  var tab = TABS.find(function(t){ return t.id === h[0]; }) || TABS[0];
  return {tab: tab, part: h[1] || 'ly-thuyet'};
}
var filter = 0;

/* ---------- pages ---------- */
function renderGuide(){
  var s = '<h2>' + esc(D.guideTitle) + '</h2>';
  var open = false, card = '';
  D.guide.forEach(function(b){
    if (b.type === 'h') { if (card) s += '<div class="card">' + card + '</div>'; card = '<h4>' + b.html + '</h4>'; open = false; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  if (open) card += '</ul>';
  if (card) s += '<div class="card">' + card + '</div>';
  s += '<h3>' + esc(D.unitsTitle) + '</h3><div class="boxes">' + D.units.map(function(u){
    var c = unitDone(u);
    return '<a class="card" style="text-decoration:none;color:inherit;display:block" href="#unit-' + u.num + '"><h4 style="color:var(--heading)">Unit ' + u.num + ' · ' + esc(u.name) + '</h4><span class="note">Đã nói to <span data-unit-count="' + u.num + '">' + c[0] + '/' + c[1] + '</span> câu</span></a>';
  }).join('') + '</div>';
  return s;
}

function renderTheory(u){
  var s = '';
  s += '<div class="card"><h4>Mục đích</h4>' + u.purpose.map(function(p){ return '<p>' + p + '</p>'; }).join('') + '</div>';
  s += '<h3>Từ vựng hay cho chủ đề</h3><div class="tablewrap"><table><thead><tr><th scope="col">Cụm từ</th><th scope="col">Nghĩa</th><th scope="col">Ví dụ khi nói</th></tr></thead><tbody>' +
    u.vocab.filter(function(v){ return !filter || v.level === filter; }).map(function(v){
      return '<tr><td class="phrase">' + dots(v.level) + ' ' + esc(v.phrase) + '</td><td class="muted">' + esc(v.meaning) + '</td><td>' + v.example + speakBtn(textOf(v.example)) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  s += '<h3>Từ câu ngắn đến câu trả lời đầy đủ</h3><p class="formula">' + u.expandFormula + '</p><div class="tablewrap"><table><thead><tr><th scope="col">Câu hỏi + câu trả lời ngắn</th><th scope="col">Kỹ thuật</th><th scope="col">Câu trả lời mở rộng</th></tr></thead><tbody>' +
    u.expand.map(function(x){
      return '<tr><td><b>' + esc(x.q) + '</b><br><span class="muted">→ ' + esc(x.short) + '</span></td><td class="muted">' + esc(x.tech) + '</td><td>' + x.answer + speakBtn(textOf(x.answer)) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  s += '<h3>Câu mẫu</h3><div class="card">' + u.samples.map(function(x){
    return '<div class="sample"><div class="q">' + esc(x.q) + '</div><div>→ ' + esc(x.a) + speakBtn(x.a) + '</div></div>';
  }).join('') + '</div>';
  s += '<div class="boxes">';
  s += '<div class="card box"><h4>Lỗi cần tránh</h4>' + u.mistakes.map(function(m){
    return '<div class="mistake"><div class="bad">' + m.bad + '</div><div class="good">' + m.good + '</div><div class="note">' + m.note + '</div></div>';
  }).join('') + '</div>';
  s += '<div class="card box"><h4>Chọn cho đúng</h4>' + u.choose.map(function(c){
    return '<div class="mistake"><div><b>' + esc(c.h) + '</b></div><div class="note">' + c.html + '</div></div>';
  }).join('') + '</div>';
  s += '<div class="card box"><h4>Âm cần luyện</h4>' + u.sounds.lines.map(function(l){ return '<p>' + l + '</p>'; }).join('') + '<p class="note">' + u.sounds.tip + '</p></div>';
  s += '</div>';
  return s;
}

function renderExercise(u, k){
  var ex = u.ex[k];
  var s = '<h3>' + esc(ex.title) + '</h3><p class="lede">' + ex.intro + '</p>';
  var shown = 0;
  ex.items.forEach(function(it, i){
    if (filter && it.level !== filter) return;
    shown++;
    var id = u.num + '-' + k + '-' + i;
    var said = !!state.said[id];
    var head = k === '1' ? '<span class="cue">' + it.cue + '</span>'
                         : '<span class="cue"><span class="examiner">Examiner:</span>' + esc(it.q) + speakBtn(it.q) + '</span>';
    var lines = '';
    if (it.short) lines += '<div><span class="label">Câu ngắn:</span> ' + it.short + '</div>';
    if (it.expand) lines += '<div><span class="label">Mở rộng:</span> ' + it.expand + '</div>';
    if (it.use) lines += '<div><span class="label">Dùng:</span> ' + it.use + '</div>';
    if (it.hint) lines += '<div><span class="label">Gợi ý:</span> <span class="hint">' + it.hint + '</span></div>';
    var ans = '<div class="main">' + (k === '3' ? '<span class="label">Câu mẫu:</span> ' : '') + it.answer + speakBtn(textOf(it.answer)) + '</div>';
    if (it.alt) ans += '<div class="alt"><span class="label">Cũng chấp nhận:</span> ' + it.alt + speakBtn(textOf(it.alt)) + '</div>';
    if (it.note) ans += '<div class="note" style="margin-top:6px">' + it.note + '</div>';
    s += '<div class="item' + (said ? ' done' : '') + '" data-id="' + id + '">' +
      '<div class="item-head"><span class="num">' + (i + 1) + '</span>' + dots(it.level) + head + '</div>' +
      '<div class="lines">' + lines + '</div>' +
      '<div class="work"><label class="note" for="t-' + id + '">Viết lại câu bạn đã nói</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(state.text[id] || '') + '</textarea>' +
      '<div class="actions">' +
        '<button type="button" class="btn" data-said="' + id + '" aria-pressed="' + said + '">' + (said ? '✓ Đã nói to' : 'Nói to ☐') + '</button>' +
        '<button type="button" class="btn rec" data-rec aria-pressed="false">🎙 Ghi âm</button>' +
        '<span class="rec-holder"></span>' +
        '<button type="button" class="btn primary" data-reveal="a-' + id + '" aria-expanded="false" aria-controls="a-' + id + '">Xem đáp án</button>' +
      '</div>' +
      '<div class="answer" id="a-' + id + '" hidden>' + ans + '</div></div></div>';
  });
  if (!shown) s += '<p class="empty">Không có câu nào ở cấp độ này.</p>';
  return s;
}

function renderUnit(u, part){
  var parts = [['ly-thuyet', 'A. Lý thuyết'], ['bai-tap-1', 'Bài tập 1'], ['bai-tap-2', 'Bài tập 2'], ['bai-tap-3', 'Bài tập 3']];
  var s = '<h2>Unit ' + u.num + ' · ' + esc(u.name) + '</h2>';
  s += '<div class="subnav" role="group" aria-label="Phần của Unit">' + parts.map(function(p){
    return '<a class="chip" style="text-decoration:none" href="#unit-' + u.num + '/' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + '</a>';
  }).join('') + '<span class="filter-label">Cấp độ:</span>' +
    [[0, 'Tất cả'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  if (part === 'ly-thuyet') s += renderTheory(u);
  else s += renderExercise(u, part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#unit-' + u.num + '/' + parts[i + 1][0] + '">Tiếp: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function renderBank(){
  var s = '<h2>' + esc(D.bankTitle) + '</h2>' + D.bankIntro.map(function(p){ return '<p class="lede">' + p + '</p>'; }).join('');
  s += '<input class="search" type="search" id="bankSearch" placeholder="Tìm câu hỏi hoặc từ vựng…" aria-label="Tìm trong ngân hàng câu hỏi">';
  D.bank.forEach(function(b){
    s += '<div data-bank><h3>' + esc(b.topic) + '</h3><div class="tablewrap"><table><thead><tr><th scope="col">Câu hỏi</th><th scope="col">Câu mở đầu gợi ý</th><th scope="col">Từ vựng nên dùng</th></tr></thead><tbody>' +
      b.rows.map(function(r){ return '<tr><td><b>' + r[0] + '</b>' + speakBtn(textOf(r[0])) + '</td><td>' + r[1] + '</td><td class="muted">' + r[2] + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  });
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (r.tab.unit) m.innerHTML = renderUnit(r.tab.unit, /^(ly-thuyet|bai-tap-[123])$/.test(r.part) ? r.part : 'ly-thuyet');
  else if (r.tab.id === 'ngan-hang') m.innerHTML = renderBank();
  else m.innerHTML = renderGuide();
  updateProgress();
}

/* ---------- events ---------- */
var lastTab = null;
window.addEventListener('hashchange', function(){
  if (rec) rec.mr.stop();
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-said]'))) {
    var id = b.getAttribute('data-said'), on = !state.said[id];
    if (on) state.said[id] = 1; else delete state.said[id];
    save();
    b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ Đã nói to' : 'Nói to ☐';
    b.closest('.item').classList.toggle('done', on);
    updateProgress(); return;
  }
  if ((b = e.target.closest('[data-reveal]'))) {
    var a = document.getElementById(b.getAttribute('data-reveal')), open = a.hidden;
    a.hidden = !open; b.setAttribute('aria-expanded', open); b.textContent = open ? 'Ẩn đáp án' : 'Xem đáp án'; return;
  }
  if ((b = e.target.closest('[data-rec]'))) { toggleRecord(b, b.parentNode.querySelector('.rec-holder')); }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) { var id = t.getAttribute('data-text'); if (t.value) state.text[id] = t.value; else delete state.text[id]; save(); }
  if (t.id === 'bankSearch') {
    var q = t.value.trim().toLowerCase();
    document.querySelectorAll('[data-bank]').forEach(function(sec){
      var any = false;
      sec.querySelectorAll('tbody tr').forEach(function(tr){ var hit = !q || tr.textContent.toLowerCase().indexOf(q) >= 0; tr.hidden = !hit; any = any || hit; });
      sec.hidden = !any;
    });
  }
});
lastTab = route().tab.id;
render();
})();
</script>
</body>
</html>
