<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IELTS Speaking 1 · IELTS Harper Portal</title>
<style>
/* IELTS Harper Portal look (same tokens as the Speaking band descriptors page). */
:root{
  --page:#f7f5f2; --card:#ffffff; --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --muted:#57534e; --heading:#f96c1b;
  --brand:#c2410c; --brand-hover:#9a3412; --on-brand:#ffffff; --brand-soft:#fff7ed;
  --hl:#ffedd5;
  --ok:#065f46; --ok-soft:#ecfdf5; --no:#991b1b; --no-soft:#fef2f2;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#171311; --card:#221c19; --line:#3a302b; --line-strong:#4f433c;
    --ink:#f5f0eb; --muted:#b8aca3; --brand-soft:#3a2416; --hl:#5a3418;
    --ok:#6ee7b7; --ok-soft:#12302a; --no:#fca5a5; --no-soft:#3b1d1d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar, as in the portal */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
.topbar-link{color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.topbar-link:hover{background:var(--brand-soft)}

/* masthead */
header.mast .wrap{padding-top:28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
h1{color:var(--heading);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.2;margin:0 0 8px}
.standfirst{margin:0;color:var(--muted)}
.standfirst.small{font-size:.9rem;font-style:italic}
.progress-all{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);width:0}

/* section tabs */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line);margin-top:20px}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav.tabs a{border:1px solid transparent;border-radius:12px;padding:8px 14px;white-space:nowrap;color:var(--muted);font-size:.93rem;font-weight:600;text-decoration:none}
nav.tabs a:hover{background:var(--brand-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
main{padding:28px 0 80px}
h2{color:var(--heading);font-weight:700;font-size:1.45rem;margin:0 0 6px}
h3{font-weight:700;font-size:1.12rem;margin:30px 0 10px}
h4{font-weight:700;font-size:1rem;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
ul.plain{margin:4px 0 12px;padding-left:22px}
ul.plain li{margin-bottom:6px}

/* unit sub-navigation and level filter */
.subnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:14px 0 18px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip:hover{background:var(--brand-soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip small{font-weight:500;opacity:.85}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.filter-label{font-size:.82rem;color:var(--muted);margin-left:auto}
.lv{color:var(--brand);letter-spacing:1px;font-size:.8rem;white-space:nowrap}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem}
td.phrase{font-weight:700;white-space:nowrap}
td.muted{color:var(--muted)}
.speak{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:.8rem;vertical-align:middle;margin-left:6px;padding:0;line-height:1}
.speak:hover{background:var(--brand-soft)}

/* boxes */
.boxes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box h4{color:var(--brand)}
.mistake{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mistake:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bad{color:var(--no)}.good{color:var(--ok)}
.bad::before{content:"✗ ";font-weight:700}.good::before{content:"✓ ";font-weight:700}
.note{color:var(--muted);font-size:.92rem}
.sample{margin-bottom:10px}
.sample .q{font-weight:700}
.formula{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:0 0 12px}

/* exercise items */
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.item.done{border-color:var(--ok)}
.item-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.85rem}
.cue{font-weight:700;font-size:1.05rem;flex:1;min-width:200px}
.examiner{color:var(--muted);font-weight:600;font-size:.85rem;margin-right:4px}
.lines{margin:8px 0 0 38px;font-size:.95rem}
.lines div{margin-bottom:3px}
.label{display:inline-block;min-width:78px;color:var(--muted);font-size:.85rem;font-weight:600}
.hint{color:var(--muted);font-style:italic}
.work{margin:12px 0 0 38px}
textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--page)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.rec[aria-pressed="true"]{background:var(--no-soft);border-color:var(--no);color:var(--no)}
audio{height:32px;max-width:260px}
.answer{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px}
.answer .main{font-weight:600}
.answer .alt{margin-top:6px}
.empty{color:var(--muted);font-style:italic}

/* question bank */
.search{width:100%;max-width:420px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;background:var(--card);margin-bottom:14px}

footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:600px){.lines,.work{margin-left:0}.filter-label{margin-left:0;width:100%}}
@media print{
  .topbar,nav.tabs,.subnav,.actions,.speak,textarea,.progress-all,footer{display:none!important}
  section[hidden]{display:block!important}
  .answer[hidden]{display:block!important}
  body{background:#fff}
  .item,.card{break-inside:avoid}
}
</style>
</head>

ing to <b>major in<\/b> law at university."}, {"level": 3, "phrase": "cram for (an exam)", "meaning": "học dồn trước khi thi", "example": "I tend to <b>cram for<\/b> tests the night before, which isn't a great habit."}, {"level": 3, "phrase": "career prospects", "meaning": "triển vọng nghề nghiệp", "example": "Law has good <b>career prospects<\/b> in Vietnam."}, {"level": 3, "phrase": "academic performance", "meaning": "kết quả học tập", "example": "My parents care a lot about my <b>academic performance<\/b>."}, {"level": 3, "phrase": "critical thinking", "meaning": "tư duy phản biện", "example": "Debating helps me develop my <b>critical thinking<\/b>."}], "expandFormula": "Công thức: <b>trả lời ngắn → thêm lý do hoặc chi tiết (5W1H) → thêm mặt trái (But) hoặc trải nghiệm của riêng bạn (Personalization)<\/b>. Chỉ cần 2-4 câu.", "expand": [{"q": "Do you like your subject?", "short": "Yes, I do.", "tech": "5W1H (Why) + But", "answer": "Yes, I do. I <b>do well in<\/b> English because I practise every day. <b>But<\/b> grammar tests still stress me out."}, {"q": "How much time do you spend on your studies?", "short": "A lot.", "tech": "5W1H (When) + Personalization", "answer": "Quite a lot, actually. Besides school, I <b>take extra classes<\/b> three evenings a week, so I'm basically always studying."}, {"q": "What work do you do?", "short": "I don't work.", "tech": "Personalization", "answer": "I don't work yet, because I'm still in high school. But I sometimes help my mum at her shop at weekends."}], "samples": [{"q": "What subjects are you studying?", "a": "I'm in grade 11, so I study about ten subjects. I usually do well in maths, but literature is a real struggle for me."}, {"q": "Do you prefer to study in the mornings or in the afternoons?", "a": "Definitely the mornings. My mind's much fresher then, whereas in the afternoons I often feel sleepy after lunch."}, {"q": "Why did you choose to study that subject? (sinh viên Luật)", "a": "I chose to major in law because I've always loved debating, and it has good career prospects."}], "mistakes": [{"bad": "I am student grade 11.", "good": "I'm in grade 11.", "note": "Không nói <i>student grade 11<\/i>. Dùng <i>I'm in grade 11<\/i> hoặc <i>I'm a grade 11 student<\/i>."}, {"bad": "I learn extra class every evening.", "good": "I take extra classes every evening.", "note": "<i>đi học thêm<\/i> = <i>take extra classes<\/i> (số nhiều), không dùng <i>learn<\/i>."}, {"bad": "I study law because I like law. Law is interesting.", "good": "I chose law because I've always loved debating.", "note": "Lặp từ <i>law<\/i> ba lần mà không có lý do cụ thể. Hãy nêu một lý do thật của bạn."}], "choose": [{"h": "study / learn", "html": "<b>study<\/b> (học một môn, ôn bài): I'm <b>studying<\/b> for my exams. · <b>learn<\/b> (học được, biết thêm): I <b>learned<\/b> a lot from that teacher."}, {"h": "major in / study at", "html": "I <b>major in<\/b> law (chuyên ngành). · I <b>study at<\/b> Hanoi Law University (học tại trường)."}], "sounds": {"lines": ["<b>Cụm phụ âm cuối:<\/b> subje<b>cts<\/b> /kts/ · ma<b>ths<\/b> /θs/ · te<b>sts<\/b> /sts/", "<b>-ed:<\/b> studi<b>ed<\/b> /d/ · finish<b>ed<\/b> /t/ · graduat<b>ed<\/b> /ɪd/", "<b>Trọng âm:<\/b> <b>LIT<\/b>erature · uni<b>VER<\/b>sity · bi<b>OL<\/b>ogy"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}, "ex": {"1": {"intro": "<i>Nhìn gợi ý, nói to câu hoàn chỉnh (không đọc), rồi viết lại. Mỗi câu có một cụm từ vựng của chủ đề; hãy dùng đúng cụm đó.<\/i>", "items": [{"level": 1, "cue": "I / be in grade 11 / high school / in Hanoi", "hint": "Thêm <i>at<\/i> trước tên trường", "answer": "I'm in grade 11 at a high school in Hanoi.", "alt": "At the moment I'm in grade 11 at a public high school in Hanoi.", "note": "<i>be in grade 11<\/i> (đang học lớp 11); <i>at a high school<\/i> (tại một trường)."}, {"level": 1, "cue": "my favourite subject / be / English", "hint": "Câu đơn, chú ý <i>is<\/i>", "answer": "My favourite subject is English.", "alt": "Honestly, my favourite subject has always been English.", "note": "Chủ ngữ số ít <i>my favourite subject<\/i> → <i>is<\/i>. Chính tả Anh-Anh: <i>favourite<\/i>."}, {"level": 1, "cue": "I / usually / do well in / maths", "hint": "Thì hiện tại đơn", "answer": "I usually do well in maths.", "alt": "I usually do well in maths, but not so well in physics.", "note": "<i>do well in<\/i> + môn học = học tốt môn đó."}, {"level": 1, "cue": "like most students / I / take extra classes / in the evenings", "hint": "Đi học thêm; danh từ số nhiều", "answer": "Like most students, I take extra classes in the evenings.", "alt": "I take extra classes in the evenings, like most students in my class.", "note": "<i>take extra classes<\/i>, không dùng <i>learn extra class<\/i>."}, {"level": 2, "cue": "we / have / heavy workload / this year", "hint": "Thêm mạo từ <i>a<\/i>; có thể thêm <i>really<\/i>", "answer": "We have a really heavy workload this year.", "alt": "This year we've got a heavy workload because of the graduation exam.", "note": "<i>a heavy workload<\/i> (danh từ đếm được số ít) → cần <i>a<\/i>."}, {"level": 2, "cue": "it / hard / keep up with / all the homework", "hint": "Cấu trúc <i>It's hard to + V<\/i>", "answer": "It's hard to keep up with all the homework.", "alt": "Sometimes it's really hard to keep up with all the homework we get.", "note": "Cấu trúc <i>It's hard to + động từ nguyên mẫu<\/i>."}, {"level": 2, "cue": "I / want / major in / law / at university", "hint": "Cấu trúc <i>want to + V<\/i>", "answer": "I want to major in law at university.", "alt": "What I really want is to major in law at university.", "note": "<i>want to major in<\/i>; <i>at university<\/i> (không cần <i>the<\/i>)."}, {"level": 3, "cue": "Say how you prepare for exams. Use \"cram for\".", "hint": "Thêm một lời tự nhận xét thật lòng", "answer": "To be honest, I tend to cram for exams the night before, which isn't the best habit.", "alt": "I usually cram for exams at the last minute, even though I know it's a bad idea.", "note": "<i>cram for<\/i> + kỳ thi; <i>which isn't the best habit<\/i> giúp câu tự nhiên và thật hơn."}, {"level": 3, "cue": "Say why you want to study your future major. Use \"career prospects\".", "hint": "Nêu ngành bạn muốn học và lý do", "answer": "I want to study law, mainly because it has really good career prospects.", "alt": "I'm planning to study economics, since the career prospects are pretty good.", "note": "<i>career prospects<\/i> thường đi với <i>good, great, limited<\/i>."}, {"level": 3, "cue": "Describe your school's learning environment. Use \"learning environment\".", "hint": "Hai câu: nhận xét + chi tiết", "answer": "My school has a really supportive learning environment. The teachers are friendly and always happy to help after class.", "alt": "I'd say the learning environment at my school is quite competitive. Everyone works hard because we all want good grades.", "note": "Câu đầu nêu nhận xét, câu sau thêm chi tiết (5W1H: Who)."}], "title": "Bài tập 1: Từ vựng chủ đề → câu nói"}, "2": {"intro": "<i>Câu trả lời ngắn chưa đủ ý. Nói lại câu ngắn, rồi mở rộng thêm 1-2 câu bằng gợi ý (mỗi dấu | là một câu mới hoặc một ý mới). Nói to trước, viết sau.<\/i>", "items": [{"level": 1, "q": "What subjects are you studying?", "short": "I'm studying lots of subjects.", "expand": "at the moment / focus on / maths, literature and English | because / need / them / for / graduation exam", "hint": "Kỹ thuật 5W1H (What + Why)", "answer": "I'm studying lots of subjects, but at the moment I mainly focus on maths, literature and English, because I need them for the graduation exam.", "alt": "I'm studying quite a lot of subjects. At the moment, though, I focus on maths, literature and English because I need them for the graduation exam.", "note": "Nêu cụ thể môn nào (What) và vì sao (Why) thay vì chỉ nói <i>lots of subjects<\/i>."}, {"level": 1, "q": "Do you like your subject?", "short": "Yes, I do.", "expand": "because / find / English / really interesting | especially / speaking lessons", "hint": "Kỹ thuật 5W1H (Why)", "answer": "Yes, I do, because I find English really interesting, especially the speaking lessons.", "alt": "Yes, I do. I find English really interesting, especially the speaking lessons, because we get to talk about all kinds of topics.", "note": "<i>find + danh từ + tính từ<\/i> (<i>find English interesting<\/i>) là cấu trúc tự nhiên khi nói."}, {"level": 1, "q": "Do you prefer to study in the mornings or in the afternoons?", "short": "I prefer the mornings.", "expand": "because / mind / fresher | in the afternoons / often / feel sleepy", "hint": "Kỹ thuật 5W1H (Why) + so sánh", "answer": "I prefer the mornings, because my mind is much fresher. In the afternoons, I often feel sleepy after lunch.", "alt": "I prefer studying in the mornings because my mind feels fresher then. In the afternoons I often feel a bit sleepy.", "note": "Câu hỏi chọn lựa: chọn một bên, rồi so sánh với bên còn lại."}, {"level": 1, "q": "What technology do you use when you study?", "short": "I mostly use my laptop.", "expand": "look up / new words / online dictionary | every night / for about an hour", "hint": "Kỹ thuật 5W1H (What + When)", "answer": "I mostly use my laptop. I look up new words in an online dictionary every night, usually for about an hour.", "alt": "I mostly use my laptop. Every night, for about an hour, I look up new words in an online dictionary.", "note": "Thêm <i>When<\/i> (every night) và <i>How long<\/i> (for about an hour) làm câu trả lời cụ thể."}, {"level": 2, "q": "How much time do you spend on your studies each week?", "short": "Quite a lot, actually.", "expand": "heavy workload | apart from / school / take extra classes / three evenings a week", "hint": "Kỹ thuật Personalization", "answer": "Quite a lot, actually. We have a heavy workload this year, and apart from school, I take extra classes three evenings a week.", "alt": "Quite a lot, actually. Apart from school, I take extra classes three evenings a week, because the workload this year is really heavy.", "note": "<i>apart from<\/i> = ngoài ra; chi tiết <i>three evenings a week<\/i> trả lời đúng <i>how much time<\/i>."}, {"level": 2, "q": "Do you have any plans for your studies in the next five years?", "short": "Yes, I do.", "expand": "hoping to / major in / law | then / maybe / do / master's degree / abroad", "hint": "Kỹ thuật Tense control (tương lai)", "answer": "Yes, I do. I'm hoping to major in law at university, and then maybe do a master's degree abroad.", "alt": "Yes, I do. First I'm hoping to major in law, and then I'd maybe like to do a master's degree abroad.", "note": "Nói về kế hoạch: <i>I'm hoping to / I'd like to / maybe<\/i>."}, {"level": 2, "q": "What changes would you like to see in your school?", "short": "I'd like to see more practical lessons.", "expand": "at the moment / most lessons / exam-focused | but / students / also / need / real-life skills", "hint": "Kỹ thuật But", "answer": "I'd like to see more practical lessons. At the moment, most lessons are very exam-focused, but students also need real-life skills.", "alt": "I'd like to see more practical lessons. Most lessons at the moment are really exam-focused, but students also need real-life skills, like managing money.", "note": "<i>But<\/i> nêu vấn đề hiện tại, làm rõ vì sao bạn muốn thay đổi."}, {"level": 3, "q": "Are you looking forward to working?", "short": "Yes, definitely.", "expand": "can't wait / earn / my own money | but / bit nervous / about / pressure", "hint": "Kỹ thuật But", "answer": "Yes, definitely. I can't wait to earn my own money. But I'm also a bit nervous about the pressure of a full-time job.", "alt": "Yes, definitely. I really can't wait to earn my own money, but I'm a bit nervous about the pressure, to be honest.", "note": "<i>can't wait to + V<\/i> (rất mong); <i>But<\/i> thêm cảm xúc trái chiều cho câu trả lời tự nhiên."}, {"level": 3, "q": "Why did you choose to study that subject?", "short": "I chose law mainly because of my dad.", "expand": "he / lawyer / always / talk about / cases | also / career prospects", "hint": "Kỹ thuật Personalization (dành cho sinh viên Luật)", "answer": "I chose law mainly because of my dad. He's a lawyer, and he always talked about his cases at dinner. Also, it has good career prospects.", "alt": "I chose law mainly because of my dad. He's a lawyer who always talked about his cases at home, and I also liked the career prospects.", "note": "Lý do cá nhân (bố là luật sư) thuyết phục hơn lý do chung chung. Học sinh cấp 3 có thể nói về ngành dự định học."}, {"level": 3, "q": "What are the benefits of being your age?", "short": "I'd say the biggest benefit is having few responsibilities.", "expand": "my parents / still / take care of / bills | can / focus on / studying | but / exam pressure", "hint": "Kỹ thuật Personalization + But", "answer": "I'd say the biggest benefit is having few responsibilities. My parents still take care of the bills, so I can focus on studying. But the exam pressure is real.", "alt": "I'd say the biggest benefit is having few responsibilities. Since my parents still take care of the bills, I can just focus on studying, but exam pressure is pretty intense.", "note": "Ba ý: lợi ích → lý do cụ thể → mặt trái. Đủ dài nhưng vẫn gọn."}], "title": "Bài tập 2: Mở rộng câu trả lời"}, "3": {"intro": "<i>Trả lời bằng 2-4 câu (khoảng 20-40 từ). Dùng cụm từ vựng cho sẵn và kỹ thuật mở rộng ở dòng gợi ý. Câu mẫu trong đáp án chỉ để tham khảo; hãy nói về cuộc sống thật của bạn.<\/i>", "items": [{"level": 1, "q": "What subjects are you studying?", "use": "<b>do well in<\/b>", "hint": "Kỹ thuật 5W1H (What) + But", "answer": "I'm in grade 11, so I study about ten subjects. I usually do well in maths, but literature is a real struggle for me."}, {"level": 1, "q": "Do you like your subject?", "use": "<b>my favourite subject<\/b>", "hint": "Kỹ thuật But", "answer": "Most of them, yes. My favourite subject is English because the lessons are fun. But I'm not a big fan of chemistry, to be honest."}, {"level": 1, "q": "Do you think that your subject is popular in your country?", "use": "<b>career prospects<\/b>", "hint": "Kỹ thuật 5W1H (Why)", "answer": "Yes, English is really popular in Vietnam. Most parents send their kids to English centres, mainly because it opens up better career prospects."}, {"level": 1, "q": "How much time do you spend on your studies each week?", "use": "<b>take extra classes<\/b>", "hint": "Kỹ thuật Personalization", "answer": "Probably around forty hours a week. Besides school, I take extra classes three evenings a week, and I also study on my own at weekends."}, {"level": 2, "q": "What changes would you like to see in your school?", "use": "<b>learning environment<\/b>", "hint": "Kỹ thuật But", "answer": "I'd love a more relaxed learning environment. Our school's great in many ways, but there's too much focus on tests, so students are always stressed."}, {"level": 2, "q": "What are the benefits of being your age?", "use": "<b>a heavy workload<\/b>", "hint": "Kỹ thuật But", "answer": "Well, I've got lots of energy and I can learn new things quickly. The only thing is that grade 11 comes with a heavy workload, so I don't have much free time."}, {"level": 2, "q": "What work do you do?", "use": "<b>I'm still a student<\/b>", "hint": "Kỹ thuật Personalization (khi chưa đi làm)", "answer": "I don't work yet, because I'm still a student. But I sometimes help my mum at her shop at weekends, which I guess is a kind of part-time job."}, {"level": 3, "q": "Why did you choose to study that subject?", "use": "<b>major in<\/b>", "hint": "Kỹ thuật Personalization (dành cho sinh viên Luật)", "answer": "I decided to major in law because I've always loved debating. In high school I was in the debate club, and my teachers kept saying I'd make a good lawyer."}, {"level": 3, "q": "Do you want to change your major?", "use": "<b>career prospects<\/b>", "hint": "Kỹ thuật But (dành cho sinh viên Luật)", "answer": "Not really. Law can be quite dry at times, but it has good career prospects, and I've started enjoying it more since I did an internship last summer."}, {"level": 3, "q": "What do you think is the most important at the moment?", "use": "<b>keep up with<\/b>", "hint": "Kỹ thuật Tense control (tương lai)", "answer": "Definitely the graduation exam next year. If I do well, I'll get into a good university, so right now I'm trying to keep up with all my classes."}], "title": "Bài tập 3: Trả lời câu hỏi trong bản dự đoán"}}}, {"num": 4, "name": "Home & Accommodation", "purpose": ["Phần lớn các bạn sống ở thành phố lớn cùng bố mẹ, trong <b>căn hộ chung cư<\/b> hoặc <b>nhà ống<\/b>. Unit này cho bạn từ vựng để mô tả đúng ngôi nhà đó: tầng mấy, phòng nào, rộng hay chật, gần trường hay xa.", "Lỗi hay gặp nhất là trả lời quá ngắn (<i>I live with my family.<\/i>). Hãy luôn thêm <b>một chi tiết cụ thể<\/b> (ai, phòng nào, tầng mấy) và <b>một cảm nhận hoặc thói quen của bạn<\/b>."], "vocab": [{"level": 1, "phrase": "live with my parents", "meaning": "sống cùng bố mẹ", "example": "I <b>live with my parents<\/b> and my younger brother."}, {"level": 1, "phrase": "a high-rise apartment", "meaning": "căn hộ chung cư cao tầng", "example": "We live in <b>a high-rise apartment<\/b> on the twelfth floor."}, {"level": 1, "phrase": "a tube house", "meaning": "nhà ống", "example": "My grandparents still live in <b>a narrow tube house<\/b> in the Old Quarter."}, {"level": 1, "phrase": "my own room", "meaning": "phòng riêng", "example": "I'm lucky to have <b>my own room<\/b>."}, {"level": 2, "phrase": "cosy", "meaning": "ấm cúng", "example": "Our living room is small but really <b>cosy<\/b>."}, {"level": 2, "phrase": "a bit cramped", "meaning": "hơi chật", "example": "The kitchen is <b>a bit cramped<\/b> when everyone's cooking."}, {"level": 2, "phrase": "natural light", "meaning": "ánh sáng tự nhiên", "example": "My room gets a lot of <b>natural light<\/b> in the morning."}, {"level": 2, "phrase": "personal space", "meaning": "không gian riêng", "example": "Having my own room gives me some <b>personal space<\/b>."}, {"level": 3, "phrase": "within walking distance of", "meaning": "trong khoảng cách đi bộ", "example": "Our flat is <b>within walking distance of<\/b> my school."}, {"level": 3, "phrase": "spacious", "meaning": "rộng rãi", "example": "One day I'd love a <b>spacious<\/b> house with a garden."}, {"level": 3, "phrase": "family gatherings", "meaning": "những buổi họp mặt gia đình", "example": "We have big <b>family gatherings<\/b> in the living room at Tet."}, {"level": 3, "phrase": "living conditions", "meaning": "điều kiện sống", "example": "Good <b>living conditions<\/b> help you rest and study better."}], "expandFormula": "Công thức: <b>trả lời ngắn → thêm lý do hoặc chi tiết (5W1H) → thêm mặt trái (But) hoặc trải nghiệm của riêng bạn (Personalization)<\/b>. Chỉ cần 2-4 câu.", "expand": [{"q": "Who do you live with?", "short": "My parents.", "tech": "5W1H (Who) + Personalization", "answer": "I <b>live with my parents<\/b> and my younger sister. We get on really well, although we argue about the TV sometimes."}, {"q": "Do you live in an apartment or a house?", "short": "An apartment.", "tech": "5W1H (Where)", "answer": "I live in <b>a high-rise apartment<\/b> on the twelfth floor. The view of the city is amazing at night."}, {"q": "What part of your home do you like the most?", "short": "My room.", "tech": "5W1H (Why) + But", "answer": "My bedroom, because it gets a lot of <b>natural light<\/b>. <b>But<\/b> it's always a bit messy, to be honest."}], "samples": [{"q": "Can you describe the place where you live?", "a": "It's a three-bedroom flat on the twelfth floor. It's not very big, but it's really cosy, and from the balcony we can see a big part of the city."}, {"q": "What's the difference between where you are living now and where you have lived in the past?", "a": "When I was little, we lived in a tube house that was a bit cramped. Now we live in an apartment, which is much brighter."}, {"q": "Do you plan to live there for a long time?", "a": "Probably not forever. After university, I'd like to rent a flat of my own, because I want more personal space."}], "mistakes": [{"bad": "I live with my parent.", "good": "I live with my parents.", "note": "Bố và mẹ là hai người → <i>parents<\/i> (đọc rõ âm cuối /ts/)."}, {"bad": "My apartment is in floor 12.", "good": "My apartment is on the twelfth floor.", "note": "Tầng: dùng <i>on the + số thứ tự + floor<\/i>."}, {"bad": "Who do you live with? → I live with my family.", "good": "I live with my parents and my younger sister. We get on really well.", "note": "Quá ngắn và chung chung. Nói rõ là ai và thêm một ý."}], "choose": [{"h": "house / home", "html": "<b>house<\/b> là ngôi nhà (tòa nhà): We live in a tube <b>house<\/b>. · <b>home<\/b> là nơi bạn sống, tổ ấm: I feel relaxed at <b>home<\/b>."}, {"h": "flat / apartment", "html": "Cả hai đều đúng: <i>flat<\/i> phổ biến trong tiếng Anh-Anh, <i>apartment<\/i> phổ biến trong tiếng Anh-Mỹ. Chọn một và dùng thống nhất."}], "sounds": {"lines": ["<b>-s/-es:<\/b> parent<b>s<\/b> /s/ · room<b>s<\/b> /z/ · hous<b>es<\/b> /ɪz/", "<b>Phụ âm cuối (đọc rõ, không nuốt):<\/b> fla<b>t<\/b> /t/ · bal<b>c<\/b>ony · bedroo<b>m<\/b> /m/", "<b>Trọng âm:<\/b> a<b>PART<\/b>ment · <b>BAL<\/b>cony · <b>COM<\/b>fortable"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}, "ex": {"1": {"intro": "<i>Nhìn gợi ý, nói to câu hoàn chỉnh (không đọc), rồi viết lại. Mỗi câu có một cụm từ vựng của chủ đề; hãy dùng đúng cụm đó.<\/i>", "items": [{"level": 1, "cue": "I / live with my parents / and / younger brother / in / apartment", "hint": "Thêm <i>my<\/i>, mạo từ <i>an<\/i>", "answer": "I live with my parents and my younger brother in an apartment.", "alt": "At the moment I live with my parents and my younger brother in an apartment in Hanoi.", "note": "<i>apartment<\/i> bắt đầu bằng nguyên âm → <i>an apartment<\/i>."}, {"level": 1, "cue": "our flat / be / twelfth floor / high-rise building", "hint": "Giới từ <i>on the … floor<\/i>, <i>of<\/i>", "answer": "Our flat is on the twelfth floor of a high-rise building.", "alt": "Our flat's on the twelfth floor of quite a new high-rise building.", "note": "<i>on the twelfth floor of<\/i> + tòa nhà."}, {"level": 1, "cue": "I / have / my own room / which / I / love", "hint": "Mệnh đề <i>which<\/i>", "answer": "I have my own room, which I really love.", "alt": "I've got my own room, which I absolutely love.", "note": "<i>which<\/i> thay cho cả <i>my own room<\/i>; có dấu phẩy trước <i>which<\/i>."}, {"level": 1, "cue": "living room / be / cosy / but / a bit cramped", "hint": "Thêm <i>The<\/i> và <i>it's<\/i>", "answer": "The living room is cosy, but it's a bit cramped.", "alt": "Our living room is really cosy, but it's a bit cramped when guests come.", "note": "<i>a bit<\/i> làm nhẹ ý chê, nghe lịch sự và tự nhiên."}, {"level": 2, "cue": "we / live / narrow tube house / near / city centre", "hint": "Mạo từ <i>a<\/i>, <i>the<\/i>", "answer": "We live in a narrow tube house near the city centre.", "alt": "Actually, we live in a narrow tube house quite near the city centre.", "note": "<i>tube house<\/i> (nhà ống) là cách gọi quen thuộc; <i>city centre<\/i> chính tả Anh-Anh."}, {"level": 2, "cue": "it / within walking distance of / my school", "hint": "Thêm <i>It's<\/i>", "answer": "It's within walking distance of my school.", "alt": "Luckily, it's within walking distance of my school, so I never need the bus.", "note": "<i>within walking distance of<\/i> + nơi chốn = đi bộ tới được."}, {"level": 2, "cue": "my room / get / lot of / natural light / in the morning", "hint": "Ngôi thứ ba số ít: <i>gets<\/i>", "answer": "My room gets a lot of natural light in the morning.", "alt": "In the morning, my room gets a lot of natural light, which wakes me up.", "note": "<i>my room<\/i> → <i>gets<\/i>; <i>natural light<\/i> không đếm được → <i>a lot of<\/i>."}, {"level": 3, "cue": "Say what you like about your room. Use \"personal space\".", "hint": "Câu chẻ <i>What I like most…<\/i>", "answer": "What I like most is that it gives me some personal space, especially when I need to study.", "alt": "I like it because it's my own personal space, so nobody bothers me when I'm studying.", "note": "<i>personal space<\/i> (không đếm được) thường đi với <i>some, my, a bit of<\/i>."}, {"level": 3, "cue": "Describe your dream home. Use \"spacious\" and \"would\".", "hint": "Câu giả định với <i>would<\/i>", "answer": "I'd love to live in a spacious house with a small garden, somewhere a bit quieter than the city centre.", "alt": "My dream home would be a spacious flat with a big balcony, where I could grow plants.", "note": "Nói về điều mong muốn: <i>I'd love to / would be / could<\/i>."}, {"level": 3, "cue": "Say where your family spends most of the time. Use \"family gatherings\".", "hint": "Hai câu: nơi chốn + hoạt động", "answer": "We spend most of our time in the living room. That's where we watch TV after dinner, and it's also where we have family gatherings at Tet.", "alt": "Definitely the living room. We have family gatherings there at Tet, and on normal evenings we just chat and watch TV.", "note": "Câu thứ hai dùng <i>That's where…<\/i> để thêm chi tiết mà không lặp lại <i>living room<\/i>."}], "title": "Bài tập 1: Từ vựng chủ đề → câu nói"}, "2": {"intro": "<i>Câu trả lời ngắn chưa đủ ý. Nói lại câu ngắn, rồi mở rộng thêm 1-2 câu bằng gợi ý (mỗi dấu | là một câu mới hoặc một ý mới). Nói to trước, viết sau.<\/i>", "items": [{"level": 1, "q": "Who do you live with?", "short": "I live with my parents.", "expand": "and / younger sister | we / get on / really well", "hint": "Kỹ thuật 5W1H (Who) + Personalization", "answer": "I live with my parents and my younger sister. We get on really well, although we argue about the TV sometimes.", "alt": "I live with my parents and my younger sister, and luckily we all get on really well.", "note": "<i>get on well<\/i> = hòa thuận. <i>although…<\/i> thêm một chi tiết thật, làm câu trả lời sinh động."}, {"level": 1, "q": "Do you live in an apartment or a house?", "short": "I live in an apartment.", "expand": "on the twelfth floor / high-rise building | view / of the city / amazing at night", "hint": "Kỹ thuật 5W1H (Where)", "answer": "I live in an apartment on the twelfth floor of a high-rise building. The view of the city is amazing at night.", "alt": "I live in an apartment on the twelfth floor of a high-rise building, and at night the view of the city is amazing.", "note": "Thêm vị trí (tầng mấy) và một điều bạn thích (view)."}, {"level": 1, "q": "How long have you lived there?", "short": "About ten years now.", "expand": "we / move / there / when / I / be / in grade 1", "hint": "Kỹ thuật Tense control (quá khứ)", "answer": "About ten years now. We moved there when I was in grade 1, so it's basically the only home I remember.", "alt": "About ten years now. We moved there when I was in grade 1, and I've lived there ever since.", "note": "Mốc chuyển nhà ở quá khứ (<i>moved, was<\/i>); khoảng thời gian đến nay có thể dùng <i>I've lived<\/i>."}, {"level": 1, "q": "What part of your home do you like the most?", "short": "I like my bedroom the most.", "expand": "because / it / have / big window | so / it / get / lot of / natural light", "hint": "Kỹ thuật 5W1H (Why)", "answer": "I like my bedroom the most because it has a big window, so it gets a lot of natural light.", "alt": "I like my bedroom the most, mainly because it has a big window, so it gets a lot of natural light all day.", "note": "<i>because<\/i> nêu lý do, <i>so<\/i> nêu kết quả: hai từ nối đơn giản nhưng hiệu quả."}, {"level": 2, "q": "What room does your family spend most of the time in?", "short": "Definitely the living room.", "expand": "every evening / we / watch TV / together | it / a bit cramped / but / cosy", "hint": "Kỹ thuật 5W1H (When) + But", "answer": "Definitely the living room. Every evening we watch TV together there. It's a bit cramped, but it's really cosy.", "alt": "Definitely the living room. Every evening we watch TV together there, and honestly, it's a bit cramped, but it feels really cosy.", "note": "Kỹ thuật <i>But<\/i> ở đây đi theo chiều ngược lại: nói điểm chưa tốt trước, điểm tốt sau."}, {"level": 2, "q": "What do you usually do in your apartment?", "short": "Mostly I study in my room.", "expand": "but / at weekends / like / help / my mum / cook", "hint": "Kỹ thuật But + Personalization", "answer": "Mostly I study in my room. But at weekends I like to help my mum cook, which is a nice break from homework.", "alt": "Mostly I study in my room, but at weekends I like helping my mum cook dinner.", "note": "Cấu trúc <i>help someone (to) do something<\/i>: <i>help my mum cook<\/i> (giúp mẹ nấu ăn)."}, {"level": 2, "q": "Are the transport facilities to your home very good?", "short": "Yes, they're pretty good.", "expand": "bus stop / right outside / building | but / during rush hour / traffic / nightmare", "hint": "Kỹ thuật 5W1H (Where) + But", "answer": "Yes, they're pretty good. There's a bus stop right outside our building. But during rush hour, the traffic is a nightmare.", "alt": "Yes, they're pretty good. The bus stop is right outside my building, which helps a lot, but the traffic during rush hour can be a nightmare.", "note": "<i>a nightmare<\/i> (cơn ác mộng) là cách nói thân mật, tự nhiên để chê giao thông."}, {"level": 3, "q": "Do you plan to live there for a long time?", "short": "Probably not forever.", "expand": "after / university / like / rent / flat / of my own | because / want / personal space", "hint": "Kỹ thuật Tense control (tương lai)", "answer": "Probably not forever. After university, I'd like to rent a flat of my own, because I want a bit more personal space.", "alt": "Probably not forever. I'd like to rent a flat of my own after university, mainly because I want more personal space.", "note": "<i>a flat of my own<\/i> = căn hộ của riêng mình; <i>I'd like to<\/i> cho kế hoạch."}, {"level": 3, "q": "What kind of house or apartment do you want to live in in the future?", "short": "I'd love a house with a garden.", "expand": "spacious | somewhere / quieter / than / city centre | but / still / close to / work", "hint": "Kỹ thuật 5W1H (Where) + But", "answer": "I'd love a spacious house with a garden, somewhere quieter than the city centre. But it would still need to be close to work.", "alt": "Ideally, I'd love a spacious house with a big garden, somewhere quieter than the city centre, but still close to work so I don't waste hours commuting.", "note": "So sánh hơn <i>quieter than<\/i>; <i>But<\/i> thêm một điều kiện thực tế."}, {"level": 3, "q": "Do you think it is important to live in a comfortable environment?", "short": "Yes, I think it's really important.", "expand": "because / living conditions / affect / mood | for example / when / room / messy / can't / focus", "hint": "Kỹ thuật 5W1H (Why) + Personalization", "answer": "Yes, I think it's really important, because our living conditions affect our mood. For example, when my room is messy, I just can't focus.", "alt": "Yes, I think it's really important, because living conditions affect your mood. For example, I can't focus at all when my room is messy.", "note": "Ý chung (<i>living conditions affect our mood<\/i>) + ví dụ của bản thân (<i>when my room is messy<\/i>)."}], "title": "Bài tập 2: Mở rộng câu trả lời"}, "3": {"intro": "<i>Trả lời bằng 2-4 câu (khoảng 20-40 từ). Dùng cụm từ vựng cho sẵn và kỹ thuật mở rộng ở dòng gợi ý. Câu mẫu trong đáp án chỉ để tham khảo; hãy nói về cuộc sống thật của bạn.<\/i>", "items": [{"level": 1, "q": "What kinds of accommodation do you live in?", "use": "<b>a high-rise apartment<\/b>", "hint": "Kỹ thuật 5W1H (Where + What)", "answer": "I live in a high-rise apartment in Cau Giay district with my parents. It's a typical modern building, with about thirty floors and a small supermarket downstairs."}, {"level": 1, "q": "Can you describe the place where you live?", "use": "<b>cosy<\/b>", "hint": "Kỹ thuật 5W1H (What + Where)", "answer": "Sure. It's a three-bedroom flat on the twelfth floor. It's not very big, but it's really cosy, and from the balcony we can see a big part of the city."}, {"level": 1, "q": "Please describe the room you live in.", "use": "<b>my own room<\/b>", "hint": "Kỹ thuật Personalization", "answer": "I have my own room, which is quite small. There's a bed, a desk by the window and a huge pile of exam books, so it's a bit messy, to be honest."}, {"level": 1, "q": "What's your favourite room in your apartment or house?", "use": "<b>natural light<\/b>", "hint": "Kỹ thuật 5W1H (Why + When)", "answer": "My favourite room is my bedroom. It gets a lot of natural light in the morning, so it's the perfect place to study before school."}, {"level": 2, "q": "Do you prefer living in a house or an apartment?", "use": "<b>spacious<\/b>", "hint": "Kỹ thuật But", "answer": "I'd say I prefer a house, because it's usually more spacious. That said, apartments in big cities are often safer and more convenient, so I can see why my parents chose one."}, {"level": 2, "q": "What makes you feel pleasant in your home?", "use": "<b>relaxed atmosphere<\/b>", "hint": "Kỹ thuật Personalization", "answer": "Mainly the relaxed atmosphere. After a long day at school, I love having dinner with my family, when everyone puts their phones away and just chats."}, {"level": 2, "q": "Who do you live with?", "use": "<b>get on well with<\/b>", "hint": "Kỹ thuật Personalization", "answer": "I live with my parents and my grandmother. I get on really well with her, and she always cooks my favourite dishes when I have exams."}, {"level": 3, "q": "What's the difference between where you are living now and where you have lived in the past?", "use": "<b>a bit cramped<\/b>", "hint": "Kỹ thuật Tense control (quá khứ → hiện tại)", "answer": "When I was little, we lived in a tube house that was a bit cramped and quite dark. Now we live in an apartment, which is brighter and much quieter."}, {"level": 3, "q": "What kind of house or apartment do you want to live in in the future?", "use": "<b>within walking distance of<\/b>", "hint": "Kỹ thuật 5W1H (Where) + câu với <i>would<\/i>", "answer": "I'd love a small house with a garden, ideally within walking distance of a park. I'd also want a big kitchen, because I really enjoy cooking."}, {"level": 3, "q": "Do you think it is important to live in a comfortable environment?", "use": "<b>living conditions<\/b>", "hint": "Kỹ thuật 5W1H (Why) + câu điều kiện", "answer": "Yes, definitely. Good living conditions help you rest properly. If my home were noisy or uncomfortable, I don't think I could study well."}], "title": "Bài tập 3: Trả lời câu hỏi trong bản dự đoán"}}}, {"num": 5, "name": "Hometown", "purpose": ["Phần lớn các bạn sinh ra và lớn lên ở thành phố lớn, nên các câu mẫu trong Unit này nói về <b>Hà Nội<\/b>. Nếu quê bạn ở tỉnh khác, hãy giữ nguyên cấu trúc và cụm từ, chỉ thay thông tin.", "Bản dự đoán có <b>15 câu hỏi<\/b> về Hometown. Câu hỏi dễ, nên giám khảo chú ý xem bạn có <b>mở rộng được ý<\/b> và <b>dùng từ vựng cụ thể<\/b> (street food, traffic jams, cultural heritage) thay vì chỉ nói <i>beautiful, crowded, a lot of people<\/i> hay không."], "vocab": [{"level": 1, "phrase": "be born and raised in", "meaning": "sinh ra và lớn lên ở", "example": "I was <b>born and raised in<\/b> Hanoi."}, {"level": 1, "phrase": "the capital city", "meaning": "thủ đô", "example": "Hanoi is <b>the capital city<\/b> of Vietnam."}, {"level": 1, "phrase": "be famous for", "meaning": "nổi tiếng về", "example": "It's <b>famous for<\/b> its street food, especially pho."}, {"level": 1, "phrase": "traffic jams", "meaning": "kẹt xe", "example": "There are <b>traffic jams<\/b> almost every day."}, {"level": 2, "phrase": "street food", "meani ủ đề; hãy dùng đúng cụm đó.<\/i>", "items": [{"level": 1, "cue": "I / born and raised / Hanoi", "hint": "Bị động quá khứ <i>was<\/i>; giới từ <i>in<\/i>", "answer": "I was born and raised in Hanoi.", "alt": "Actually, I was born and raised right here in Hanoi.", "note": "<i>be born and raised in<\/i> + nơi chốn; cần <i>was<\/i>."}, {"level": 1, "cue": "Hanoi / be / capital city / Vietnam", "hint": "Mạo từ <i>the<\/i>, giới từ <i>of<\/i>", "answer": "Hanoi is the capital city of Vietnam.", "alt": "As you probably know, Hanoi is the capital city of Vietnam.", "note": "<i>the capital city of<\/i> + tên nước."}, {"level": 1, "cue": "it / famous for / street food / especially / pho", "hint": "Thêm <i>It's<\/i> và <i>its<\/i>", "answer": "It's famous for its street food, especially pho.", "alt": "It's really famous for street food, especially pho and bun cha.", "note": "<i>famous for<\/i> + danh từ; <i>especially<\/i> đưa ra ví dụ cụ thể."}, {"level": 1, "cue": "there / be / lot of / traffic jams / during rush hour", "hint": "<i>there are<\/i> + danh từ số nhiều", "answer": "There are a lot of traffic jams during rush hour.", "alt": "During rush hour, there are a lot of traffic jams everywhere.", "note": "<i>traffic jams<\/i> số nhiều → <i>there are<\/i>. Đọc rõ /z/ cuối <i>jams<\/i>."}, {"level": 2, "cue": "city / have / over a thousand years of history", "hint": "Thêm <i>The<\/i>, động từ chia <i>has<\/i>", "answer": "The city has over a thousand years of history.", "alt": "The city actually has over a thousand years of history, which is amazing.", "note": "<i>history<\/i> không đếm được; <i>over a thousand years of history<\/i> là cụm cố định."}, {"level": 2, "cue": "I / proud of / its cultural heritage", "hint": "Thêm <i>am<\/i>", "answer": "I'm really proud of its cultural heritage.", "alt": "To be honest, I'm quite proud of its cultural heritage.", "note": "<i>be proud of<\/i> + danh từ."}, {"level": 2, "cue": "air pollution / get / worse / in winter", "hint": "Hiện nt": "Kỹ thuật 5W1H (Why) + But", "answer": "Yes, I do. I love the fast pace of life here. But sometimes I need a break, so I visit my grandparents in the countryside.", "alt": "Yes, I do, because I love the fast pace of life. But sometimes I need a break from it, so I go to the countryside for a few days.", "note": "<i>But<\/i> thêm mặt trái tự nhiên, không phải chê quê mình."}, {"level": 2, "q": "What do you like (most) about your hometown?", "short": "What I like most is the street food.", "expand": "food stall / on every corner | cheap / and / delicious", "hint": "Kỹ thuật 5W1H (Where)", "answer": "What I like most is the street food. There's a food stall on every corner, and everything's cheap and delicious.", "alt": "What I like most is the street food. You can find a food stall on every corner, and it's cheap and delicious.", "note": "Câu chẻ <i>What I like most is…<\/i> + chi tiết cụ thể (<i>on every corner<\/i>)."}, {"level": 2, "q": "Is there anything you dislike about it?", "short": "Yes, the traffic.", "expand": "traffic jams / every day | air pollution / also / pretty bad / in winter", "hint": "Kỹ thuật 5W1H (When)", "answer": "Yes, the traffic. There are traffic jams every day, and the air pollution is also pretty bad in winter.", "alt": "Yes, the traffic. We get traffic jams every day, and in winter the air pollution is also pretty bad.", "note": "Hai vấn đề cụ thể, mỗi vấn đề có một chi tiết thời gian."}, {"level": 3, "q": "Do you think you will continue living there for a long time?", "short": "Yes, I think so.", "expand": "family / friends / here | job opportunities | but / might / study abroad / first", "hint": "Kỹ thuật Personalization + But", "answer": "Yes, I think so. My family and friends are all here, and there are lots of job opportunities. But I might study abroad for a few years first.", "alt": "Yes, I think so, because my family and friends are here and there are good job opportunities. But I might study abroad first.", "note": "Câu hỏi
