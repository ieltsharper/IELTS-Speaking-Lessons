proximity<\/b>", "hint": "Technique: 5W1H (Where + What)", "answer": "I live in a high-rise flat in Cau Giay district. It's in close proximity to my school and a big supermarket, which is really convenient.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "Can you describe the place where you live?", "qnum": "Q10", "use": "<b>living conditions<\/b>", "hint": "Technique: 5W1H (What + Where)", "answer": "Sure. It's a three-bedroom flat on the twelfth floor. The living conditions are pretty good: it's bright and quiet, and from the balcony we can see a big part of the city.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "Please describe the room you live in.", "qnum": "Q12", "use": "<b>personal space<\/b>", "hint": "Technique: Personalisation", "answer": "It's quite small, with a bed, a desk and a huge pile of exam books. But it's my own personal space, so I can study without being disturbed.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "What's your favourite room in your apartment or house?", "qnum": "Q13", "use": "<b>shared experiences<\/b>", "hint": "Technique: Personalisation", "answer": "My favourite room is the kitchen, believe it or not. My grandma and I cook there every Sunday, so it's full of shared experiences.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "What makes you feel pleasant in your home?", "qnum": "Q14", "use": "<b>extended family<\/b>", "hint": "Technique: Personalisation", "answer": "Mainly the people. I live in an extended family, so there's always someone to chat with when I get home from school.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Do you like the area that you live in?", "qnum": "Q19", "use": "<b>local community<\/b>", "hint": "Technique: 5W1H (What + Why)", "answer": "Yes, I do. There's a strong local community spirit, and everything I need, like shops and a market, is just a short walk away.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Where do you like to go in that area?", "qnum": "Q20", "use": "<b>social interaction<\/b>", "hint": "Technique: 5W1H (Where + When + What)", "answer": "Usually the small park near my building. There's lots of social interaction there in the evenings, with people dancing, playing badminton and chatting.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Do you know any of your neighbours?", "qnum": "Q23", "use": "<b>get on well with<\/b>", "hint": "Technique: Personalisation", "answer": "Yes, a few of them. My mum gets on well with the family next door, so we often swap food during Tet.", "model": true, "kind": "write", "suggest": true}]}]}, {"num": 5, "name": "Hometown", "theory": [{"type": "sub", "text": "Mục đích"}, {"type": "p", "html": "Unit này luyện <b>12 cụm từ trong handout (mục 3.1)<\/b> cho câu hỏi Q1-Q13. Câu mẫu nói về <b>Hà Nội<\/b> vì phần lớn các bạn sinh ra và lớn lên ở đây; nếu quê bạn ở nơi khác, giữ cấu trúc và thay thông tin."}, {"type": "p", "html": "Như handout đã lưu ý (TENSE TRAP), chủ đề này <b>trộn nhiều thì<\/b>: Q1 (<i>Have you learned…?<\/i>) hiện tại hoàn thành, Q2 và Q11 (<i>Did you learn…?<\/i>) quá khứ đơn, Q7 (<i>How long have you been living…?<\/i>) hiện tại hoàn thành."}, {"type": "sub", "text": "Từ vựng hay cho chủ đề"}, {"type": "table", "head": ["Phrase", "Meaning", "Example in speech"], "rows": [{"level": 1, "cells": ["urban area", "khu vực đô thị", "I grew up in a busy <b>urban area<\/b>, right in the centre of Hanoi."]}, {"level": 1, "cells": ["rural area", "khu vực nông thôn", "My grandparents live in a quiet <b>rural area<\/b> outside the city."]}, {"level": 1, "cells": ["public transport", "giao thông công cộng", "<b>Public transport<\/b> is getting better, especially the metro."]}, {"level": 1, "cells": ["local culture", "văn hóa địa phương", "As a kid, I learned a lot about the <b>local culture<\/b> from my grandparents."]}, {"level": 2, "cells": ["local community", "cộng đồng địa phương", "The <b>local community<\/b> in my alley organises a party every Mid-Autumn Festival."]}, {"level": 2, "cells": ["cultural heritage", "di sản văn hóa", "I'm proud of the city's <b>cultural heritage<\/b>, like the Temple of Literature."]}, {"level": 2, "cells": ["natural environment", "môi trường tự nhiên", "The <b>natural environment<\/b> could be better, mainly because of air pollution."]}, {"level": 2, "cells": ["social interaction", "tương tác xã hội", "Street food stalls create lots of <b>social interaction<\/b> between neighbours."]}, {"level": 3, "cells": ["historical background", "bối cảnh lịch sử", "Hanoi has a rich <b>historical background<\/b>; it's over a thousand years old."]}, {"level": 3, "cells": ["rapid expansion", "mở rộng nhanh chóng", "The city has seen <b>rapid expansion<\/b>, with new districts everywhere."]}, {"level": 3, "cells": ["living standards", "mức sống", "<b>Living standards<\/b> have improved a lot since my parents were young."]}, {"level": 3, "cells": ["geographical location", "vị trí địa lý", "Its <b>geographical location<\/b> on the Red River helped it grow into a big city."]}]}, {"type": "sub", "text": "Từ vựng bổ sung để nói về Hà Nội"}, {"type": "table", "head": ["Phrase", "Meaning", "Example in speech"], "rows": [{"level": 1, "cells": ["be born and raised in", "sinh ra và lớn lên ở", "I was <b>born and raised in<\/b> Hanoi."]}, {"level": 1, "cells": ["street food", "đồ ăn đường phố", "It's famous for its <b>street food<\/b>, especially pho."]}, {"level": 2, "cells": ["traffic jams / air pollution", "kẹt xe / ô nhiễm không khí", "The <b>traffic jams<\/b> and <b>air pollution<\/b> are the worst parts."]}, {"level": 3, "cells": ["job opportunities", "cơ hội việc làm", "There are plenty of <b>job opportunities<\/b>, especially in tech."]}]}, {"type": "sub", "text": "Từ câu ngắn đến câu trả lời đầy đủ"}, {"type": "p", "html": "Công thức: <b>trả lời trực tiếp + ít nhất 1 trong 3 kỹ thuật<\/b>: 1-2 chi tiết cụ thể (5W1H), một điều thật về bạn (Personalisation) hoặc đúng thì (Tense control). Chỉ cần 2-4 câu."}, {"type": "table", "head": ["Question + short answer", "Technique", "Extended answer"], "rows": [{"level": 0, "cells": ["<i>Q3 Is that a big city or a small place?<\/i> → A big city.", "5W1H (What)", "It's a really big city. It's the capital, and over eight million people live there."]}, {"level": 0, "cells": ["<i>Q4 Do you like your hometown?<\/i> → Yes.", "5W1H (Why) + Personalisation", "Yes, I do. I'm proud of its <b>cultural heritage<\/b>, and all my childhood memories are here."]}, {"level": 0, "cells": ["<i>Q2 Did you learn about the culture of your hometown in your childhood?<\/i> → Yes.", "Tense control + Personalisation", "Yes, I did. Every Mid-Autumn Festival, my grandparents <b>took<\/b> me to Hang Ma Street to see the lanterns."]}]}, {"type": "sub", "text": "Câu mẫu"}, {"type": "samples", "items": ["<i>Q9 Please describe your hometown a little.<\/i> → Sure. Hanoi is the capital of Vietnam. It's a mix of old and new: narrow streets in the Old Quarter and modern skyscrapers in the newer districts.", "<i>Q7 How long have you been living there?<\/i> → My whole life. <b>I've lived<\/b> here since I was born, and I've never lived anywhere else.", "<i>Q13 Is your hometown a good place for young people to pursue their careers?<\/i> → Yes, I'd say so. There are lots of <b>job opportunities<\/b>. The only problem is the cost of living, which is pretty high."]}, {"type": "mistakes", "items": [{"bad": "Hanoi is famous with pho.", "good": "Hanoi is famous for pho.", "note": "Kết hợp từ đúng là <i>famous for<\/i> hoặc <i>known for<\/i>."}, {"bad": "I live in Hanoi since I was born.", "good": "I've lived in Hanoi since I was born.", "note": "<i>since<\/i> + mốc thời gian → hiện tại hoàn thành <i>I've lived<\/i> (hoặc <i>I've been living<\/i>)."}, {"bad": "Yes, I like my hometown because it has many advantages. Firstly, it is beautiful.", "good": "Yes, I love it. I'm really attached to the lakes and the street food.", "note": "Từ nối kiểu bài luận (<i>Firstly, In conclusion<\/i>) nghe như học thuộc (handout, bài Revision)."}]}, {"type": "choose", "items": [{"h": "<b>famous for / known for<\/b>", "html": "It's <b>famous for<\/b> its street food. · It's best <b>known for<\/b> Hoan Kiem Lake. (Không dùng <i>famous with<\/i>, <i>famous by<\/i>.)"}, {"h": "<b>I've lived / I've been living<\/b>", "html": "Với <i>live<\/i>, cả hai đều đúng: <b>I've lived here since I was born.<\/b> · <b>I've been living here since I was born.<\/b> Dạng tiếp diễn nhấn vào quá trình."}]}, {"type": "sounds", "lines": ["<b>-s/-es:<\/b> lake<b>s<\/b> /s/ · festival<b>s<\/b> /z/ · provinc<b>es<\/b> /ɪz/", "<b>-ed:<\/b> rais<b>ed<\/b> /d/ · improv<b>ed<\/b> /d/ · visit<b>ed<\/b> /ɪd/", "<b>Trọng âm:<\/b> his<b>TOR<\/b>ical · ex<b>PAN<\/b>sion · geo<b>GRAPH<\/b>ical"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}], "exercises": [{"title": "Exercise 1: Topic vocabulary → spoken sentence", "intro": "<i>Look at the cues, say the full sentence aloud (without reading), then write it. Each sentence has one topic phrase; use that exact phrase.<\/i>", "items": [{"level": 1, "cue": "I / born and raised / Hanoi / busy urban area", "hint": "Past passive <i>was<\/i>; add <i>a<\/i>", "answer": "I was born and raised in Hanoi, a busy urban area in the north.", "model": false, "alt": "Actually, I was born and raised in Hanoi, which is a really busy urban area.", "note": "<i>be born and raised in<\/i>; cụm <i>a busy urban area<\/i> giải thích thêm về Hà Nội.", "kind": "write"}, {"level": 1, "cue": "public transport / in Hanoi / get / more modern", "hint": "Present continuous for a change", "answer": "Public transport in Hanoi is getting more modern.", "model": false, "alt": "These days, public transport in Hanoi is getting more modern, especially the metro.", "note": "<i>be getting + tính từ so sánh<\/i> diễn tả sự thay đổi đang diễn ra.", "kind": "write"}, {"level": 1, "cue": "my grandparents / live / quiet rural area / outside the city", "hint": "Add <i>in a<\/i>", "answer": "My grandparents live in a quiet rural area outside the city.", "model": false, "alt": "My grandparents still live in a quiet rural area just outside the city.", "note": "<i>in a rural area<\/i> (mạo từ <i>a<\/i>, giới từ <i>in<\/i>).", "kind": "write"}, {"level": 1, "cue": "I / proud of / local culture / here", "hint": "Add <i>am<\/i>, <i>the<\/i>", "answer": "I'm proud of the local culture here.", "model": false, "alt": "Honestly, I'm really proud of the local culture here.", "note": "<i>be proud of<\/i> + danh từ.", "kind": "write"}, {"level": 2, "cue": "Hanoi / famous for / cultural heritage / especially / old temples", "hint": "Add <i>is<\/i>, <i>its<\/i>", "answer": "Hanoi is famous for its cultural heritage, especially its old temples.", "model": false, "alt": "Hanoi is really famous for its cultural heritage, especially the old temples and pagodas.", "note": "<i>famous for<\/i> + danh từ; <i>especially<\/i> đưa ví dụ cụ thể.", "kind": "write"}, {"level": 2, "cue": "the city / undergo / rapid expansion | new districts / everywhere", "hint": "Present perfect <i>has undergone<\/i>", "answer": "The city has undergone rapid expansion, and there are new districts everywhere.", "model": false, "alt": "In recent years the city has undergone rapid expansion, with new districts everywhere.", "note": "<i>undergo<\/i> (bất quy tắc): <i>undergo, underwent, undergone<\/i>.", "kind": "write"}, {"level": 2, "cue": "in my alley / Mid-Autumn Festival / bring / lots of / social interaction", "hint": "Present simple", "answer": "In my alley, the Mid-Autumn Festival brings lots of social interaction between neighbours.", "model": false, "alt": "The Mid-Autumn Festival brings lots of social interaction in my alley, because all the kids play together.", "note": "<i>bring<\/i> chia <i>brings<\/i> (chủ ngữ số ít).", "kind": "write"}, {"level": 3, "cue": "Say what the city's history is like. Use \"historical background\".", "hint": "Two sentences: comment + detail", "answer": "Hanoi has a really rich historical background. It was the capital under several dynasties, and it's over a thousand years old.", "model": false, "alt": "The city has a fascinating historical background, since it's been the capital for centuries.", "note": "Nhận xét chung → chi tiết cụ thể (over a thousand years).", "kind": "write"}, {"level": 3, "cue": "Say how life in the city has changed. Use \"living standards\".", "hint": "Present perfect + comparison", "answer": "Living standards have improved a lot. When my parents were young, few families had a car, but now lots of people do.", "model": false, "alt": "Living standards have gone up a lot. My parents grew up without a fridge, but now every home has one.", "note": "<i>have improved / have gone up<\/i> (hiện tại hoàn thành) + so sánh với thời bố mẹ.", "kind": "write"}, {"level": 3, "cue": "Describe the city's environment. Use \"natural environment\".", "hint": "Technique: 5W1H (What): one problem and one good point", "answer": "The natural environment could be better, mainly because of air pollution. Still, there are plenty of lakes, and they're lovely in the evening.", "model": false, "alt": "To be honest, the natural environment isn't great because of the air pollution, but the lakes are still beautiful.", "note": "<i>could be better<\/i> là cách chê nhẹ nhàng, tự nhiên khi nói.", "kind": "write"}]}, {"title": "Exercise 2: Extend the answer", "intro": "<i>The short answer is not enough. Say it again, then extend it by 1–2 sentences using the cues (each | starts a new sentence or idea). Speak first, then write.<\/i>", "items": [{"level": 1, "q": "Is that a big city or a small place?", "qnum": "Q3", "short": "It's a really big city.", "expand": "capital city | over eight million people / live / there", "hint": "Technique: 5W1H (What)", "answer": "It's a really big city. It's the capital city, and over eight million people live there.", "model": false, "note": "Câu hỏi chọn lựa: chọn <i>big city<\/i>, rồi đưa một con số để chứng minh.", "kind": "write", "suggest": true}, {"level": 1, "q": "How long have you been living there?", "qnum": "Q7", "short": "My whole life.", "expand": "I've lived / since / I / be / born | never / live / anywhere else", "hint": "Technique: Tense control (present perfect)", "answer": "My whole life. I've lived here since I was born, and I've never lived anywhere else.", "model": false, "note": "Câu hỏi <i>How long have you been living…?<\/i> → trả lời bằng <i>I've lived / I've been living… since…<\/i>.", "kind": "write", "suggest": true}, {"level": 1, "q": "What's your hometown famous for?", "qnum": "Q10", "short": "It's famous for its food.", "expand": "street food / especially / pho | also / known for / Hoan Kiem Lake", "hint": "Technique: 5W1H (What + Where)", "answer": "It's famous for its food, especially street food like pho. It's also known for Hoan Kiem Lake, right in the centre.", "model": false, "note": "Thêm 1-2 ví dụ cụ thể thay vì chỉ nói <i>food<\/i>.", "kind": "write", "suggest": true}, {"level": 1, "q": "Do you like your hometown?", "qnum": "Q4", "short": "Yes, I do.", "expand": "proud of / cultural heritage | all / my childhood memories / here", "hint": "Technique: Personalisation", "answer": "Yes, I do. I'm proud of its cultural heritage, and all my childhood memories are here.", "model": false, "note": "Lý do gắn với bạn (<i>my childhood memories<\/i>) tự nhiên hơn <i>it has many advantages<\/i>.", "kind": "write", "suggest": true}, {"level": 2, "q": "What do you like (most) about your hometown?", "qnum": "Q5", "short": "What I like most is the street food.", "expand": "food stall / on every corner | cheap / and / delicious", "hint": "Technique: 5W1H (Where + What)", "answer": "What I like most is the street food. There's a food stall on every corner, and everything's cheap and delicious.", "model": false, "note": "Câu chẻ <i>What I like most is…<\/i> + chi tiết cụ thể.", "kind": "write", "suggest": true}, {"level": 2, "q": "Is there anything you dislike about it?", "qnum": "Q6", "short": "Yes, the traffic.", "expand": "traffic jams / every day | air pollution / also / pretty bad / in winter", "hint": "Technique: 5W1H (When)", "answer": "Yes, the traffic. There are traffic jams every day, and the air pollution is also pretty bad in winter.", "model": false, "note": "Hai vấn đề cụ thể, mỗi vấn đề có một chi tiết thời gian.", "kind": "write", "suggest": true}, {"level": 2, "q": "Are there many young people in your hometown?", "qnum": "Q12", "short": "Yes, loads.", "expand": "students / from / other provinces / come / study | city / feel / young / energetic", "hint": "Technique: 5W1H (Who + Why)", "answer": "Yes, loads. Lots of students from other provinces come here to study, so the city feels really young and energetic.", "model": false, "note": "Giữ chủ đề <i>young people<\/i> (không chuyển sang <i>I<\/i>).", "kind": "write", "suggest": true}, {"level": 3, "q": "Did you learn about the culture of your hometown in your childhood?", "qnum": "Q2", "short": "Yes, I did.", "expand": "every Mid-Autumn Festival / grandparents / take / me / Hang Ma Street | local culture", "hint": "Technique: Tense control (past) + Personalisation", "answer": "Yes, I did. Every Mid-Autumn Festival, my grandparents took me to Hang Ma Street to see the lanterns. That's how I learned about the local culture.", "model": false, "note": "Câu hỏi quá khứ → <i>took / used to take<\/i>; kỷ niệm riêng làm câu trả lời thật.", "kind": "write", "suggest": true}, {"level": 3, "q": "Please describe your hometown a little.", "qnum": "Q9", "short": "Sure. It's the capital of Vietnam.", "expand": "in the north | mix of / old and new | narrow streets / Old Quarter / modern skyscrapers", "hint": "Technique: 5W1H (Where + What)", "answer": "Sure. It's the capital of Vietnam, in the north. It's a mix of old and new, with narrow streets in the Old Quarter and modern skyscrapers in newer districts.", "model": false, "note": "<i>a mix of old and new<\/i> + hai ví dụ đối lập.", "kind": "write", "suggest": true}, {"level": 3, "q": "Is your hometown a good place for young people to pursue their careers?", "qnum": "Q13", "short": "Yes, I'd say so.", "expand": "job opportunities / especially / tech and finance | only problem / cost of living", "hint": "Technique: 5W1H (What) + Personalisation", "answer": "Yes, I'd say so. There are lots of job opportunities, especially in tech and finance. The only problem is the cost of living, which is pretty high.", "model": false, "note": "Câu hỏi về <i>young people<\/i>: nói về cơ hội việc làm và một khó khăn thật.", "kind": "write", "suggest": true}]}, {"title": "Exercise 3: Answer the forecast questions", "intro": "<i>Answer in 2–4 sentences (about 20–40 words). Use the given phrase and the technique in the hint. The suggestion is only an example; talk about your real life.<\/i>", "items": [{"level": 1, "q": "Have you learned anything about the history of your hometown?", "qnum": "Q1", "use": "<b>historical background<\/b>", "hint": "Technique: Tense control (present perfect → past)", "answer": "Yes, I have. I've learned that the city has a rich historical background, and last year I visited the Temple of Literature, which is often called Vietnam's first university.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "Do you like living there?", "qnum": "Q8", "use": "<b>urban area<\/b>", "hint": "Technique: Personalisation", "answer": "Yes, I do. I've always lived in a busy urban area, so I'm used to the noise, and I love that there's always something going on.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "Did you learn about the history of your hometown at school?", "qnum": "Q11", "use": "<b>cultural heritage<\/b>", "hint": "Technique: Tense control (past)", "answer": "Yes, we did. We learned that Hanoi used to be called Thang Long, and our class went on a field trip to see the city's cultural heritage at the Imperial Citadel.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "Please describe your hometown a little.", "qnum": "Q9", "use": "<b>rapid expansion<\/b>", "hint": "Technique: 5W1H (Where + What)", "answer": "Sure. Hanoi is the capital of Vietnam, in the north. It's undergone rapid expansion recently, so you've got the old streets of the Old Quarter next to brand-new districts.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "What's your hometown famous for?", "qnum": "Q10", "use": "<b>cultural heritage<\/b>", "hint": "Technique: 5W1H (What + Where)", "answer": "It's best known for its street food and its cultural heritage. Tourists love trying pho in the Old Quarter and visiting the old temples around Hoan Kiem Lake.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "Is there anything you dislike about it?", "qnum": "Q6", "use": "<b>public transport<\/b>", "hint": "Technique: Personalisation", "answer": "Mostly the traffic. Public transport is improving, but it still doesn't reach my area, so I spend about forty minutes a day stuck in traffic on my way to school.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "Do you like your hometown?", "qnum": "Q4", "use": "<b>local community<\/b>", "hint": "Technique: Personalisation", "answer": "Yes, I really do. The local community in my alley is really close, so when I was little, all the neighbours treated me like their own kid.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Is your hometown a good place for young people to pursue their careers?", "qnum": "Q13", "use": "<b>living standards<\/b>", "hint": "Technique: 5W1H (Why)", "answer": "Yes, I'd say so. Living standards are higher here than in most provinces, and there are lots of jobs in tech and finance. The only problem is that rent is quite expensive.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Are there many young people in your hometown?", "qnum": "Q12", "use": "<b>social interaction<\/b>", "hint": "Technique: 5W1H (Who + Where)", "answer": "Yes, there are loads. Students from all over the country come here for university, so coffee shops are always full of social interaction, especially at weekends.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "How long have you been living there?", "qnum": "Q7", "use": "<b>rural area<\/b>", "hint": "Technique: Tense control (present perfect)", "answer": "I've been living here since I was born. My parents grew up in a rural area, though, so I've spent lots of summer holidays in the countryside too.", "model": true, "kind": "write", "suggest": true}]}]}], "guideTitle": "Hướng dẫn sử dụng"}</script>
<script type="application/json" id="audio">{"I live with my parents in an aPARTment on the twelfth floor.": "4acc354496fd", "We moved to Hanoi when I was six, and I've lived here ever since.": "da0ff38fb508", "There are lots of shops and restaurants in my NEIGHbourhood.": "6fa5cbc5de66", "I'm in grade 11, so I study about ten subjects , including CHEMistry and LITerature.": "cdf976cc8f13", "I live with my parents in an apartment.": "86d1f90e595e", "I live with my PARents in an aPARTment.": "86d1f90e595e", "My grandparents live in a quiet rural area.": "7603f429cbb3", "My GRANDparents live in a quiet RUral area.": "7603f429cbb3", "We moved to a bigger flat when I was seven.": "56bc7e35dddc", "We moved to a bigger flat when I was SEVen.": "56bc7e35dddc", "Public transport in Hanoi is getting better.": "11db6043e02f", "PUBlic TRANSport in Hanoi is getting better.": "fd41f05a4e4f", "My parents are proud of my academic achievements.": "66cc921fe109", "My parents are proud of my acaDEMic aCHIEVEments.": "66cc921fe109", "Living with my grandparents means we've shared lots of experiences.": "658846ff9ef1", "Living with my grandparents means we've shared lots of exPERiences.": "658846ff9ef1", "I'm making steady progress, but I'm snowed under with homework.": "06d7d722e68a", "I'm making steady PROgress, but I'm snowed under with homework.": "06d7d722e68a", "My hometown has a fascinating historical background.": "18202025fc4e", "My HOMEtown has a FAScinating hisTORical background.": "18202025fc4e", "The city has undergone rapid expansion, and living standards have improved.": "a58140ac417f", "The city has underGONE rapid exPANsion, and living STANdards have imPROVED.": "a58140ac417f", "Street markets encourage social interaction among residents.": "ec4d62eb98ad", "Street MARkets encourage social interACtion among RESidents.": "ec4d62eb98ad", "Every day, really. I live in an extended family, and my grandma always puts a plate of fruit on the table after dinner.": "c6d848bac65b", "Yes, definitely. I like watching the rice fields on long bus trips to my grandparents' village.": "8bdf9ad9a230", "Yes, I have. Last year I lost my wallet on the bus, and I never got it back.": "5a05cb966b9b", "Do you often feel tired?": "08b06d9790e5", "How often do you go shopping?": "9925a4b307c6", "Did you enjoy travelling by car when you were a kid?": "bbf22c514316", "Do you wear a watch?": "ecc8fdd24252", "Do you prefer online shopping or in-store shopping?": "327fe940ddae", "Have you ever returned anything you bought online?": "687b4035e036", "What kinds of websites do you often visit?": "7453a5e4b7b0", "Do you think it is important to wear a watch? Why?": "819f7d675072", "Did you prefer to do activities alone or with a group of people when you were a child?": "c6fa21333a2f", "Do you like taking pictures of different views?": "c7ccd61ca2ca", "What do you do when you feel tired?": "d005b5261e10", "I usually take a nap for about twenty minutes after lunch. It helps me feel fresh for my afternoon classes.": "b8ea6a88a108", "Do you like shopping?": "476a63b512c8", "Yes, I do, especially shopping for clothes. I usually go with my best friend at the weekend.": "802fff7a5c6d", "Do you prefer to sit by the window when travelling?": "762d2a6e7c49", "Yes, definitely. I like watching the rice fields on bus trips to my grandparents' village.": "9b9d96a84710", "Where do you usually buy fruit and vegetables?": "3cccd43ac34a", "My mum usually buys them at a local market near our house. She goes every morning, because it's cheaper and fresher than the supermarket.": "9594b23970c0", "What do you like to do when visiting a park?": "904b6ec2bd0a", "I like walking around, usually in the evening with my mum. We often stop to watch people dance or play badminton.": "68bd5b15b8c7", "Mostly learning websites, like online dictionaries. I use them almost every night for my homework.": "2db30e10be67", "What do you do when you see rubbish on the street?": "b49abd9ccd02", "I usually pick it up if it's near a bin. Otherwise, I put it in my bag until I get home.": "04b8128ffbba", "Have you seen an unforgettable and beautiful view or scenery?": "dd00f0d3a4e2", "Yes, I have. Last summer I saw the sunrise in Sa Pa. The mountains were covered in clouds, and it looked unreal.": "3c76c4d352c9", "How do you remember people's names?": "96cb646d33a3", "I try to link the name to something. For example, I remember a new classmate called Mai because my aunt has the same name.": "1f14d8ffd24d", "Is there anything you miss about your secondary school?": "57d19280e73b", "Yes, quite a few things. I really miss my old friends and the long summer holidays. In grade 9, we spent every afternoon together.": "75ab64f0c096", "Yes, quite often. I have a super hectic schedule this year, with school all day and extra classes three evenings a week.": "44e58afd7e88", "Not very often, actually. I still live with my parents, and my mum buys most of my clothes, so I only go when I need something special.": "0ebd1f10514f", "How often do you eat fruit and vegetables?": "03c8ca5ff19c", "Every single day. I live in an extended family, and my grandma always puts a big plate of fruit on the table after dinner.": "dcad525b2f92", "Do you listen to music while doing other things?": "f6777459e20c", "Yes, all the time. I'm preparing for the university entrance exam, so I put on some quiet piano music to help me focus while I revise.": "3515564bb957", "Do you like to keep things tidy?": "ba2ad4573b4a", "I try to, but it's not easy. I share a room with my younger sister, and her stuff always ends up on my desk.": "729105b91d46", "What is your favourite website?": "7168652a171d", "Probably a legal database my lecturers recommended. As a first-year law student, I use it almost every day to look up cases.": "8770f34c545a", "I have a terrible memory for names, so I save new classmates in my phone with a little note, like \"Minh, glasses, sits by the window\".": "add8fd52eadc", "What do you usually do when there is a traffic jam?": "2835421deddc", "I ride an electric bike to school, so I usually squeeze through the side streets. If that doesn't work, I put on a podcast and accept that I'll be late.": "72e70ba7f4a6", "Mostly I just walk around and look at the trees. I live in a high-rise flat with no garden, so being surrounded by green space is a real treat for me.": "5c04f532f4b8", "In what conditions would you use a computer or tablet?": "9442139ec9a9", "Mostly for revision. Since I'm preparing for the university entrance exam, I'd use my tablet every evening for practice tests, and I'd only play games once I'd finished.": "c9cb1ccc246f", "What was your favourite subject at secondary school?": "05d38f37146e", "My favourite subject was history.": "32097529952f", "I think my favourite subject was history, because the teacher told great stories.": "77320584b77e", "Did you recycle when you were a kid?": "3868902b82fe", "Not really. I didn't really think about it when I was a kid.": "ff7ada25bff4", "Not really. Back then, I didn't think about it much.": "731c24b2fc56", "Have you ever lost your keys?": "9eff703f43cd", "Yes, I have. I lost them at school last month.": "f018199660fd", "Yes, I have. Last month I lost them somewhere at school.": "9def38f5a9fa", "When was the first time you used a computer or tablet?": "89ac62748390", "I first used a computer when I was about six.": "abda54ca2ee5", "I think I first used a computer when I was about six, at my uncle's house.": "ef2528109dbd", "Will you post on social media if you lose your item?": "74cb57b60114", "Yes, I probably will, if it's something important.": "f33c6cee6c3b", "If it's something important, then yes, I probably will.": "35d79322db30", "What would your life be like without computers or tablets?": "a88ffb6b4a6d", "It would be much harder, especially for studying.": "8f8ed5a24f8d", "Honestly, life would be much harder, especially when it comes to studying.": "1fc79bdafa6c", "How are the parks today different from those you visited as a kid?": "9b2f43e390a8", "When I was a kid, parks used to be quieter, but these days they're busier.": "4bb8bef50e2d", "Parks used to be quieter when I was a kid, but these days they're always crowded.": "c3793ba6a0d0", "Are there any differences between the activities you liked when you were a child and those you like now?": "b2cc35c628ac", "Yes, quite a lot. I used to love playing outside, but these days I tend to stay in and read.": "c97a94559309", "Definitely. I used to spend hours outdoors, whereas these days I tend to stay at home with my books.": "e2031501ce73", "Did you keep your room tidy as a child?": "0f2ae25b11b7", "Not at all. My mum always had to remind me to clean it up.": "104ce547e553", "Not at all, to be honest. My mum always had to tell me to tidy it.": "12dec9cac46b", "Will you buy an expensive car in the future?": "082127a0dad5", "I doubt it. I'd rather spend my money on travelling.": "5803b3f6a523", "Honestly, I doubt it. I'd rather spend money on things like travelling or education.": "7e9668c1cb0d", "My parents put my academic achievements on the fridge.": "0beaa823063f", "I'm under a lot of pressure this year because of exams.": "daa7cd970ebb", "I'm making steady progress with my speaking.": "62289a121ec0", "Before exams, I'm snowed under with homework.": "12fdaf209d88", "Lack of sleep really affects my academic performance.": "4b46b2ce53f9", "I'm still trying to get the hang of essay writing.": "603f24ad658d", "I'm working towards a band 6.5.": "63c81098249b", "I hope to go into higher education in Hanoi.": "a1e168068225", "My school has a really supportive learning environment.": "ebe8445688e8", "When three tests fall on one day, I can get a bit overwhelmed.": "cf5b0015bf6c", "My English has come a long way since grade 10.": "fae536402f51", "Studying law is challenging but rewarding.": "06294682a5e8", "Debating helps me develop critical thinking.": "44445e1e02c5", "I want a deep understanding of how the law works.": "e4726c67b278", "During project weeks, we're up against tight deadlines.": "6b99f366bba0", "My dad believes in lifelong learning; he's learning Korean at 50.": "2c2c95e5dbfe", "Quite a lot, actually. I'm snowed under with homework this year, and I take extra classes three evenings a week.": "2dbb5e3f3d27", "I mostly use my laptop. I look up new words in an online dictionary every night, for about an hour.": "5c5a7935d764", "I don't work yet, because I'm still a student. Right now I'm working towards a good score in the university entrance exam.": "234d7264c77f", "Definitely the mornings. My mind's much fresher then, whereas in the afternoons I often feel sleepy after lunch.": "8ce10268d649", "Yes, I do. I'm hoping to go into higher education in law, and then maybe do a master's degree abroad.": "38a540c25b05", "I chose law because I wanted a deep understanding of how society works, and it's challenging but rewarding.": "9e72f6724f31", "My parents are really proud of my academic achievements.": "aa30eada5b0e", "My parents are proud of my academic achievements, especially in maths.": "d2374d14d942", "I'm under a lot of pressure this year.": "44a6d89b0903", "This year I'm under a lot of pressure because of the exams.": "f1b4abdcd246", "I'm making steady progress with my English.": "3f8a2f114ec7", "Thanks to my teacher, I'm making steady progress with my English.": "4765bdcb7eeb", "I'm snowed under with homework before exams.": "2afd2f357d87", "Before exams, I'm always snowed under with homework.": "8fc3a517fbed", "Honestly, lack of sleep really affects my academic performance, especially in maths.": "a61f69d703dd", "To be honest, I'm still trying to get the hang of essay writing.": "eb5afc8c9eeb", "I'm working towards a band 6.5 in IELTS.": "f429f9fa2283", "At the moment I'm working towards a band 6.5 in IELTS.": "bd23df4c5dbd", "I've come a long way since grade 10. Back then I could hardly speak, but now I can chat with my teacher in English.": "69c89e31abf8", "My English has come a long way since grade 10. I used to freeze when I spoke, but now I feel much more confident.": "c54081a1c012", "I'm planning to go into higher education, hopefully studying law at a university in Hanoi.": "01d16700b206", "After high school, I'm hoping to go into higher education, probably in economics.": "c5bc12b1c6d2", "My school has a really supportive learning environment. The teachers encourage critical thinking, so we're always asked to explain our opinions.": "fc60b22d9019", "The learning environment at my school is quite competitive, but our teachers do encourage critical thinking in class discussions.": "999505e0e3b9", "What subjects are you studying?": "84d1a3215871", "I'm studying lots of subjects, but at the moment I spend most of my time on maths and English, because I need them for the university entrance exam.": "8c5b11b526fd", "Do you prefer to study in the mornings or in the afternoons?": "af4779fedced", "I prefer the mornings, because my mind is much fresher. In the afternoons, I often feel sleepy after lunch.": "25475fc45665", "What technology do you use when you study?": "9e31ca65dde5", "I mostly use my laptop. I look up new words in an online dictionary every night, usually for about an hour.": "3bf80564493d", "How much time do you spend on your studies each week?": "46129a7471e3", "Quite a lot, actually. I'm snowed under with homework this year, and apart from school, I take extra classes three evenings a week.": "6155c28126c7", "Do you have any plans for your studies in the next five years?": "2d5e11cdfc0a", "What changes would you like to see in your school?": "01f4625e4d2a", "I'd like to see more practical lessons. At the moment, most lessons are very exam-focused, so there's no time for critical thinking.": "9436e7014637", "Are you looking forward to working?": "946aca600937", "Yes, definitely. I can't wait to earn my own money, although I'm a bit nervous about the pressure of a full-time job.": "b8e95f6e01e4", "Why did you choose to study that subject?": "f6521606f287", "I chose law mainly because of my dad. He's a lawyer, and he always says his job is challenging but rewarding.": "83b2b02e5257", "What are the benefits of being your age?": "cf75f97eb975", "I'd say the biggest benefit is having few responsibilities. My parents still take care of the bills, so I can focus on studying, although I'm under a lot of pressure from exams.": "60429a8d8cfd", "What do you think is the most important at the moment?": "beb6905029f9", "For me, it's definitely the university entrance exam next summer. I'm working towards a place at a good university, so every hour counts right now.": "318b4b44a58c", "I'm in grade 11, so I study about ten subjects. I'm doing well in maths, and I'm making steady progress in English, but literature is still a real struggle.": "c1b76db5638d", "Do you think that your subject is popular in your country?": "f8237addae8b", "Yes, English is really popular in Vietnam. Lots of students learn it because they want to go into higher education abroad one day.": "f70a0478b979", "Probably around forty hours a week. I'm under a lot of pressure this year, so besides school, I also take extra classes and study at weekends.": "61543a69f580", "I'd love a more relaxed learning environment. There's too much focus on tests at my school, so students are always stressed.": "5b41a03a3597", "I think young people pick things up quickly. For example, I got the hang of video editing in just a week, while my dad is still struggling with it.": "40e0a5f0938d", "What work do you do?": "03b4dbab1852", "I don't work yet, because I'm still a student. Right now I'm working towards a good score in the university entrance exam, which feels like a full-time job.": "f6d11d805c88", "Do you miss being a student?": "703e9ea82e9c", "I'm still a student, so not yet! But I'm sure I'll miss my classmates one day, because we've been through so much together.": "4a3a9b89100b", "I chose law because I wanted a deep understanding of how society works. I was in the debate club in high school, and my teachers kept saying I'd make a good lawyer.": "293fd63f2fd6", "Do you want to change your major?": "6da1780ff3f2", "Not really. Law is challenging but rewarding, and I've enjoyed it much more since I did an internship last summer.": "896aa009649c", "Yes, I'm hoping to finish a law degree and maybe start a master's. Honestly, though, I believe in lifelong learning, so I'll probably keep taking short courses after that.": "320094aa664f", "Having my own room gives me some personal space.": "02ceee42ca57", "The living conditions in our flat are pretty good, apart from the heat in summer.": "3ecdffec4a2f", "There's a strong local community spirit in our alley.": "a52fa91f6638", "There isn't much social interaction in my building; people are always busy.": "16b908fcb579", "When my grandma moved in, we all had to make some adjustments.": "f49faba39942", "We had to make arrangements for my grandma's room before she moved in.": "8a50769102e1", "Living with three generations gives us lots of shared experiences.": "e20f531b054d", "Our flat is ideally suited to a small family like mine.": "e7f1d722c740", "We live in close proximity to my school. (Khi nói, close to tự nhiên hơn.)": "da84e8db412f", "My family's living standards have gone up since my parents opened a shop.": "bd537262bc0a", "I like a clean immediate environment, so I tidy the corridor outside our door.": "bf5c6a899188", "For me, the basic function of a home is somewhere safe to rest.": "bab696d7bd48", "I live with my parents and my younger brother.": "bfee66d401d3", "We live in a high-rise flat on the twelfth floor.": "c40cc823d8b8", "My grandparents still live in a narrow tube house.": "e88f449c0789", "Our living room is a bit cramped, but really cosy.": "1c69f4afac2c", "My mum gets on well with the neighbours.": "1491fd759bdb", "I live with my parents and my younger sister. We get on really well, although we argue about the TV sometimes.": "d3bfa8bcedf7", "It's quite noisy, because we live next to a main road. The traffic starts at around 6 a.m.": "87b6c9910a40", "About ten years now. We moved there when I was in grade 1, so it's the only home I really remember.": "09de681782a0", "It's a three-bedroom flat on the twelfth floor. The living conditions are pretty good: it's bright and quiet, and from the balcony we can see a big part of the city.": "61c541b787df", "When I was little, we lived in a tube house that was a bit cramped. Now we live in a flat, which is much brighter.": "234d9e765eae", "Yes, most of them are. There's a strong local community spirit, and people often chat outside in the evenings.": "82e8f9853ce8", "I live with my parents and my younger brother in a high-rise flat.": "c14d91d8a93f", "At the moment I live with my parents and my younger brother in a high-rise flat in Hanoi.": "a2340d27b809", "Having my own room gives me the personal space I need to study.": "2bbc4ef049e7", "The living conditions in our flat are pretty good.": "7de451af0873", "Overall, the living conditions in our flat are pretty good, apart from the heat in summer.": "515dee9801e3", "There isn't much social interaction in my building.": "480a0c18c638", "To be honest, there isn't much social interaction in my building.": "8df55318914b", "I'd say our flat is ideally suited to a small family like mine.": "1393ab0069dd", "We all had to make adjustments when my grandma moved in with us.": "a5c5777fb866", "We live in close proximity to my school.": "ac644a3829b7", "Luckily, we live in close proximity to my school, so I can walk there.": "f59f13a0680e", "For me, the basic function of a home is to give you somewhere safe to rest after a long day.": "4fd132f35185", "I think the basic function of a home is simple: it's where you can relax and be yourself.": "fd1e56809d76", "My family's living standards have improved a lot since my parents opened their own business.": "b4f995ca144f", "Our living standards have gone up a lot since my parents opened a small shop.": "1b13d6114815", "Living with three generations under one roof gives us lots of shared experiences, like making spring rolls together before Tet.": "250efba6cd3b", "We have lots of shared experiences because we all live together, like cooking for Tet every year.": "38f8bff034f5", "Who do you live with?": "c2f4657cc36b", "Do you live in an apartment or a house?": "f101d534f605", "I live in an apartment on the twelfth floor of a high-rise building. The view of the city is amazing at night.": "6ba4bd01f81a", "What part of your home do you like the most?": "2be8c6cfaa8d", "I like my bedroom the most because it has a big window, so it gets a lot of natural light.": "6143fcce4b07", "What room does your family spend most of the time in?": "dcb943756161", "Definitely the living room. Every evening we watch TV together there. It's a bit cramped, but it's really cosy.": "62cc754db69f", "What do you usually do in your apartment?": "d8bddd0be5e9", "Mostly I study in my room, since I'm preparing for the university entrance exam. At weekends, though, I help my mum cook.": "ccc597d03c50", "How long have you lived there?": "76a9ec775495", "About ten years now. We moved there when I was in grade 1, so it's basically the only home I remember.": "c5c3ffce6c57", "Do you plan to live there for a long time?": "b11f9c7525cc", "Probably not forever. After university, I'd like to rent a flat of my own, because I want more personal space.": "72770c7321e9", "Do you think it is important to live in a comfortable environment?": "61a609ad7ddc", "Yes, I think it's really important, because our living conditions affect our mood. For example, when my room is messy, I just can't focus.": "338195bb9c73", "Do you live in a noisy or a quiet area?": "e8b29366fa71", "What are some changes in the area recently?": "e2a8c50a62be", "Quite a lot has changed. A new shopping mall has opened nearby, so the traffic has got much worse.": "84ada8ba1237", "What's the difference between where you are living now and where you have lived in the past?": "244be7bd10f8", "When I was little, we lived in a tube house that was a bit cramped. Now we live in a flat, which is much brighter, though we had to make a few adjustments, like getting used to the lift.": "d1a57153e7ec", "What kind of house or apartment do you want to live in in the future?": "8a9e8de567ba", "I'd love a small house with a garden, somewhere ideally suited to someone who loves plants, like me. I'd also want a big kitchen, because I enjoy cooking.": "c53a228e814a", "What kinds of accommodation do you live in?": "811700f50c9c", "I live in a high-rise flat in Cau Giay district. It's in close proximity to my school and a big supermarket, which is really convenient.": "b62f902ab5d2", "Can you describe the place where you live?": "002ff3cad4dc", "Sure. It's a three-bedroom flat on the twelfth floor. The living conditions are pretty good: it's bright and quiet, and from the balcony we can see a big part of the city.": "8859aeb6cdef", "Please describe the room you live in.": "7bec66196971", "It's quite small, with a bed, a desk and a huge pile of exam books. But it's my own personal space, so I can study without being disturbed.": "0a8e9d150dbb", "What's your favourite room in your apartment or house?": "5cda20e0badd", "My favourite room is the kitchen, believe it or not. My grandma and I cook there every Sunday, so it's full of shared experiences.": "79d784fa8938", "What makes you feel pleasant in your home?": "8356111962df", "Mainly the people. I live in an extended family, so there's always someone to chat with when I get home from school.": "59a759a527b0", "Do you like the area that you live in?": "35501558c364", "Yes, I do. There's a strong local community spirit, and everything I need, like shops and a market, is just a short walk away.": "91cb286d989c", "Where do you like to go in that area?": "2cf8c00ca4fc", "Usually the small park near my building. There's lots of social interaction there in the evenings, with people dancing, playing badminton and chatting.": "2d3706d91d43", "Do you know any of your neighbours?": "e889603614b3", "Yes, a few of them. My mum gets on well with the family next door, so we often swap food during Tet.": "5a0357695bb4", "I grew up in a busy urban area, right in the centre of Hanoi.": "16320fefcb7b", "My grandparents live in a quiet rural area outside the city.": "8e20e077a3c2", "Public transport is getting better, especially the metro.": "31b59250220a", "As a kid, I learned a lot about the local culture from my grandparents.": "50b80f187ccc", "The local community in my alley organises a party every Mid-Autumn Festival.": "dc06b1c82dee", "I'm proud of the city's cultural heritage, like the Temple of Literature.": "62fbbc8b98eb", "The natural environment could be better, mainly because of air pollution.": "c033cac453d0", "Street food stalls create lots of social interaction between neighbours.": "c55c4aea6777", "Hanoi has a rich historical background; it's over a thousand years old.": "a92f51b68e02", "The city has seen rapid expansion, with new districts everywhere.": "9ba11179549c", "Living standards have improved a lot since my parents were young.": "e04684199609", "Its geographical location on the Red River helped it grow into a big city.": "4f7d542f3758", "I was born and raised in Hanoi.": "d351054eb794", "It's famous for its street food, especially pho.": "2500826d0d31", "The traffic jams and air pollution are the worst parts.": "0622e6574623", "There are plenty of job opportunities, especially in tech.": "696e841e8ed4", "It's a really big city. It's the capital, and over eight million people live there.": "3712a7f47f20", "Yes, I do. I'm proud of its cultural heritage, and all my childhood memories are here.": "84c0f5240adb", "Yes, I did. Every Mid-Autumn Festival, my grandparents took me to Hang Ma Street to see the lanterns.": "3de22a5a375d", "Sure. Hanoi is the capital of Vietnam. It's a mix of old and new: narrow streets in the Old Quarter and modern skyscrapers in the newer districts.": "d035b1f8dee6", "My whole life. I've lived here since I was born, and I've never lived anywhere else.": "2cbda202f070", "Yes, I'd say so. There are lots of job opportunities. The only problem is the cost of living, which is pretty high.": "abeaa04d6c82", "I was born and raised in Hanoi, a busy urban area in the north.": "05c4071a2d0d", "Actually, I was born and raised in Hanoi, which is a really busy urban area.": "4242038f198d", "Public transport in Hanoi is getting more modern.": "1af381eab108", "These days, public transport in Hanoi is getting more modern, especially the metro.": "85c542544d79", "My grandparents still live in a quiet rural area just outside the city.": "0ca3f4f2a490", "I'm proud of the local culture here.": "13506d5383d5", "Honestly, I'm really proud of the local culture here.": "a9d7b57db53c", "Hanoi is famous for its cultural heritage, especially its old temples.": "78ea9f417d02", "Hanoi is really famous for its cultural heritage, especially the old temples and pagodas.": "9717cb390dbf", "The city has undergone rapid expansion, and there are new districts everywhere.": "6b2565dae2d1", "In recent years the city has undergone rapid expansion, with new districts everywhere.": "0e1a2788fb5e", "In my alley, the Mid-Autumn Festival brings lots of social interaction between neighbours.": "19bac8c75bbc", "The Mid-Autumn Festival brings lots of social interaction in my alley, because all the kids play together.": "6a9fbaa9e466", "Hanoi has a really rich historical background. It was the capital under several dynasties, and it's over a thousand years old.": "4b3280f29f2e", "The city has a fascinating historical background, since it's been the capital for centuries.": "07de93b240e1", "Living standards have improved a lot. When my parents were young, few families had a car, but now lots of people do.": "9901eb594542", "Living standards have gone up a lot. My parents grew up without a fridge, but now every home has one.": "38a52f5f3872", "The natural environment could be better, mainly because of air pollution. Still, there are plenty of lakes, and they're lovely in the evening.": "8a76869ec720", "To be honest, the natural environment isn't great because of the air pollution, but the lakes are still beautiful.": "bd125f4a8647", "Is that a big city or a small place?": "89b9c9887fb2", "It's a really big city. It's the capital city, and over eight million people live there.": "cb915f5097ad", "How long have you been living there?": "65b307bda4eb", "What's your hometown famous for?": "7c093fd9d2eb", "It's famous for its food, especially street food like pho. It's also known for Hoan Kiem Lake, right in the centre.": "24543770dd3b", "Do you like your hometown?": "95af00b5c91b", "What do you like (most) about your hometown?": "0f3a01865295", "What I like most is the street food. There's a food stall on every corner, and everything's cheap and delicious.": "d80308141140", "Is there anything you dislike about it?": "0768e468f5e6", "Yes, the traffic. There are traffic jams every day, and the air pollution is also pretty bad in winter.": "5e8a7625cc2c", "Are there many young people in your hometown?": "2a9a641920ab", "Yes, loads. Lots of students from other provinces come here to study, so the city feels really young and energetic.": "0481deddf4f9", "Did you learn about the culture of your hometown in your childhood?": "d69fcd0dce48", "Yes, I did. Every Mid-Autumn Festival, my grandparents took me to Hang Ma Street to see the lanterns. That's how I learned about the local culture.": "49297d324d4e", "Please describe your hometown a little.": "b4a24fea3e86", "Sure. It's the capital of Vietnam, in the north. It's a mix of old and new, with narrow streets in the Old Quarter and modern skyscrapers in newer districts.": "fb89a9361c78", "Is your hometown a good place for young people to pursue their careers?": "824fd81f4dd6", "Yes, I'd say so. There are lots of job opportunities, especially in tech and finance. The only problem is the cost of living, which is pretty high.": "0b7e8af68187", "Have you learned anything about the history of your hometown?": "7f88a00a4874", "Yes, I have. I've learned that the city has a rich historical background, and last year I visited the Temple of Literature, which is often called Vietnam's first university.": "fc0b707d1364", "Do you like living there?": "efa80bfa81b0", "Yes, I do. I've always lived in a busy urban area, so I'm used to the noise, and I love that there's always something going on.": "15460aea7b39", "Did you learn about the history of your hometown at school?": "9d2ebf046467", "Yes, we did. We learned that Hanoi used to be called Thang Long, and our class went on a field trip to see the city's cultural heritage at the Imperial Citadel.": "5b63634cf111", "Sure. Hanoi is the capital of Vietnam, in the north. It's undergone rapid expansion recently, so you've got the old streets of the Old Quarter next to brand-new districts.": "8c5360a943ff", "It's best known for its street food and its cultural heritage. Tourists love trying pho in the Old Quarter and visiting the old temples around Hoan Kiem Lake.": "51258ee31236", "Mostly the traffic. Public transport is improving, but it still doesn't reach my area, so I spend about forty minutes a day stuck in traffic on my way to school.": "c57d6397a262", "Yes, I really do. The local community in my alley is really close, so when I was little, all the neighbours treated me like their own kid.": "1c4d52dabd87", "Yes, I'd say so. Living standards are higher here than in most provinces, and there are lots of jobs in tech and finance. The only problem is that rent is quite expensive.": "900ae14f9e75", "Yes, there are loads. Students from all over the country come here for university, so coffee shops are always full of social interaction, especially at weekends.": "74ff8c84025b", "I've been living here since I was born. My parents grew up in a rural area, though, so I've spent lots of summer holidays in the countryside too.": "936a6aec6bb8"}</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var STORE = 'ielts-speaking-lesson-1-workbook';
var state = load();
function blank(){ return {draft:{}, sub:{}, choice:{}, seen:{}, sent:{}, dirty:{}}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)); return s && s.sub ? s : blank(); } catch(e){ return blank(); } }
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dots(n){ return n ? '<span class="lv" title="Level ' + n + '">' + '●'.repeat(n) + '</span>' : ''; }
function textOf(html){ var t = document.createElement('div'); t.innerHTML = html; return t.textContent; }

/* ---------- recorded audio for the English examples (audio/<id>.mp3, made by make_audio.py) ---------- */
var AUDIO = JSON.parse(document.getElementById('audio').textContent);
var player = new Audio(), playing = null;
function speakBtn(text){
  var id = AUDIO[text];
  if (!id) return '';
  return '<button type="button" class="speak" data-audio="' + id + '" aria-label="Listen: ' + esc(text) + '" title="Listen">🔊</button>';
}
function stopAudio(){ player.pause(); if (playing) playing.classList.remove('on'); playing = null; }
player.addEventListener('ended', stopAudio);
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-audio]'); if (!b) return;
  var again = playing === b;
  stopAudio();
  if (again) return;
  player.src = 'audio/' + b.getAttribute('data-audio') + '.mp3';
  playing = b; b.classList.add('on');
  player.play().catch(stopAudio);
});

/* ---------- progress ---------- */
function ids(u){ var out = []; u.exercises.forEach(function(ex, k){ ex.items.forEach(function(_, i){ out.push(u.num + '-' + (k + 1) + '-' + i); }); }); return out; }
function isDone(id){ return !!(state.sub[id] || state.choice[id] || state.seen[id]); }
var ALL = [].concat.apply([], D.units.map(ids));
function updateProgress(){
  var n = ALL.filter(isDone).length;
  $('#progressText').textContent = 'Done: ' + n + '/' + ALL.length + ' items';
  $('#progressBar').style.width = (100 * n / ALL.length) + '%';
}
$('#reset').addEventListener('click', function(){
  if (!confirm('Clear everything you wrote, submitted and chose in this browser?')) return;
  state = blank(); save(); render();
});

/* ---------- header and tabs ---------- */
$('#title').textContent = D.cover[0];
$('#cover').innerHTML = D.cover.slice(1).map(function(c, i, a){
  return '<p class="standfirst' + (i === a.length - 1 ? ' small' : '') + '">' + esc(c) + '</p>';
}).join('');
var TABS = [{id:'huong-dan', label:'Guide'}];
D.units.forEach(function(u){ TABS.push({id:'unit-' + u.num, label:'Unit ' + u.num + ' · ' + u.name, unit:u}); });
$('#tabs').innerHTML = TABS.map(function(t){ return '<a href="#' + t.id + '">' + esc(t.label) + '</a>'; }).join('');

function route(){
  var h = location.hash.replace('#', '').split('/');
  var tab = TABS.find(function(t){ return t.id === h[0]; }) || TABS[0];
  return {tab: tab, part: h[1] || 'ly-thuyet'};
}
var filter = 0;

/* ---------- guide ---------- */
function renderGuide(){
  var s = '<h2>' + esc(D.guideTitle) + '</h2>', card = '', open = false;
  function flush(){ if (open) { card += '</ul>'; open = false; } if (card) s += '<div class="card">' + card + '</div>'; card = ''; }
  D.guide.forEach(function(b){
    if (b.type === 'h') { flush(); card = '<h4>' + b.html + '</h4>'; }
    else if (b.type === 'li') { if (!open) { card += '<ul class="plain">'; open = true; } card += '<li>' + b.html + '</li>'; }
    else { if (open) { card += '</ul>'; open = false; } card += '<p>' + b.html + '</p>'; }
  });
  flush();
  D.parts.forEach(function(p){
    s += '<p class="part-title">' + esc(p.title) + '</p><div class="boxes">' + p.units.map(function(n){
      var u = D.units.find(function(x){ return x.num === n; });
      var all = ids(u), done = all.filter(isDone).length;
      return '<a class="card" style="text-decoration:none;color:inherit;display:block;margin:0" href="#unit-' + n + '"><h4 style="color:var(--heading)">Unit ' + n + ' · ' + esc(u.name) + '</h4><span class="note">Done: ' + done + '/' + all.length + ' câu</span></a>';
    }).join('') + '</div>';
  });
  return s;
}

/* ---------- theory ---------- */
function renderTable(b){
  var vocab = b.head[0] === 'Cụm từ' || b.head[0] === 'Phrase', speakLast = vocab || /câu trả lời mở rộng|extended answer/i.test(b.head[b.head.length - 1]);
  var rows = b.rows.filter(function(r){ return !filter || !r.level || r.level === filter; });
  return '<div class="tablewrap"><table><thead><tr>' + b.head.map(function(h){ return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr>' + r.cells.map(function(c, i){
        if (i === 0 && vocab) return '<td class="phrase">' + dots(r.level) + ' ' + c + '</td>';
        if (i === r.cells.length - 1 && speakLast) return '<td>' + c + speakBtn(textOf(c)) + '</td>';
        return '<td' + (vocab && i === 1 ? ' class="muted"' : '') + '>' + c + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}
function sampleSpeech(html){
  var t = textOf(html), i = t.indexOf(' → ');
  if (i >= 0) t = t.slice(i + 3);
  return t.replace(/\s*\([^)]*\)\s*$/, '').replace(/\s*\/[^\/\s]+\/\s*/g, ' ');
}
function renderTheory(u){
  var s = '', boxes = [];
  u.theory.forEach(function(b){
    if (b.type === 'sub') s += '<h3>' + esc(b.text) + '</h3>';
    else if (b.type === 'p') s += '<p>' + b.html + '</p>';
    else if (b.type === 'table') s += renderTable(b);
    else if (b.type === 'samples') s += '<div class="card">' + b.items.map(function(x){ return '<div class="sample">' + x + speakBtn(sampleSpeech(x)) + '</div>'; }).join('') + '</div>';
    else if (b.type === 'mistakes') boxes.push('<div class="card box"><h4>Lỗi cần tránh</h4>' + b.items.map(function(m){
      return '<div class="mistake"><div class="bad">' + m.bad + '</div><div class="good">' + m.good + '</div><div class="note">' + m.note + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'choose') boxes.push('<div class="card box"><h4>Chọn cho đúng</h4>' + b.items.map(function(c){
      return '<div class="mistake"><div>' + c.h + '</div><div class="note">' + c.html + '</div></div>';
    }).join('') + '</div>');
    else if (b.type === 'sounds') boxes.push('<div class="card box"><h4>Âm cần luyện</h4>' + b.lines.map(function(l){ return '<p>' + l + '</p>'; }).join('') + '<p class="note">' + b.tip + '</p></div>');
  });
  // The first "Mục đích" block goes in a card.
  s = s.replace(/^<h3>Mục đích<\/h3>((?:<p>[\s\S]*?<\/p>)+)/, '<div class="card"><h4>Mục đích</h4>$1</div>');
  if (boxes.length) s += '<div class="boxes" style="margin-top:20px">' + boxes.join('') + '</div>';
  return s;
}

/* ---------- exercises ---------- */
var LINES = [['short', 'Short answer'], ['expand', 'Extend'], ['rote', 'Memorised answer'], ['trait', 'Personal detail'], ['use', 'Use'], ['hint', 'Hint']];
function answerHtml(it, id){
  var s = '';
  if (state.sub[id]) s += '<div class="note">Your answer:</div><div class="mine" lang="en">' + esc(state.sub[id]) + '</div>';
  s += '<div class="main">' + (it.suggest ? '<span class="label">Suggestion:</span> ' : it.model ? '<span class="label">Model answer:</span> ' : '<span class="label">Answer:</span> ') + it.answer + speakBtn(textOf(it.answer)) + '</div>';
  if (it.alt) s += '<div class="alt"><span class="label">Also accepted:</span> ' + it.alt + speakBtn(textOf(it.alt)) + '</div>';
  if (it.note) s += '<div class="note" style="margin-top:6px">' + it.note + '</div>';
  return s;
}
function choiceResult(it, id){
  var pick = state.choice[id];
  return '<div class="verdict ' + (pick === it.correct ? 'ok">✓ Correct' : 'no">✗ Not quite. Answer: ' + it.correct) + '</div><div class="note">' + it.note + '</div>';
}
function renderItem(it, id, i){
  var head = it.q != null
    ? '<span class="cue"><span class="examiner">Examiner' + (it.qnum ? ' (' + it.qnum + ')' : '') + ':</span>' + esc(it.q) + speakBtn(it.q) + '</span>'
    : '<span class="cue' + (it.kind === 'read' ? ' read-cue' : '') + '">' + it.cue + (it.kind === 'read' ? speakBtn(textOf(it.cue)) : '') + '</span>';
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){
    return '<div><span class="label">' + l[1] + ':</span> ' + (l[0] === 'hint' ? '<span class="hint">' + it.hint + '</span>' : it[l[0]]) + '</div>';
  }).join('');
  var s = '<div class="item' + (isDone(id) ? ' done' : '') + '" data-id="' + id + '">' +
    '<div class="item-head"><span class="num">' + (i + 1) + '</span>' + dots(it.level) + head + '</div>' +
    (lines ? '<div class="lines">' + lines + '</div>' : '');
  if (it.kind === 'choice') {
    var pick = state.choice[id];
    s += '<div class="opts" role="radiogroup" aria-label="Choose A, B or C">' + it.options.map(function(o){
      var cls = pick ? (o.letter === it.correct ? ' right' : o.letter === pick ? ' wrong' : '') : '';
      return '<label class="opt' + cls + '"><input type="radio" name="c-' + id + '" value="' + o.letter + '"' + (pick === o.letter ? ' checked' : '') + '><b>' + o.letter + '</b><span lang="en">' + esc(o.text) + '</span></label>';
    }).join('') + '</div><div class="work"><div class="actions"><button type="button" class="btn primary" data-choose="' + id + '"' + (pick ? '' : ' disabled') + '>' + (pick ? 'Submit again' : 'Submit') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (pick ? '' : ' hidden') + '>' + (pick ? choiceResult(it, id) : '') + '</div></div>';
  } else if (it.kind === 'read') {
    var seen = !!state.seen[id];
    s += '<div class="work"><div class="actions"><button type="button" class="btn primary" data-see="' + id + '" aria-expanded="' + seen + '">' + (seen ? 'Hide answer' : 'Show answer') + '</button></div>' +
      '<div class="answer" id="a-' + id + '"' + (seen ? '' : ' hidden') + '>' + answerHtml(it, id) + '</div></div>';
  } else {
    var draft = state.draft[id] != null ? state.draft[id] : (state.sub[id] || '');
    var sub = !!state.sub[id];
    s += '<div class="work"><label class="note" for="t-' + id + '">Write your answer</label>' +
      '<textarea id="t-' + id + '" data-text="' + id + '" rows="2" spellcheck="true" lang="en">' + esc(draft) + '</textarea>' +
      '<div class="actions"><button type="button" class="btn primary" data-submit="' + id + '"' + (draft.trim() ? '' : ' disabled') + '>' + (sub ? 'Submit again' : 'Submit') + '</button>' +
      (sub ? '' : '<span class="note">Submit your answer to see ' + (it.suggest ? 'a suggestion' : 'the answer') + '.</span>') + '</div>' +
      '<div class="answer" id="a-' + id + '"' + (sub ? '' : ' hidden') + '>' + (sub ? answerHtml(it, id) : '') + '</div></div>';
  }
  return s + '</div>';
}
function findItem(id){
  var p = id.split('-'), u = D.units.find(function(x){ return x.num === +p[0]; });
  return u.exercises[+p[1] - 1].items[+p[2]];
}
function renderExercise(u, k){
  var ex = u.exercises[k - 1];
  var s = '<h3>' + esc(ex.title) + '</h3><p class="lede">' + ex.intro + '</p>', shown = 0;
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  ex.items.forEach(function(it, i){
    if (filter && it.level !== filter) return;
    shown++;
    s += renderItem(it, u.num + '-' + k + '-' + i, i);
  });
  if (!shown) s += '<p class="empty">No items at this level.</p>';
  s += '<div class="send-box" data-ex="' + u.num + '-' + k + '">' + sendBox(u.num + '-' + k) + '</div>';
  return s;
}

/* ---------- sending finished exercises to the teacher (IELTS Harper Portal) ---------- */
// This page and the portal are on the same site, so the student's portal sign-in is readable here.
var API_URL = 'https://script.google.com/macros/s/AKfycbwKm1zvqca2-WO20f49M4mNW2qn9Aq4uxJZ3_bnQrErWPL5TN4jHycXZUQBDJ1W7wWg/exec', PORTAL = 'https://ieltsharper.github.io/portal/';
var send = {}; // exercise key -> {status: 'sending'|'error'|'forbidden'|'login', message}
var comments = {}; // exercise key -> {comment, commentAt}
state.sent = state.sent || {}; state.dirty = state.dirty || {};
function token(){ try { return localStorage.getItem('portal.session'); } catch(e){ return null; } }
function apiCall(action, payload){
  return fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: action, token: token(), payload: payload}), redirect: 'follow', credentials: 'omit'})
    .then(function(r){ return r.json(); })
    .then(function(env){ if (env.ok) return env.data; var e = new Error(env.error.message); e.code = env.error.code; throw e; });
}
function exParts(key){ var p = key.split('-'), u = D.units.find(function(x){ return x.num === +p[0]; }); return {u: u, k: +p[1], ex: u.exercises[+p[1] - 1]}; }
function sendable(ex){ return ex.items.some(function(it){ return it.kind !== 'read'; }); }
function finished(key){ var x = exParts(key); return x.ex.items.every(function(_, i){ var id = key + '-' + i; return state.sub[id] || state.choice[id]; }); }
function doneCount(key){ var x = exParts(key); return x.ex.items.filter(function(_, i){ var id = key + '-' + i; return state.sub[id] || state.choice[id]; }).length; }
function promptOf(it){
  var head = it.q != null ? (it.qnum ? it.qnum + ': ' : '') + it.q : textOf(it.cue);
  var lines = LINES.filter(function(l){ return it[l[0]]; }).map(function(l){ return l[1] + ': ' + textOf(it[l[0]]); });
  return [head].concat(lines).join('\n');
}
function payloadFor(key){
  var x = exParts(key);
  return {
    url: location.href.split('#')[0], lessonTitle: D.cover[0], exercise: key,
    exerciseTitle: 'Unit ' + x.u.num + ' · ' + x.ex.title,
    answers: x.ex.items.map(function(it, i){
      var id = key + '-' + i;
      if (it.kind === 'choice') {
        var opt = function(l){ var o = it.options.find(function(o){ return o.letter === l; }); return l + '. ' + (o ? o.text : ''); };
        return {prompt: promptOf(it), answer: opt(state.choice[id]), model: opt(it.correct), correct: state.choice[id] === it.correct};
      }
      return {prompt: promptOf(it), answer: state.sub[id], model: textOf(it.answer) + (it.alt ? '\nAlso accepted: ' + textOf(it.alt) : ''), correct: null};
    })
  };
}
function sendBox(key){
  var x = exParts(key);
  if (!sendable(x.ex) || !API_URL) return '';
  var c = comments[key], s = send[key] || {}, out = '';
  if (c && c.comment) out += '<div class="teacher-note"><b>Teacher&rsquo;s feedback</b><div>' + esc(c.comment) + '</div></div>';
  var msg;
  if (!token() || s.status === 'login') msg = '<a href="' + PORTAL + '" target="_blank" rel="noopener">Sign in to the portal</a> so your work is sent to your teacher when you finish.';
  else if (s.status === 'sending') msg = 'Sending to your teacher…';
  else if (s.status === 'forbidden') msg = 'This exercise is not open to your portal account yet, so it cannot be sent to your teacher.';
  else if (s.status === 'error') msg = 'Not sent yet (' + esc(s.message) + '). <button type="button" class="btn" data-send="' + key + '">Try again</button>';
  else if (state.sent[key] && state.dirty[key]) msg = 'You changed your answers after sending. <button type="button" class="btn primary" data-send="' + key + '">Send again to your teacher</button>';
  else if (state.sent[key]) msg = '✓ Sent to your teacher on ' + esc(new Date(state.sent[key]).toLocaleString('en-GB')) + '.' + (c && c.comment ? '' : ' Your teacher will give feedback in the portal.');
  else msg = 'Done: ' + doneCount(key) + '/' + x.ex.items.length + '. When you finish them all, this exercise is sent to your teacher automatically.';
  return out + '<p class="send-msg">' + msg + '</p>';
}
function refreshSendBoxes(key){
  document.querySelectorAll('.send-box[data-ex="' + key + '"]').forEach(function(b){ b.innerHTML = sendBox(key); });
}
function sendExercise(key){
  if (!API_URL || !token()) { refreshSendBoxes(key); return; }
  send[key] = {status: 'sending'}; refreshSendBoxes(key);
  apiCall('workbook.submit', payloadFor(key)).then(function(row){
    state.sent[key] = row.submittedAt; delete state.dirty[key]; save();
    send[key] = {}; comments[key] = {comment: row.comment, commentAt: row.commentAt};
  }).catch(function(e){
    send[key] = e.code === 'unauthorized' ? {status: 'login'} : e.code === 'forbidden' ? {status: 'forbidden'} : {status: 'error', message: e.message || 'network error'};
  }).then(function(){ refreshSendBoxes(key); });
}
function afterAnswer(id){
  var key = id.split('-').slice(0, 2).join('-');
  if (!sendable(exParts(key).ex)) return;
  if (state.sent[key]) { state.dirty[key] = 1; save(); refreshSendBoxes(key); return; }
  if (finished(key)) sendExercise(key); else refreshSendBoxes(key);
}
function loadComments(){
  if (!API_URL || !token()) return;
  apiCall('workbook.mine', {url: location.href.split('#')[0]}).then(function(rows){
    rows.forEach(function(r){
      comments[r.exercise] = {comment: r.comment, commentAt: r.commentAt};
      if (!state.sent[r.exercise]) { state.sent[r.exercise] = r.submittedAt; save(); }
    });
    document.querySelectorAll('.send-box').forEach(function(b){ b.innerHTML = sendBox(b.getAttribute('data-ex')); });
    // Exercises finished before signing in are sent now.
    D.units.forEach(function(u){ u.exercises.forEach(function(ex, k){
      var key = u.num + '-' + (k + 1);
      if (sendable(ex) && !state.sent[key] && finished(key)) sendExercise(key);
    }); });
  }).catch(function(){});
}

function renderUnit(u, part){
  var parts = [['ly-thuyet', 'A. Theory']].concat(u.exercises.map(function(_, k){ return ['bai-tap-' + (k + 1), 'Exercise ' + (k + 1)]; }));
  if (!parts.some(function(p){ return p[0] === part; })) part = 'ly-thuyet';
  var s = '<h2>Unit ' + u.num + ' · ' + esc(u.name) + '</h2>';
  s += '<div class="subnav" role="group" aria-label="Unit sections">' + parts.map(function(p){
    var n = p[0] === 'ly-thuyet' ? '' : (function(){ var k = +p[0].slice(-1), all = u.exercises[k - 1].items.map(function(_, i){ return u.num + '-' + k + '-' + i; }); return ' <small>' + all.filter(isDone).length + '/' + all.length + '</small>'; })();
    return '<a class="chip" style="text-decoration:none" href="#unit-' + u.num + '/' + p[0] + '" aria-pressed="' + (p[0] === part) + '">' + p[1] + n + '</a>';
  }).join('') + '<span class="filter-label">Level:</span>' +
    [[0, 'All'], [1, '● 5.0-6.0'], [2, '●● 6.0-6.5'], [3, '●●● 7.0-7.5']].map(function(f){
      return '<button type="button" class="chip" data-filter="' + f[0] + '" aria-pressed="' + (filter === f[0]) + '">' + f[1] + '</button>';
    }).join('') + '</div>';
  s += part === 'ly-thuyet' ? renderTheory(u) : renderExercise(u, +part.slice(-1));
  var i = parts.findIndex(function(p){ return p[0] === part; });
  if (i < parts.length - 1) s += '<p style="text-align:right"><a class="btn primary" style="text-decoration:none;display:inline-block" href="#unit-' + u.num + '/' + parts[i + 1][0] + '">Next: ' + parts[i + 1][1] + ' →</a></p>';
  return s;
}

function render(){
  var r = route();
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('href') === '#' + r.tab.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  var m = $('#main');
  if (r.tab.unit) m.innerHTML = renderUnit(r.tab.unit, r.part);
  else m.innerHTML = renderGuide();
  updateProgress();
}
function rerenderItem(id){
  var old = document.querySelector('.item[data-id="' + id + '"]'), p = id.split('-');
  var tmp = document.createElement('div');
  tmp.innerHTML = renderItem(findItem(id), id, +p[2]);
  old.replaceWith(tmp.firstChild);
  updateProgress();
  var chip = document.querySelector('.subnav a[aria-pressed="true"] small');
  if (chip) { var ex = D.units.find(function(x){ return x.num === +p[0]; }).exercises[+p[1] - 1];
    chip.textContent = ex.items.filter(function(_, i){ return isDone(p[0] + '-' + p[1] + '-' + i); }).length + '/' + ex.items.length; }
}

/* ---------- events ---------- */
var lastTab = route().tab.id;
window.addEventListener('hashchange', function(){
  render();
  var t = route().tab.id;
  window.scrollTo(0, t === lastTab ? Math.min(window.scrollY, $('nav.tabs').offsetTop) : 0);
  lastTab = t;
});
$('#main').addEventListener('click', function(e){
  var b, id;
  if ((b = e.target.closest('[data-filter]'))) { filter = +b.getAttribute('data-filter'); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if ((b = e.target.closest('[data-submit]'))) {
    id = b.getAttribute('data-submit');
    var t = document.getElementById('t-' + id).value.trim();
    if (!t) return;
    var changed = state.sub[id] !== t;
    state.sub[id] = t; delete state.draft[id]; save(); rerenderItem(id);
    var a = document.getElementById('a-' + id); if (a) a.scrollIntoView({block: 'nearest'});
    if (changed) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-choose]'))) {
    id = b.getAttribute('data-choose');
    var r = document.querySelector('input[name="c-' + id + '"]:checked');
    if (!r) return;
    var changedChoice = state.choice[id] !== r.value;
    state.choice[id] = r.value; save(); rerenderItem(id);
    if (changedChoice) afterAnswer(id);
    return;
  }
  if ((b = e.target.closest('[data-send]'))) { sendExercise(b.getAttribute('data-send')); return; }
  if ((b = e.target.closest('[data-see]'))) {
    id = b.getAttribute('data-see');
    if (state.seen[id]) delete state.seen[id]; else state.seen[id] = 1;
    save(); rerenderItem(id);
  }
});
$('#main').addEventListener('change', function(e){
  var t = e.target;
  if (t.matches('input[type="radio"]')) {
    var id = t.name.slice(2), btn = document.querySelector('[data-choose="' + id + '"]');
    if (btn) btn.disabled = false;
  }
});
$('#main').addEventListener('input', function(e){
  var t = e.target;
  if (t.matches('[data-text]')) {
    var id = t.getAttribute('data-text');
    state.draft[id] = t.value; save();
    var btn = document.querySelector('[data-submit="' + id + '"]'); if (btn) btn.disabled = !t.value.trim();
  }
});
render();
loadComments();
})();
</script>
</body>
