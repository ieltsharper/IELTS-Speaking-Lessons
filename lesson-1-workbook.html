<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IELTS Intensive Speaking · Lesson 1 · IELTS Harper Portal</title>
<style>
/* IELTS Harper Portal look (same tokens as the Speaking band descriptors page). */
:root{
  --page:#f7f5f2; --card:#ffffff; --line:#e7e5e4; --line-strong:#d6d3d1;
  --ink:#1c1917; --muted:#57534e; --heading:#f96c1b;
  --brand:#c2410c; --brand-hover:#9a3412; --on-brand:#ffffff; --brand-soft:#fff7ed;
  --hl:#ffedd5;
  --ok:#065f46; --ok-soft:#ecfdf5; --no:#991b1b; --no-soft:#fef2f2;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#171311; --card:#221c19; --line:#3a302b; --line-strong:#4f433c;
    --ink:#f5f0eb; --muted:#b8aca3; --brand-soft:#3a2416; --hl:#5a3418;
    --ok:#6ee7b7; --ok-soft:#12302a; --no:#fca5a5; --no-soft:#3b1d1d;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar, as in the portal */
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-top:12px;padding-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none;margin-right:auto}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
.topbar-link{color:var(--ink);font-weight:600;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.topbar-link:hover{background:var(--brand-soft)}

/* masthead */
header.mast .wrap{padding-top:28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.eyebrow{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;margin:0 0 10px}
h1{color:var(--heading);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.2;margin:0 0 8px}
.standfirst{margin:0;color:var(--muted)}
.standfirst.small{font-size:.9rem;font-style:italic}
.progress-all{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.bar{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);width:0}

/* section tabs */
nav.tabs{position:sticky;top:0;z-index:40;background:var(--page);border-bottom:1px solid var(--line);margin-top:20px}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
nav.tabs a{border:1px solid transparent;border-radius:12px;padding:8px 14px;white-space:nowrap;color:var(--muted);font-size:.93rem;font-weight:600;text-decoration:none}
nav.tabs a:hover{background:var(--brand-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
main{padding:28px 0 80px}
h2{color:var(--heading);font-weight:700;font-size:1.45rem;margin:0 0 6px}
h3{font-weight:700;font-size:1.12rem;margin:30px 0 10px}
h4{font-weight:700;font-size:1rem;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
ul.plain{margin:4px 0 12px;padding-left:22px}
ul.plain li{margin-bottom:6px}

/* unit sub-navigation and level filter */
.subnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:14px 0 18px}
.chip{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip:hover{background:var(--brand-soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip small{font-weight:500;opacity:.85}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.filter-label{font-size:.82rem;color:var(--muted);margin-left:auto}
.lv{color:var(--brand);letter-spacing:1px;font-size:.8rem;white-space:nowrap}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.85rem}
td.phrase{font-weight:700;white-space:nowrap}
td.muted{color:var(--muted)}
.speak{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:.8rem;vertical-align:middle;margin-left:6px;padding:0;line-height:1}
.speak:hover{background:var(--brand-soft)}
.speak.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

/* boxes */
.boxes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box h4{color:var(--brand)}
.mistake{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.mistake:first-of-type{border-top:0;margin-top:0;padding-top:0}
.bad{color:var(--no)}.good{color:var(--ok)}
.bad::before{content:"✗ ";font-weight:700}.good::before{content:"✓ ";font-weight:700}
.note{color:var(--muted);font-size:.92rem}
.sample{margin-bottom:10px}
.sample .q{font-weight:700}
.formula{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:0 0 12px}

/* exercise items */
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.item.done{border-color:var(--ok)}
.item-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:.85rem}
.cue{font-weight:700;font-size:1.05rem;flex:1;min-width:200px}
.examiner{color:var(--muted);font-weight:600;font-size:.85rem;margin-right:4px}
.lines{margin:8px 0 0 38px;font-size:.95rem}
.lines div{margin-bottom:3px}
.label{display:inline-block;min-width:78px;color:var(--muted);font-size:.85rem;font-weight:600}
.hint{color:var(--muted);font-style:italic}
.work{margin:12px 0 0 38px}
textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--page)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn:hover{background:var(--brand-soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.answer{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px}
.answer .main{font-weight:600}
.answer .alt{margin-top:6px}
.empty{color:var(--muted);font-style:italic}

/* question bank */
.search{width:100%;max-width:420px;border:1px solid var(--line-strong);border-radius:12px;padding:8px 12px;background:var(--card);margin-bottom:14px}

footer{color:var(--muted);font-size:.85rem;padding:20px 0 40px;border-top:1px solid var(--line)}
@media (max-width:600px){.lines,.work{margin-left:0}.filter-label{margin-left:0;width:100%}}
@media print{
  .topbar,nav.tabs,.subnav,.actions,.speak,textarea,.progress-all,footer{display:none!important}
  section[hidden]{display:block!important}
  .answer[hidden]{display:block!important}
  body{background:#fff}
  .item,.card{break-inside:avoid}
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:6px;margin:10px 0 0 38px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--page)}
.opt:hover{background:var(--brand-soft)}
.opt input{margin-top:5px;accent-color:var(--brand)}
.opt b{min-width:1.2em}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.verdict{font-weight:700;margin-bottom:4px}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.mine{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;white-space:pre-wrap}
.part-title{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.read-cue{font-size:1.08rem}
.send-box{margin:0 0 14px}
.send-box:empty{display:none}
.send-msg{margin:0;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--card);font-size:.92rem;color:var(--muted)}
.send-msg .btn{margin-left:6px}
.teacher-note{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-bottom:8px;white-space:pre-wrap}
.teacher-note b{color:var(--brand);display:block;margin-bottom:2px}
</style>
</head>

ì."}], "parts": [{"title": "Phần A Phát âm và ba kỹ thuật", "units": [1, 2]}, {"title": "Phần B Ba chủ đề Part 1", "units": [3, 4, 5]}], "units": [{"num": 1, "name": "Pronunciation: final sounds and word stress", "theory": [{"type": "sub", "text": "Mục đích"}, {"type": "p", "html": "Người Việt hay <b>nuốt âm cuối<\/b> vì tiếng Việt không có các cụm phụ âm cuối như <i>-sts, -kts<\/i> và âm cuối thường không bật hơi. Trong tiếng Anh, âm cuối mang <b>nghĩa ngữ pháp<\/b>: thiếu /s/ thì <i>parents<\/i> thành <i>parent<\/i> (một người), thiếu /d/ thì <i>moved<\/i> thành <i>move<\/i> (sai thì). Giám khảo nghe không rõ sẽ khó hiểu ý bạn."}, {"type": "p", "html": "<b>Trọng âm<\/b> giúp người nghe nhận ra từ. Nói <i>ca-REER<\/i> thành <i>CA-reer<\/i> hay <i>com-MU-ni-ty<\/i> thành <i>COM-mu-ni-ty<\/i> có thể làm người nghe không hiểu, dù bạn dùng đúng từ."}, {"type": "p", "html": "Unit này dạy quy tắc và cho bạn luyện với <b>chính các từ của ba chủ đề trong handout<\/b> (Unit 3-5). Phần phát âm cần <b>nói to<\/b> mới có tác dụng; nếu được, hãy ghi âm và nghe lại, hoặc nhờ giáo viên nghe."}, {"type": "sub", "text": "Đọc đuôi -s / -es"}, {"type": "table", "head": ["Đọc là", "Khi từ gốc kết thúc bằng âm", "Ví dụ"], "rows": [{"level": 0, "cells": ["<b>/s/<\/b>", "âm vô thanh /p/, /t/, /k/, /f/, /θ/", "shop<b>s<\/b>, street<b>s<\/b>, park<b>s<\/b>, subject<b>s<\/b>, math<b>s<\/b>"]}, {"level": 0, "cells": ["<b>/ɪz/<\/b>", "/s/, /z/, /ʃ/, /tʃ/, /dʒ/", "plac<b>es<\/b>, hous<b>es<\/b>, bus<b>es<\/b>, beach<b>es<\/b>, villag<b>es<\/b>"]}, {"level": 0, "cells": ["<b>/z/<\/b>", "các âm còn lại (nguyên âm và âm hữu thanh)", "room<b>s<\/b>, friend<b>s<\/b>, neighbour<b>s<\/b>, cit<b>ies<\/b>, lesson<b>s<\/b>"]}]}, {"type": "sub", "text": "Đọc đuôi -ed"}, {"type": "table", "head": ["Đọc là", "Khi từ gốc kết thúc bằng âm", "Ví dụ"], "rows": [{"level": 0, "cells": ["<b>/ɪd/<\/b>", "/t/, /d/", "visit<b>ed<\/b>, start<b>ed<\/b>, decid<b>ed<\/b>, crowd<b>ed<\/b>"]}, {"level": 0, "cells": ["<b>/ ons": [{"letter": "A", "text": "visited"}, {"letter": "B", "text": "wanted"}, {"letter": "C", "text": "moved"}], "correct": "C", "note": "<i>moved<\/i> đọc /d/; <i>visited, wanted<\/i> đọc /ɪd/. Quy tắc -ed: /ɪd/ sau /t, d/; /t/ sau âm vô thanh; /d/ sau các âm còn lại.", "kind": "choice"}, {"level": 1, "cue": "-ed ending", "options": [{"letter": "A", "text": "played"}, {"letter": "B", "text": "worked"}, {"letter": "C", "text": "watched"}], "correct": "A", "note": "<i>played<\/i> đọc /d/ (sau nguyên âm); <i>worked, watched<\/i> đọc /t/.", "kind": "choice"}, {"level": 2, "cue": "-s ending", "options": [{"letter": "A", "text": "subjects"}, {"letter": "B", "text": "lessons"}, {"letter": "C", "text": "neighbours"}], "correct": "A", "note": "<i>subjects<\/i> đọc /s/ (sau /t/), cả cụm cuối là /kts/; <i>lessons, neighbours<\/i> đọc /z/.", "kind": "choice"}, {"level": 2, "cue": "-s/-es ending", "options": [{"letter": "A", "text": "cities"}, {"letter": "B", "text": "villages"}, {"letter": "C", "text": "buses"}], "correct": "A", "note": "<i>cities<\/i> đọc /z/; <i>villages<\/i> (/dʒ/) và <i>buses<\/i> (/s/) đọc /ɪz/.", "kind": "choice"}, {"level": 2, "cue": "-ed ending", "options": [{"letter": "A", "text": "finished"}, {"letter": "B", "text": "studied"}, {"letter": "C", "text": "practised"}], "correct": "B", "note": "<i>studied<\/i> đọc /d/; <i>finished<\/i> (/ʃ/) và <i>practised<\/i> (/s/) đọc /t/.", "kind": "choice"}, {"level": 3, "cue": "-ed ending", "options": [{"letter": "A", "text": "decided"}, {"letter": "B", "text": "helped"}, {"letter": "C", "text": "crowded"}], "correct": "B", "note": "<i>helped<\/i> đọc /t/ (sau /p/); <i>decided, crowded<\/i> đọc /ɪd/ (sau /d/).", "kind": "choice"}, {"level": 3, "cue": "-s/-es ending", "options": [{"letter": "A", "text": "houses"}, {"letter": "B", "text": "garages"}, {"letter": "C", "text": "streets"}], "correct": "C", "note": "<i>streets<\/i> đọc /s/; <i>houses<\/i> /ˈhaʊzɪz/ và <i>garages<\/i> đọc /ɪz/. Chú ý: số nhiều của <i>hous  live with my <b>parents<\/b> in an <b>apartment<\/b>.", "answer": "I live with my PARents in an aPARTment.", "model": false, "note": "Âm cuối: <i>parents<\/i> /ts/. Trọng âm: <b>PA<\/b>rents, a<b>PART<\/b>ment.", "kind": "read"}, {"level": 1, "cue": "My <b>grandparents<\/b> live in a quiet <b>rural<\/b> area.", "answer": "My GRANDparents live in a quiet RUral area.", "model": false, "note": "Âm cuối: <i>grandparents<\/i> /ts/. Trọng âm: <b>GRAND<\/b>parents, <b>RU<\/b>ral.", "kind": "read"}, {"level": 1, "cue": "We <b>moved<\/b> to a bigger flat when I was seven.", "answer": "We moved to a bigger flat when I was SEVen.", "model": false, "note": "Âm cuối: <i>moved<\/i> /d/, <i>flat<\/i> /t/. Trọng âm: <b>SE<\/b>ven.", "kind": "read"}, {"level": 1, "cue": "<b>Public transport<\/b> in Hanoi is getting better.", "answer": "PUBlic TRANSport in Hanoi is getting better.", "model": false, "note": "Đọc rõ /t/ cuối <i>transport<\/i>. Trọng âm: <b>PUB<\/b>lic, <b>TRANS<\/b>port (danh từ).", "kind": "read"}, {"level": 2, "cue": "My parents are proud of my <b>academic achievements<\/b>.", "answer": "My parents are proud of my acaDEMic aCHIEVEments.", "model": false, "note": "Âm cuối: <i>parents<\/i> /ts/, <i>achievements<\/i> /ts/. Trọng âm: aca<b>DEM<\/b>ic, a<b>CHIEVE<\/b>ments.", "kind": "read"}, {"level": 2, "cue": "Living with my grandparents means we've <b>shared<\/b> lots of <b>experiences<\/b>.", "answer": "Living with my grandparents means we've shared lots of exPERiences.", "model": false, "note": "Âm cuối: <i>shared<\/i> /d/, <i>experiences<\/i> /ɪz/. Trọng âm: ex<b>PE<\/b>riences.", "kind": "read"}, {"level": 2, "cue": "I'm making steady <b>progress<\/b>, but I'm <b>snowed<\/b> under with homework.", "answer": "I'm making steady PROgress, but I'm snowed under with homework.", "model": false, "note": "Âm cuối: <i>snowed<\/i> /d/. Trọng âm: <b>PRO<\/b>gress (danh từ).", "kind": "read"}, {"level": 3, "cue": "My hometown has a <b>fascinating historical<\/b> background.", "answer": "My HOMEtown has a FAScinating hisTORical background.", "model": false, "note": "Trọng âm: <b>HOME<\/b>town, <b>FAS<\/b>cinating, his<b>TOR<\/b>ical, <b>BACK<\/b>ground.", "kind": "read"}, {"level": 3, "cue": "The city has <b>undergone<\/b> rapid <b>expansion<\/b>, and living <b>standards<\/b> have <b>improved<\/b>.", "answer": "The city has underGONE rapid exPANsion, and living STANdards have imPROVED.", "model": false, "note": "Âm cuối: <i>standards<\/i> /dz/, <i>improved<\/i> /d/. Trọng âm: under<b>GONE<\/b>, ex<b>PAN<\/b>sion, <b>STAN<\/b>dards, im<b>PROVED<\/b>.", "kind": "read"}, {"level": 3, "cue": "Street <b>markets<\/b> encourage social <b>interaction<\/b> among <b>residents<\/b>.", "answer": "Street MARkets encourage social interACtion among RESidents.", "model": false, "note": "Âm cuối: <i>markets<\/i> /ts/, <i>residents<\/i> /ts/. Trọng âm: <b>MAR<\/b>kets, inter<b>AC<\/b>tion, <b>RES<\/b>idents.", "kind": "read"}]}]}, {"num": 2, "name": "Three techniques for Part 1", "theory": [{"type": "sub", "text": "Mục đích"}, {"type": "p", "html": "Unit này luyện <b>ba kỹ thuật trong handout<\/b>: <b>5W1H<\/b>, <b>Personalisation<\/b> và <b>Tense control<\/b>. Lý thuyết đầy đủ và ví dụ có trong handout (trang 2-4); ở đây chỉ tóm tắt để bạn luyện thêm."}, {"type": "p", "html": "Một câu trả lời Part 1 tốt = <b>trả lời trực tiếp + 1-2 chi tiết cụ thể + một điều thật về bạn, đúng thì<\/b>. Khoảng <b>2-4 câu, 20-40 từ<\/b> (khoảng 30 giây). Ngắn mà tự nhiên tốt hơn dài mà học thuộc."}, {"type": "p", "html": "Câu hỏi trong Unit này lấy từ <b>các chủ đề khác<\/b> của bản dự đoán (mua sắm, trường cấp 2, công viên, âm nhạc…) để bạn thấy ba kỹ thuật dùng được cho mọi chủ đề, và để không trùng với bài tập trong handout."}, {"type": "sub", "text": "Ba kỹ thuật"}, {"type": "table", "head": ["Technique", "How", "Ví dụ"], "rows": [{"level": 0, "cells": ["<b>5W1H<\/b>", "Chọn <b>1-2<\/b> yếu tố What, When, Where, Who, Why, How để thêm chi tiết cụ thể, thay vì nói chung chung.", "<i>What do you do when you feel tired?<\/i> → I usually take a nap <b>for about twenty minutes after lunch<\/b>."]}, {"level": 0, "cells": ["<b>Personalisation<\/b>", "Đưa <b>đặc điểm và hoàn cảnh thật<\/b> của bạn vào câu trả lời, để không nghe như học thuộc.", "<i>Do you often feel tired?<\/i> → Yes, quite often. <b>I have a super hectic schedule<\/b> this year."]}, {"level": 0, "cells": ["<b>Tense control<\/b>", "Nghe tín hiệu trong câu hỏi và <b>dùng đúng thì từ câu đầu tiên<\/b>.", "<i>Did you recycle when you were a kid?<\/i> → Not really. I <b>didn't<\/b> think about it back then."]}]}, {"type": "sub", "text": "Đặc điểm cá nhân mẫu cho Personalisation"}, {"type": "p", "html": "Handout yêu cầu bạn tự liệt kê 5 đặc điểm (bài PERSONAL 1). Bảng dưới là các đặc điểm dùng trong câu mẫu của workbook; hãy thay bằng đặc điểm thật của bạn."}, {"type": "table", "head": ["Detail", "How to say it"], "rows": [{"level": 0, "cells": ["học sinh lớp 11 / lớp 12", "I'm in grade 11. · I'm a high school senior."]}, {"level": 0, "cells": ["đang ôn thi đại học", "I'm preparing for the university entrance exam."]}, {"level": 0, "cells": ["lịch học rất dày", "I have a super hectic schedule."]}, {"level": 0, "cells": ["sống cùng bố mẹ trong căn hộ chung cư", "I live with my parents in a high-rise flat."]}, {"level": 0, "cells": ["sống trong gia đình nhiều thế hệ", "I live in an extended family."]}, {"level": 0, "cells": ["(sinh viên Luật) sinh viên năm nhất ngành Luật", "I'm a first-year law student."]}]}, {"type": "sub", "text": "Tense control: tín hiệu trong câu hỏi"}, {"type": "table", "head": ["Tín hiệu", "Thì", "Ví dụ mở đầu"], "rows": [{"level": 0, "cells": ["Did / Was / Were…? · when you were a child · as a kid", "quá khứ đơn, <i>used to<\/i>", "Yes, I did. I used to…"]}, {"level": 0, "cells": ["Have you ever…? · How long have you…?", "hiện tại hoàn thành", "Yes, I have. · I've lived here for…"]}, {"level": 0, "cells": ["Do you…? · How often…? · What do you usually…?", "hiện tại đơn", "I usually… · I tend to…"]}, {"level": 0, "cells": ["in the future · Will you…? · Are you looking forward to…?", "kế hoạch tương lai", "I'm planning to… · I'll probably…"]}, {"level": 0, "cells": ["Would you…? · What would… be like?", "<i>would<\/i>", "I'd love to… · It would be…"]}, {"level": 0, "cells": ["…now and… in the past (so sánh)", "hiện tại + quá khứ", "Parks used to…, but these days…"]}]}, {"type": "sub", "text": "Câu mẫu"}, {"type": "samples", "items": ["<i>How often do you eat fruit and vegetables?<\/i> → Every day, really. <b>I live in an extended family<\/b>, and my grandma always puts a plate of fruit on the table after dinner. <b>(Personalisation)<\/b>", "<i>Do you prefer to sit by the window when travelling?<\/i> → Yes, definitely. I like watching the rice fields <b>on long bus trips to my grandparents' village<\/b>. <b>(5W1H: What + Where)<\/b>", "<i>Have you ever lost things?<\/i> → Yes, I have. Last year I <b>lost<\/b> my wallet on the bus, and I never got it back. <b>(Tense control)<\/b>"]}, {"type": "mistakes", "items": [{"bad": "Do you like shopping? → Yes, I like shopping. I like shopping very much.", "good": "Yes, especially for clothes. I usually go with my best friend at the weekend.", "note": "Lặp lại câu hỏi không thêm ý. Thêm 1-2 chi tiết (5W1H)."}, {"bad": "Did you like going to parks as a child? → Yes, I like it very much.", "good": "Yes, I loved it. My dad took me there every Sunday.", "note": "Câu hỏi quá khứ mà trả lời hiện tại: lỗi Tense control hay gặp nhất."}, {"bad": "Yes, because music is good for our mental health.", "good": "Yes. I'm preparing for the university entrance exam, so quiet music helps me focus.", "note": "Lý do chung chung ai cũng nói nghe như học thuộc. Dùng một đặc điểm thật của bạn (Personalisation)."}, {"bad": "Một câu trả lời học thuộc dài 80 từ, có Firstly, Secondly, In conclusion.", "good": "2-4 câu, khoảng 20-40 từ, nói về bản thân bạn.", "note": "Part 1 là hội thoại, không phải bài viết. Từ nối kiểu bài luận làm câu trả lời nghe như đọc thuộc."}]}, {"type": "choose", "items": [{"h": "<b>used to / would (thói quen trong quá khứ)<\/b>", "html": "<b>used to<\/b> dùng cho cả hành động và trạng thái: <i>I used to live in a tube house.<\/i> · <b>would<\/b> chỉ dùng cho hành động lặp lại: <i>Every Sunday, we'd go to the park.<\/i>"}, {"h": "<b>Have you ever…? → trả lời hai bước<\/b>", "html": "Câu đầu dùng hiện tại hoàn thành (<i>Yes, I have.<\/i>), câu kể chi tiết có mốc thời gian dùng quá khứ đơn (<i>Last month I lost…<\/i>)."}]}], "exercises": [{"title": "Exercise 1: Choose the best answer", "intro": "<i>Read the question and the three answers. Choose the one that <\/i><b><i>answers directly, uses the right tense and gives details<\/i><\/b><i>. Read your choice aloud.<\/i>", "items": [{"level": 1, "q": "Do you often feel tired?", "options": [{"letter": "A", "text": "Yes, I often feel tired."}, {"letter": "B", "text": "Yes, quite often, especially on Mondays, because I stay up late doing homework."}, {"letter": "C", "text": "Yes, I felt tired yesterday."}], "correct": "B", "note": "B dùng 5W1H (When + Why). A lặp lại câu hỏi; C sai thì và chỉ nói về một ngày.", "kind": "choice"}, {"level": 1, "q": "How often do you go shopping?", "options": [{"letter": "A", "text": "About once a month, usually with my mum, because she likes to choose my clothes."}, {"letter": "B", "text": "I like shopping very much."}, {"letter": "C", "text": "Shopping is popular in Vietnam."}], "correct": "A", "note": "A trả lời đúng <i>how often<\/i> và thêm Who + Why. B trả lời câu hỏi khác (<i>Do you like…?<\/i>); C nói về người khác.", "kind": "choice"}, {"level": 1, "q": "Did you enjoy travelling by car when you were a kid?", "options": [{"letter": "A", "text": "Yes, I enjoy it."}, {"letter": "B", "text": "Yes, car."}, {"letter": "C", "text": "Not really. I always got carsick, so long trips were a nightmare for me."}], "correct": "C", "note": "C đúng thì quá khứ (Tense control) và có lý do thật. A sai thì; B quá ngắn và sai ngữ pháp.", "kind": "choice"}, {"level": 1, "q": "Do you wear a watch?", "options": [{"letter": "A", "text": "No."}, {"letter": "B", "text": "Not anymore. I used to, but now I just check the time on my phone."}, {"letter": "C", "text": "Watches are very expensive nowadays."}], "correct": "B", "note": "B so sánh quá khứ và hiện tại bằng <i>used to<\/i> + <i>now<\/i>. A quá ngắn; C không trả lời câu hỏi.", "kind": "choice"}, {"level": 2, "q": "Do you prefer online shopping or in-store shopping?", "options": [{"letter": "A", "text": "I like both of them."}, {"letter": "B", "text": "Online shopping is online and in-store shopping is in a store."}, {"letter": "C", "text": "I'd say in-store shopping, because I like trying clothes on before I buy them."}], "correct": "C", "note": "C chọn một bên và nêu lý do (Why). A né câu hỏi chọn lựa; B chỉ định nghĩa, không có ý.", "kind": "choice"}, {"level": 2, "q": "Have you ever returned anything you bought online?", "options": [{"letter": "A", "text": "Yes, I have. Last month I returned a pair of shoes because they were too small."}, {"letter": "B", "text": "Yes, I return things."}, {"letter": "C", "text": "Yes, I will return it."}], "correct": "A", "note": "A dùng <i>Yes, I have<\/i> rồi quá khứ đơn cho chi tiết. B và C sai thì.", "kind": "choice"}, {"level": 2, "q": "What kinds of websites do you often visit?", "options": [{"letter": "A", "text": "Websites are useful."}, {"letter": "B", "text": "Mostly learning websites, like online dictionaries. I use them almost every night for my homework."}, {"letter": "C", "text": "I visit websites, many websites, every day."}], "correct": "B", "note": "B có ví dụ cụ thể (What) và thời gian (When). A chung chung; C lặp từ và không có ý.", "kind": "choice"}, {"level": 3, "q": "Do you think it is important to wear a watch? Why?", "options": [{"letter": "A", "text": "Yes, it is important because it is important."}, {"letter": "B", "text": "Watches were invented a long time ago."}, {"letter": "C", "text": "Not really, because most people have phones. Mind you, a watch is handy in exams, when phones aren't allowed."}], "correct": "C", "note": "C nêu ý chính, lý do và một chi tiết thật về việc đi thi (Personalisation). A lặp ý; B không liên quan.", "kind": "choice"}, {"level": 3, "q": "Did you prefer to do activities alone or with a group of people when you were a child?", "options": [{"letter": "A", "text": "With a group, definitely. I was always out playing football with the kids in my alley."}, {"letter": "B", "text": "I prefer doing things alone now."}, {"letter": "C", "text": "Group activities are good for children."}], "correct": "A", "note": "A đúng thì quá khứ và có kỷ niệm riêng. B nói về hiện tại; C nói chung chung về trẻ em.", "kind": "choice"}, {"level": 3, "q": "Do you like taking pictures of different views?", "options": [{"letter": "A", "text": "Yes, I like taking pictures of different views."}, {"letter": "B", "text": "Yes, especially sunsets. Whenever I travel, I take loads of photos, though I rarely look at them again."}, {"letter": "C", "text": "Taking pictures is a popular hobby."}], "correct": "B", "note": "B có chi tiết (What: sunsets) và thói quen thật của bạn. A lặp câu hỏi; C không nói về bản thân.", "kind": "choice"}]}, {"title": "Exercise 2: 5W1H: add specific details", "intro": "<i>The short answer is not enough. Say it again, then add details using the cues (each | starts a new sentence or idea). Speak first, then write.<\/i>", "items": [{"level": 1, "q": "What do you do when you feel tired?", "short": "I usually take a nap.", "expand": "for about twenty minutes / after lunch | help / me / feel fresh", "hint": "Technique: 5W1H (How long + When)", "answer": "I usually take a nap for about twenty minutes after lunch. It helps me feel fresh for my afternoon classes.", "model": false, "note": "Thêm thời lượng (<i>for about twenty minutes<\/i>) và thời điểm (<i>after lunch<\/i>).", "kind": "write", "suggest": true}, {"level": 1, "q": "Do you like shopping?", "short": "Yes, I do.", "expand": "especially / for clothes | usually / go / with / best friend / at the weekend", "hint": "Technique: 5W1H (What + Who + When)", "answer": "Yes, I do, especially shopping for clothes. I usually go with my best friend at the weekend.", "model": false, "note": "Ba chi tiết ngắn (What, Who, When) đủ làm câu trả lời sinh động.", "kind": "write", "suggest": true}, {"level": 1, "q": "Do you prefer to sit by the window when travelling?", "short": "Yes, definitely.", "expand": "like / watch / rice fields | on / bus trips / to / grandparents' village", "hint": "Technique: 5W1H (What + Where)", "answer": "Yes, definitely. I like watching the rice fields on bus trips to my grandparents' village.", "model": false, "note": "Chi tiết <i>What<\/i> (rice fields) và <i>Where<\/i> (bus trips to…) thay cho lý do chung <i>the view is nice<\/i>.", "kind": "write", "suggest": true}, {"level": 1, "q": "Where do you usually buy fruit and vegetables?", "short": "My mum usually buys them.", "expand": "at / local market / near our house | every morning / because / cheaper and fresher", "hint": "Technique: 5W1H (Where + When + Why)", "answer": "My mum usually buys them at a local market near our house. She goes every morning, because it's cheaper and fresher than the supermarket.", "model": false, "note": "Ba chi tiết Where, When, Why. Nếu thật ra mẹ bạn đi mua, cứ nói thật.", "kind": "write", "suggest": true}, {"level": 2, "q": "What do you like to do when visiting a park?", "short": "I like walking around.", "expand": "usually / in the evening / with my mum | watch / people / dance / play badminton", "hint": "Technique: 5W1H (When + Who + What)", "answer": "I like walking around, usually in the evening with my mum. We often stop to watch people dance or play badminton.", "model": false, "note": "Không cần đủ sáu W; ba chi tiết ngắn là quá đủ.", "kind": "write", "suggest": true}, {"level": 2, "q": "What kinds of websites do you often visit?", "short": "Mostly learning websites.", "expand": "like / online dictionaries | use / them / almost every night / for / homework", "hint": "Technique: 5W1H (What + When + Why)", "answer": "Mostly learning websites, like online dictionaries. I use them almost every night for my homework.", "model": false, "note": "<i>like…<\/i> đưa ví dụ cụ thể (What) ngay sau câu trả lời ngắn.", "kind": "write", "suggest": true}, {"level": 2, "q": "What do you do when you see rubbish on the street?", "short": "I usually pick it up.", "expand": "if / near / bin | otherwise / put / in / bag / until / get home", "hint": "Technique: 5W1H (Where + How)", "answer": "I usually pick it up if it's near a bin. Otherwise, I put it in my bag until I get home.", "model": false, "note": "Chi tiết <i>How<\/i> (cách bạn xử lý) làm câu trả lời thật và cụ thể.", "kind": "write", "suggest": true}, {"level": 3, "q": "Have you seen an unforgettable and beautiful view or scenery?", "short": "Yes, I have.", "expand": "last summer / see / sunrise / in Sa Pa | mountains / covered in clouds", "hint": "Technique: 5W1H (When + Where + What) + Tense control", "answer": "Yes, I have. Last summer I saw the sunrise in Sa Pa. The mountains were covered in clouds, and it looked unreal.", "model": false, "note": "<i>Have you seen…?<\/i> → <i>Yes, I have<\/i> + quá khứ đơn (<i>saw, were<\/i>) cho chi tiết.", "kind": "write", "suggest": true}, {"level": 3, "q": "How do you remember people's names?", "short": "I try to link the name to something.", "expand": "for example / new classmate / called / Mai | remember / because / my aunt / same name", "hint": "Technique: 5W1H (How) + Personalisation", "answer": "I try to link the name to something. For example, I remember a new classmate called Mai because my aunt has the same name.", "model": false, "note": "Ví dụ thật (<i>For example…<\/i>) cho thấy bạn đang kể, không phải đọc thuộc.", "kind": "write", "suggest": true}, {"level": 3, "q": "Is there anything you miss about your secondary school?", "short": "Yes, quite a few things.", "expand": "miss / my old friends / and / long summer holidays | in grade 9 / we / spend / every afternoon / together", "hint": "Technique: 5W1H (What + When) + Tense control", "answer": "Yes, quite a few things. I really miss my old friends and the long summer holidays. In grade 9, we spent every afternoon together.", "model": false, "note": "Hiện tại (<i>miss<\/i>) cho cảm xúc bây giờ, quá khứ (<i>spent<\/i>) cho kỷ niệm.", "kind": "write", "suggest": true}]}, {"title": "Exercise 3: Personalisation: make a memorised answer your own", "intro": "<i>This answer sounds memorised. Say it again, replacing the general reason with the personal detail given. Then try it again with a real detail about you.<\/i>", "items": [{"level": 1, "q": "Do you often feel tired?", "rote": "Yes, because modern life is very stressful.", "trait": "super hectic schedule", "hint": "Detail: a very busy schedule", "answer": "Yes, quite often. I have a super hectic schedule this year, with school all day and extra classes three evenings a week.", "model": false, "note": "Thay lý do chung (<i>modern life is stressful<\/i>) bằng lịch học thật của bạn.", "kind": "write", "suggest": true}, {"level": 1, "q": "How often do you go shopping?", "rote": "Not often, because shopping wastes time and money.", "trait": "live with my parents", "hint": "Detail: you live with your parents", "answer": "Not very often, actually. I still live with my parents, and my mum buys most of my clothes, so I only go when I need something special.", "model": false, "note": "Hoàn cảnh thật (mẹ mua đồ cho) giải thích câu trả lời tự nhiên hơn lý do chung.", "kind": "write", "suggest": true}, {"level": 1, "q": "How often do you eat fruit and vegetables?", "rote": "Every day, because they are good for our health.", "trait": "extended family", "hint": "Detail: an extended family", "answer": "Every single day. I live in an extended family, and my grandma always puts a big plate of fruit on the table after dinner.", "model": false, "note": "<i>good for our health<\/i> là lý do ai cũng nói; chi tiết về bà làm câu trả lời có cá tính.", "kind": "write", "suggest": true}, {"level": 1, "q": "Do you listen to music while doing other things?", "rote": "Yes, because music is relaxing.", "trait": "preparing for the university entrance exam", "hint": "Detail: preparing for the university entrance exam", "answer": "Yes, all the time. I'm preparing for the university entrance exam, so I put on some quiet piano music to help me focus while I revise.", "model": false, "note": "Gắn thói quen nghe nhạc với việc ôn thi thật của bạn.", "kind": "write", "suggest": true}, {"level": 2, "q": "Do you like to keep things tidy?", "rote": "Yes, because a tidy room is good for studying.", "trait": "share a room with", "hint": "Detail: you share a room with a younger sibling", "answer": "I try to, but it's not easy. I share a room with my younger sister, and her stuff always ends up on my desk.", "model": false, "note": "Một chi tiết hơi buồn cười về em gái làm câu trả lời tự nhiên và dễ nhớ.", "kind": "write", "suggest": true}, {"level": 2, "q": "What is your favourite website?", "rote": "My favourite website is YouTube because it is useful and interesting.", "trait": "first-year law student", "hint": "Detail: a first-year law student", "answer": "Probably a legal database my lecturers recommended. As a first-year law student, I use it almost every day to look up cases.", "model": false, "note": "<i>useful and interesting<\/i> quá chung. Dành cho sinh viên Luật; học sinh cấp 3 có thể nói về một trang học tiếng Anh cụ thể.", "kind": "write", "suggest": true}, {"level": 2, "q": "How do you remember people's names?", "rote": "I repeat the name many times because it is a good method.", "trait": "terrible memory for names", "hint": "Detail: you often forget names", "answer": "I have a terrible memory for names, so I save new classmates in my phone with a little note, like \"Minh, glasses, sits by the window\".", "model": false, "note": "Cách làm thật của bạn (ghi chú trong điện thoại) thuyết phục hơn <i>a good method<\/i>.", "kind": "write", "suggest": true}, {"level": 3, "q": "What do you usually do when there is a traffic jam?", "rote": "I stay calm and wait patiently because getting angry is useless.", "trait": "ride an electric bike to school", "hint": "Detail: you ride an electric bike to school", "answer": "I ride an electric bike to school, so I usually squeeze through the side streets. If that doesn't work, I put on a podcast and accept that I'll be late.", "model": false, "note": "Phương tiện thật của bạn quyết định bạn làm gì khi kẹt xe; câu trả lời vì thế rất tự nhiên.", "kind": "write", "suggest": true}, {"level": 3, "q": "What do you like to do when visiting a park?", "rote": "I like walking and breathing fresh air because it is good for health.", "trait": "live in a high-rise flat", "hint": "Detail: you live in a high-rise flat", "answer": "Mostly I just walk around and look at the trees. I live in a high-rise flat with no garden, so being surrounded by green space is a real treat for me.", "model": false, "note": "Hoàn cảnh sống (chung cư, không có vườn) giải thích vì sao bạn thích công viên.", "kind": "write", "suggest": true}, {"level": 3, "q": "In what conditions would you use a computer or tablet?", "rote": "I would use a computer for studying and entertainment because it is convenient.", "trait": "preparing for the university entrance exam", "hint": "Detail: preparing for the university entrance exam + keep <i>would<\/i>", "answer": "Mostly for revision. Since I'm preparing for the university entrance exam, I'd use my tablet every evening for practice tests, and I'd only play games once I'd finished.", "model": false, "note": "Câu hỏi dùng <i>would<\/i> nên câu trả lời giữ <i>I'd use<\/i>. Kết hợp Personalisation và Tense control.", "kind": "write", "suggest": true}]}, {"title": "Exercise 4: Tense control", "intro": "<i>Listen to the question and find the tense signal. Use the given phrases to say a short answer <\/i><b><i>in the right tense<\/i><\/b><i>. Speak first, then write.<\/i>", "items": [{"level": 1, "q": "What was your favourite subject at secondary school?", "use": "my favourite subject / was / history", "hint": "Past question → past simple", "answer": "My favourite subject was history.", "model": false, "alt": "I think my favourite subject was history, because the teacher told great stories.", "note": "<i>What was…?<\/i> → trả lời bằng <i>was<\/i>, không dùng <i>is<\/i>.", "kind": "write"}, {"level": 1, "q": "Did you recycle when you were a kid?", "use": "Not really / didn't / think about it", "hint": "<i>Did you…?<\/i> → <i>didn't<\/i> + base verb", "answer": "Not really. I didn't really think about it when I was a kid.", "model": false, "alt": "Not really. Back then, I didn't think about it much.", "note": "Phủ định quá khứ: <i>didn't + V<\/i> (không dùng <i>didn't thought<\/i>).", "kind": "write"}, {"level": 1, "q": "Have you ever lost your keys?", "use": "Yes, I have / lost / last month", "hint": "<i>Have you ever…?<\/i> → <i>Yes, I have<\/i> + past simple for the details", "answer": "Yes, I have. I lost them at school last month.", "model": false, "alt": "Yes, I have. Last month I lost them somewhere at school.", "note": "Có mốc thời gian cụ thể (<i>last month<\/i>) → quá khứ đơn <i>lost<\/i>.", "kind": "write"}, {"level": 1, "q": "When was the first time you used a computer or tablet?", "use": "first / used / computer / when / I was about six", "hint": "<i>When was…?<\/i> → past simple", "answer": "I first used a computer when I was about six.", "model": false, "alt": "I think I first used a computer when I was about six, at my uncle's house.", "note": "<i>first<\/i> đứng trước động từ: <i>I first used…<\/i>.", "kind": "write"}, {"level": 2, "q": "Will you post on social media if you lose your item?", "use": "probably will / if / something important", "hint": "<i>Will you… if…?<\/i> → first conditional", "answer": "Yes, I probably will, if it's something important.", "model": false, "alt": "If it's something important, then yes, I probably will.", "note": "Sau <i>if<\/i> dùng hiện tại đơn (<i>it's<\/i>), mệnh đề chính dùng <i>will<\/i>.", "kind": "write"}, {"level": 2, "q": "What would your life be like without computers or tablets?", "use": "would be / much harder / especially / studying", "hint": "Hypothetical question: use <i>would<\/i>", "answer": "It would be much harder, especially for studying.", "model": false, "alt": "Honestly, life would be much harder, especially when it comes to studying.", "note": "Câu hỏi giả định → trả lời bằng <i>would be<\/i>.", "kind": "write"}, {"level": 2, "q": "How are the parks today different from those you visited as a kid?", "use": "when I was a kid / used to / these days", "hint": "Compare past and present", "answer": "When I was a kid, parks used to be quieter, but these days they're busier.", "model": false, "alt": "Parks used to be quieter when I was a kid, but these days they're always crowded.", "note": "<i>used to<\/i> cho quá khứ, <i>these days<\/i> + hiện tại đơn cho bây giờ.", "kind": "write"}, {"level": 3, "q": "Are there any differences between the activities you liked when you were a child and those you like now?", "use": "used to / these days / tend to", "hint": "Compare past and present; add <i>tend to<\/i>", "answer": "Yes, quite a lot. I used to love playing outside, but these days I tend to stay in and read.", "model": false, "alt": "Definitely. I used to spend hours outdoors, whereas these days I tend to stay at home with my books.", "note": "<i>tend to + V<\/i> (có xu hướng) giúp câu trả lời nghe tự nhiên, bớt tuyệt đối.", "kind": "write"}, {"level": 3, "q": "Did you keep your room tidy as a child?", "use": "not at all / my mum / always / had to", "hint": "Past question; use <i>had to<\/i>", "answer": "Not at all. My mum always had to remind me to clean it up.", "model": false, "alt": "Not at all, to be honest. My mum always had to tell me to tidy it.", "note": "<i>had to<\/i> là quá khứ của <i>have to<\/i>.", "kind": "write"}, {"level": 3, "q": "Will you buy an expensive car in the future?", "use": "I doubt it / I'd rather / spend / money on", "hint": "Future question: <i>I doubt it<\/i> + <i>I'd rather<\/i>", "answer": "I doubt it. I'd rather spend my money on travelling.", "model": false, "alt": "Honestly, I doubt it. I'd rather spend money on things like travelling or education.", "note": "<i>I'd rather + V nguyên mẫu<\/i> = tôi thích … hơn.", "kind": "write"}]}]}, {"num": 3, "name": "Work or studies", "theory": [{"type": "sub", "text": "Mục đích"}, {"type": "p", "html": "Unit này luyện <b>từ vựng và cách diễn đạt trong handout (mục 1.1 và 1.2)<\/b> với hoàn cảnh của học sinh cấp 3. Các câu dành riêng cho sinh viên Luật được ghi rõ trong gợi ý. Số câu hỏi (Q1-Q20) khớp với danh sách trong handout."}, {"type": "p", "html": "Nếu bạn <b>chưa đi làm<\/b> mà gặp câu hỏi Q12-Q20, hãy nói thật (<i>I'm still a student, so I don't work yet<\/i>) rồi chuyển sang việc học hoặc công việc mơ ước."}, {"type": "sub", "text": "Từ vựng hay cho chủ đề"}, {"type": "table", "head": ["Phrase", "Meaning", "Example in speech"], "rows": [{"level": 1, "cells": ["academic achievement", "thành tích học tập", "My parents put my <b>academic achievements<\/b> on the fridge."]}, {"level": 1, "cells": ["under a lot of pressure", "chịu nhiều áp lực", "I'm <b>under a lot of pressure<\/b> this year because of exams."]}, {"level": 1, "cells": ["make steady progress", "tiến bộ đều", "I'm <b>making steady progress<\/b> with my speaking."]}, {"level": 1, "cells": ["snowed under with", "ngập trong (bài vở)", "Before exams, I'm <b>snowed under with<\/b> homework."]}, {"level": 2, "cells": ["academic performance", "kết quả học tập", "Lack of sleep really affects my <b>academic performance<\/b>."]}, {"level": 2, "cells": ["get the hang of", "quen dần, nắm được", "I'm still trying to <b>get the hang of<\/b> essay writing."]}, {"level": 2, "cells": ["working towards", "nỗ lực hướng tới", "I'm <b>working towards<\/b> a band 6.5."]}, {"level": 2, "cells": ["higher education", "giáo dục đại học", "I hope to go into <b>higher education<\/b> in Hanoi."]}, {"level": 2, "cells": ["learning environment", "môi trường học tập", "My school has a really supportive <b>learning environment<\/b>."]}, {"level": 2, "cells": ["can get a bit overwhelmed", "đôi khi bị quá tải", "When three tests fall on one day, I <b>can get a bit overwhelmed<\/b>."]}, {"level": 3, "cells": ["come a long way", "tiến bộ rất nhiều", "My English <b>has come a long way<\/b> since grade 10."]}, {"level": 3, "cells": ["challenging but rewarding", "khó nhưng xứng đáng", "Studying law is <b>challenging but rewarding<\/b>."]}, {"level": 3, "cells": ["critical thinking", "tư duy phản biện", "Debating helps me develop <b>critical thinking<\/b>."]}, {"level": 3, "cells": ["deep understanding", "hiểu biết sâu sắc", "I want a <b>deep understanding<\/b> of how the law works."]}, {"level": 3, "cells": ["up against tight deadlines", "chạy đua với hạn chót", "During project weeks, we're <b>up against tight deadlines<\/b>."]}, {"level": 3, "cells": ["lifelong learning", "học tập suốt đời", "My dad believes in <b>lifelong learning<\/b>; he's learning Korean at 50."]}]}, {"type": "sub", "text": "Từ câu ngắn đến câu trả lời đầy đủ"}, {"type": "p", "html": "Công thức: <b>trả lời trực tiếp + ít nhất 1 trong 3 kỹ thuật<\/b>: 1-2 chi tiết cụ thể (5W1H), một điều thật về bạn (Personalisation) hoặc đúng thì (Tense control). Chỉ cần 2-4 câu."}, {"type": "table", "head": ["Question + short answer", "Technique", "Extended answer"], "rows": [{"level": 0, "cells": ["<i>Q8 How much time do you spend on your studies each week?<\/i> → A lot.", "Personalisation", "Quite a lot, actually. I'm <b>snowed under with<\/b> homework this year, and I take extra classes three evenings a week."]}, {"level": 0, "cells": ["<i>Q10 What technology do you use when you study?<\/i> → My laptop.", "5W1H (What + When)", "I mostly use my laptop. I look up new words in an online dictionary every night, for about an hour."]}, {"level": 0, "cells": ["<i>Q12 What work do you do?<\/i> → I don't work.", "Personalisation", "I don't work yet, because I'm still a student. Right now I'm <b>working towards<\/b> a good score in the university entrance exam."]}]}, {"type": "sub", "text": "Câu mẫu"}, {"type": "samples", "items": ["<i>Q7 Do you prefer to study in the mornings or in the afternoons?<\/i> → Definitely the mornings. My mind's much fresher then, whereas in the afternoons I often feel sleepy after lunch.", "<i>Q4 Do you have any plans for your studies in the next five years?<\/i> → Yes, I do. I'm hoping to go into <b>higher education<\/b> in law, and then maybe do a master's degree abroad.", "<i>Q2 Why did you choose to study that subject?<\/i> (sinh viên Luật) → I chose law because I wanted a <b>deep understanding<\/b> of how society works, and it's <b>challenging but rewarding<\/b>."]}, {"type": "mistakes", "items": [{"bad": "I am student grade 11.", "good": "I'm in grade 11.", "note": "Không nói <i>student grade 11<\/i>. Dùng <i>I'm in grade 11<\/i> hoặc <i>I'm a grade 11 student<\/i>."}, {"bad": "I do steady progress every week.", "good": "I'm making steady progress every week.", "note": "Kết hợp từ đúng là <i>make progress<\/i> (handout: <i>I'm making steady progress<\/i>)."}, {"bad": "I'm snowed with homework.", "good": "I'm snowed under with homework.", "note": "Cụm cố định <i>snowed under with<\/i>, không bỏ <i>under<\/i>."}]}, {"type": "choose", "items": [{"h": "<b>study / learn<\/b>", "html": "<b>study<\/b> (học một môn, ôn bài): I'm <b>studying<\/b> for my exams. · <b>learn<\/b> (học được, biết thêm): I <b>learned<\/b> a lot from that teacher."}, {"h": "<b>Cụm trong handout viết cho người đi làm → đổi sang việc học<\/b>", "html": "<i>snowed under with work<\/i> → <b>with homework<\/b> · <i>up against tight deadlines<\/i> (internship) → <b>during project weeks<\/b> · <i>working towards a promotion<\/i> → <b>a band 6.5 / a place at university<\/b>."}]}, {"type": "sounds", "lines": ["<b>Cụm phụ âm cuối:<\/b> subje<b>cts<\/b> /kts/ · achieveme<b>nts<\/b> /nts/ · deadli<b>nes<\/b> /nz/", "<b>-ed:<\/b> snow<b>ed<\/b> /d/ · overwhelm<b>ed<\/b> /d/ · finish<b>ed<\/b> /t/", "<b>Trọng âm:<\/b> aca<b>DEM<\/b>ic · per<b>FOR<\/b>mance · <b>CRIT<\/b>ical"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}], "exercises": [{"title": "Exercise 1: Topic vocabulary → spoken sentence", "intro": "<i>Look at the cues, say the full sentence aloud (without reading), then write it. Each sentence has one topic phrase; use that exact phrase.<\/i>", "items": [{"level": 1, "cue": "my parents / proud of / my academic achievements", "hint": "Add <i>are<\/i>; you can add <i>really<\/i>", "answer": "My parents are really proud of my academic achievements.", "model": false, "alt": "My parents are proud of my academic achievements, especially in maths.", "note": "<i>be proud of<\/i> + danh từ; <i>achievements<\/i> thường ở số nhiều.", "kind": "write"}, {"level": 1, "cue": "I / under a lot of pressure / this year", "hint": "Add <i>am<\/i>", "answer": "I'm under a lot of pressure this year.", "model": false, "alt": "This year I'm under a lot of pressure because of the exams.", "note": "<i>be under pressure<\/i>; có thể thêm lý do bằng <i>because of<\/i>.", "kind": "write"}, {"level": 1, "cue": "I / make steady progress / with / my English", "hint": "Present continuous", "answer": "I'm making steady progress with my English.", "model": false, "alt": "Thanks to my teacher, I'm making steady progress with my English.", "note": "<i>make progress<\/i> (không dùng <i>do progress<\/i>); hiện tại tiếp diễn cho quá trình đang diễn ra.", "kind": "write"}, {"level": 1, "cue": "I / snowed under with / homework / before exams", "hint": "Add <i>am<\/i>", "answer": "I'm snowed under with homework before exams.", "model": false, "alt": "Before exams, I'm always snowed under with homework.", "note": "Handout dùng <i>with work<\/i>; với học sinh, đổi thành <i>with homework<\/i>.", "kind": "write"}, {"level": 2, "cue": "lack of sleep / really affect / my academic performance", "hint": "Third person singular: <i>affects<\/i>", "answer": "Lack of sleep really affects my academic performance.", "model": false, "alt": "Honestly, lack of sleep really affects my academic performance, especially in maths.", "note": "<i>lack of sleep<\/i> là danh từ số ít → <i>affects<\/i>.", "kind": "write"}, {"level": 2, "cue": "I / still / try / get the hang of / essay writing", "hint": "Pattern: <i>be trying to + verb<\/i>", "answer": "I'm still trying to get the hang of essay writing.", "model": false, "alt": "To be honest, I'm still trying to get the hang of essay writing.", "note": "<i>get the hang of<\/i> + danh từ hoặc V-ing.", "kind": "write"}, {"level": 2, "cue": "I / work towards / band 6.5 / in IELTS", "hint": "Present continuous; article <i>a<\/i>", "answer": "I'm working towards a band 6.5 in IELTS.", "model": false, "alt": "At the moment I'm working towards a band 6.5 in IELTS.", "note": "Handout: <i>working towards a promotion<\/i>; với học sinh, đổi thành mục tiêu học tập.", "kind": "write"}, {"level": 3, "cue": "Say how your English has changed since grade 10. Use \"come a long way\".", "hint": "Present perfect + compare with before", "answer": "I've come a long way since grade 10. Back then I could hardly speak, but now I can chat with my teacher in English.", "model": false, "alt": "My English has come a long way since grade 10. I used to freeze when I spoke, but now I feel much more confident.", "note": "<i>have come a long way since<\/i> + mốc thời gian (hiện tại hoàn thành).", "kind": "write"}, {"level": 3, "cue": "Say what you plan to do after high school. Use \"higher education\".", "hint": "Future plans", "answer": "I'm planning to go into higher education, hopefully studying law at a university in Hanoi.", "model": false, "alt": "After high school, I'm hoping to go into higher education, probably in economics.", "note": "<i>go into / pursue higher education<\/i>: <i>I'm planning to / I'm hoping to<\/i> cho kế hoạch.", "kind": "write"}, {"level": 3, "cue": "Describe your school. Use \"learning environment\" and \"critical thinking\".", "hint": "Two sentences: comment + detail", "answer": "My school has a really supportive learning environment. The teachers encourage critical thinking, so we're always asked to explain our opinions.", "model": false, "alt": "The learning environment at my school is quite competitive, but our teachers do encourage critical thinking in class discussions.", "note": "Câu đầu nhận xét, câu sau thêm chi tiết (5W1H: Who + How).", "kind": "write"}]}, {"title": "Exercise 2: Extend the answer", "intro": "<i>The short answer is not enough. Say it again, then extend it by 1–2 sentences using the cues (each | starts a new sentence or idea). Speak first, then write.<\/i>", "items": [{"level": 1, "q": "What subjects are you studying?", "qnum": "Q1", "short": "I'm studying lots of subjects.", "expand": "at the moment / spend / most of my time / on / maths and English | because / need / them / for / university entrance exam", "hint": "Technique: 5W1H (What + Why)", "answer": "I'm studying lots of subjects, but at the moment I spend most of my time on maths and English, because I need them for the university entrance exam.", "model": false, "note": "Nêu cụ thể môn nào (What) và vì sao (Why) thay vì chỉ nói <i>lots of subjects<\/i>.", "kind": "write", "suggest": true}, {"level": 1, "q": "Do you prefer to study in the mornings or in the afternoons?", "qnum": "Q7", "short": "I prefer the mornings.", "expand": "because / mind / fresher | in the afternoons / often / feel sleepy", "hint": "Technique: 5W1H (Why)", "answer": "I prefer the mornings, because my mind is much fresher. In the afternoons, I often feel sleepy after lunch.", "model": false, "note": "Câu hỏi chọn lựa: chọn một bên, rồi so sánh với bên còn lại.", "kind": "write", "suggest": true}, {"level": 1, "q": "What technology do you use when you study?", "qnum": "Q10", "short": "I mostly use my laptop.", "expand": "look up / new words / online dictionary | every night / for about an hour", "hint": "Technique: 5W1H (What + When)", "answer": "I mostly use my laptop. I look up new words in an online dictionary every night, usually for about an hour.", "model": false, "note": "Thêm <i>When<\/i> (every night) và <i>How long<\/i> (for about an hour).", "kind": "write", "suggest": true}, {"level": 1, "q": "How much time do you spend on your studies each week?", "qnum": "Q8", "short": "Quite a lot, actually.", "expand": "snowed under with / homework | apart from / school / take extra classes / three evenings a week", "hint": "Technique: Personalisation", "answer": "Quite a lot, actually. I'm snowed under with homework this year, and apart from school, I take extra classes three evenings a week.", "model": false, "note": "Lịch học thật của bạn (học thêm ba tối) trả lời đúng <i>how much time<\/i>.", "kind": "write", "suggest": true}, {"level": 2, "q": "Do you have any plans for your studies in the next five years?", "qnum": "Q4", "short": "Yes, I do.", "expand": "hoping to / go into / higher education / in law | then / maybe / do / master's degree / abroad", "hint": "Technique: Tense control (future plans)", "answer": "Yes, I do. I'm hoping to go into higher education in law, and then maybe do a master's degree abroad.", "model": false, "note": "Câu hỏi về <i>the next five years<\/i> → <i>I'm hoping to / I'd like to<\/i>.", "kind": "write", "suggest": true}, {"level": 2, "q": "What changes would you like to see in your school?", "qnum": "Q11", "short": "I'd like to see more practical lessons.", "expand": "at the moment / most lessons / exam-focused | so / no time / for / critical thinking", "hint": "Technique: 5W1H (Why)", "answer": "I'd like to see more practical lessons. At the moment, most lessons are very exam-focused, so there's no time for critical thinking.", "model": false, "note": "Nêu tình trạng hiện tại để giải thích vì sao bạn muốn thay đổi.", "kind": "write", "suggest": true}, {"level": 2, "q": "Are you looking forward to working?", "qnum": "Q9", "short": "Yes, definitely.", "expand": "can't wait / earn / my own money | although / bit nervous / about / pressure", "hint": "Technique: Personalisation", "answer": "Yes, definitely. I can't wait to earn my own money, although I'm a bit nervous about the pressure of a full-time job.", "model": false, "note": "<i>can't wait to + V<\/i> (rất mong); <i>although<\/i> thêm cảm xúc thật.", "kind": "write", "suggest": true}, {"level": 3, "q": "Why did you choose to study that subject?", "qnum": "Q2", "short": "I chose law mainly because of my dad.", "expand": "he / lawyer / always / say / job / challenging but rewarding", "hint": "Technique: Personalisation (for law students)", "answer": "I chose law mainly because of my dad. He's a lawyer, and he always says his job is challenging but rewarding.", "model": false, "note": "Câu hỏi quá khứ (<i>did you choose<\/i>) → <i>I chose<\/i>. Học sinh cấp 3 có thể nói về ngành dự định học.", "kind": "write", "suggest": true}, {"level": 3, "q": "What are the benefits of being your age?", "qnum": "Q5", "short": "I'd say the biggest benefit is having few responsibilities.", "expand": "my parents / still / take care of / bills | can / focus on / studying | although / under a lot of pressure", "hint": "Technique: Personalisation", "answer": "I'd say the biggest benefit is having few responsibilities. My parents still take care of the bills, so I can focus on studying, although I'm under a lot of pressure from exams.", "model": false, "note": "Lợi ích → lý do thật → một ý ngược lại: đủ dài nhưng vẫn gọn.", "kind": "write", "suggest": true}, {"level": 3, "q": "What do you think is the most important at the moment?", "qnum": "Q17", "short": "For me, it's definitely the university entrance exam.", "expand": "next summer | working towards / place / at / good university | so / every hour / count", "hint": "Technique: Tense control + Personalisation", "answer": "For me, it's definitely the university entrance exam next summer. I'm working towards a place at a good university, so every hour counts right now.", "model": false, "note": "Hiện tại tiếp diễn (<i>I'm working towards<\/i>) cho mục tiêu đang theo đuổi.", "kind": "write", "suggest": true}]}, {"title": "Exercise 3: Answer the forecast questions", "intro": "<i>Answer in 2–4 sentences (about 20–40 words). Use the given phrase and the technique in the hint. The suggestion is only an example; talk about your real life.<\/i>", "items": [{"level": 1, "q": "What subjects are you studying?", "qnum": "Q1", "use": "<b>make steady progress<\/b>", "hint": "Technique: 5W1H (What)", "answer": "I'm in grade 11, so I study about ten subjects. I'm doing well in maths, and I'm making steady progress in English, but literature is still a real struggle.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "Do you think that your subject is popular in your country?", "qnum": "Q3", "use": "<b>higher education<\/b>", "hint": "Technique: 5W1H (Why)", "answer": "Yes, English is really popular in Vietnam. Lots of students learn it because they want to go into higher education abroad one day.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "How much time do you spend on your studies each week?", "qnum": "Q8", "use": "<b>under a lot of pressure<\/b>", "hint": "Technique: Personalisation", "answer": "Probably around forty hours a week. I'm under a lot of pressure this year, so besides school, I also take extra classes and study at weekends.", "model": true, "kind": "write", "suggest": true}, {"level": 1, "q": "What changes would you like to see in your school?", "qnum": "Q11", "use": "<b>learning environment<\/b>", "hint": "Technique: 5W1H (What + Why)", "answer": "I'd love a more relaxed learning environment. There's too much focus on tests at my school, so students are always stressed.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "What are the benefits of being your age?", "qnum": "Q5", "use": "<b>get the hang of<\/b>", "hint": "Technique: Personalisation", "answer": "I think young people pick things up quickly. For example, I got the hang of video editing in just a week, while my dad is still struggling with it.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "What work do you do?", "qnum": "Q12", "use": "<b>working towards<\/b>", "hint": "Technique: Personalisation (if you don't work yet)", "answer": "I don't work yet, because I'm still a student. Right now I'm working towards a good score in the university entrance exam, which feels like a full-time job.", "model": true, "kind": "write", "suggest": true}, {"level": 2, "q": "Do you miss being a student?", "qnum": "Q19", "use": "<b>I'm still a student<\/b>", "hint": "Technique: Tense control (if you don't work yet)", "answer": "I'm still a student, so not yet! But I'm sure I'll miss my classmates one day, because we've been through so much together.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Why did you choose to study that subject?", "qnum": "Q2", "use": "<b>deep understanding<\/b>", "hint": "Technique: Personalisation + Tense control (for law students)", "answer": "I chose law because I wanted a deep understanding of how society works. I was in the debate club in high school, and my teachers kept saying I'd make a good lawyer.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Do you want to change your major?", "qnum": "Q6", "use": "<b>challenging but rewarding<\/b>", "hint": "Technique: Tense control (for law students)", "answer": "Not really. Law is challenging but rewarding, and I've enjoyed it much more since I did an internship last summer.", "model": true, "kind": "write", "suggest": true}, {"level": 3, "q": "Do you have any plans for your studies in the next five years?", "qnum": "Q4", "use": "<b>lifelong learning<\/b>", "hint": "Technique: Tense control (future plans)", "answer": "Yes, I'm hoping to finish a law degree and maybe start a master's. Honestly, though, I believe in lifelong learning, so I'll probably keep taking short courses after that.", "model": true, "kind": "write", "suggest": true}]}]}, {"num": 4, "name": "Home and accommodation", "theory": [{"type": "sub", "text": "Mục đích"}, {"type": "p", "html": "Unit này luyện <b>12 cụm từ trong handout (mục 2.1)<\/b> cho câu hỏi Q1-Q23, gồm cả phần <i>The area you live in<\/i> (Q17-Q23). Phần lớn các bạn sống cùng bố mẹ ở thành phố lớn, nên câu mẫu nói về <b>căn hộ chung cư<\/b> hoặc <b>nhà ống<\/b>."}, {"type": "p", "html": "Nhiều cụm trong handout khá <b>trang trọng<\/b> (<i>immediate environment, close proximity, basic function, living standard<\/i>). Dùng <b>một cụm<\/b> trong một câu trả lời là đủ; dồn nhiều cụm trang trọng vào một câu sẽ nghe như học thuộc. Cột ví dụ dưới đây cho cách dùng tự nhiên khi nói."}, {"type": "sub", "text": "Từ vựng hay cho chủ đề"}, {"type": "table", "head": ["Phrase", "Meaning", "Example in speech"], "rows": [{"level": 1, "cells": ["personal space", "không gian cá nhân", "Having my own room gives me some <b>personal space<\/b>."]}, {"level": 1, "cells": ["living conditions", "điều kiện sinh hoạt", "The <b>living conditions<\/b> in our flat are pretty good, apart from the heat in summer."]}, {"level": 1, "cells": ["local community", "cộng đồng địa phương", "There's a strong <b>local community<\/b> spirit in our alley."]}, {"level": 2, "cells": ["social interaction", "tương tác xã hội", "There isn't much <b>social interaction<\/b> in my building; people are always busy."]}, {"level": 2, "cells": ["make adjustments", "điều chỉnh", "When my grandma moved in, we all had to <b>make some adjustments<\/b>."]}, {"level": 2, "cells": ["make arrangements", "sắp xếp, thu xếp", "We had to <b>make arrangements<\/b> for my grandma's room before she moved in."]}, {"level": 2, "cells": ["shared experience", "trải nghiệm chung", "Living with three generations gives us lots of <b>shared experiences<\/b>."]}, {"level": 2, "cells": ["ideally suited (to)", "phù hợp lý tưởng", "Our flat is <b>ideally suited to<\/b> a small family like mine."]}, {"level": 3, "cells": ["close proximity (to)", "khoảng cách gần (trang trọng)", "We live in <b>close proximity to<\/b> my school. (Khi nói, <i>close to<\/i> tự nhiên hơn.)"]}, {"level": 3, "cells": ["living standards", "mức sống", "My family's <b>living standards<\/b> have gone up since my parents opened a shop."]}, {"level": 3, "cells": ["immediate environment", "môi trường xung quanh (trang trọng)", "I like a clean <b>immediate environment<\/b>, so I tidy the corridor outside our door."]}, {"level": 3, "cells": ["basic function", "chức năng cơ bản", "For me, the <b>basic function<\/b> of a home is somewhere safe to rest."]}]}, {"type": "sub", "text": "Từ vựng bổ sung để tả nhà của bạn"}, {"type": "p", "html": "Không có trong handout, nhưng cần để mô tả nhà ở thành phố lớn."}, {"type": "table", "head": ["Phrase", "Meaning", "Example in speech"], "rows": [{"level": 1, "cells": ["live with my parents", "sống cùng bố mẹ", "I <b>live with my parents<\/b> and my younger brother."]}, {"level": 1, "cells": ["a high-rise flat", "căn hộ chung cư cao tầng", "We live in <b>a high-rise flat<\/b> on the twelfth floor."]}, {"level": 1, "cells": ["a tube house", "nhà ống", "My grandparents still live in <b>a narrow tube house<\/b>."]}, {"level": 2, "cells": ["cosy / a bit cramped", "ấm cúng / hơi chật", "Our living room is <b>a bit cramped<\/b>, but really <b>cosy<\/b>."]}, {"level": 2, "cells": ["get on well with", "hòa thuận với", "My mum <b>gets on well with<\/b> the neighbours."]}]}, {"type": "sub", "text": "Từ câu ngắn đến câu trả lời đầy đủ"}, {"type": "p", "html": "Công thức: <b>trả lời trực tiếp + ít nhất 1 trong 3 kỹ thuật<\/b>: 1-2 chi tiết cụ thể (5W1H), một điều thật về bạn (Personalisation) hoặc đúng thì (Tense control). Chỉ cần 2-4 câu."}, {"type": "table", "head": ["Question + short answer", "Technique", "Extended answer"], "rows": [{"level": 0, "cells": ["<i>Q1 Who do you live with?<\/i> → My parents.", "5W1H (Who) + Personalisation", "I <b>live with my parents<\/b> and my younger sister. We <b>get on<\/b> really well, although we argue about the TV sometimes."]}, {"level": 0, "cells": ["<i>Q17 Do you live in a noisy or a quiet area?<\/i> → Noisy.", "5W1H (Why + When)", "It's quite noisy, because we live next to a main road. The traffic starts at around 6 a.m."]}, {"level": 0, "cells": ["<i>Q15 How long have you lived there?<\/i> → Ten years.", "Tense control", "About ten years now. We <b>moved<\/b> there when I was in grade 1, so it's the only home I really remember."]}]}, {"type": "sub", "text": "Câu mẫu"}, {"type": "samples", "items": ["<i>Q10 Can you describe the place where you live?<\/i> → It's a three-bedroom flat on the twelfth floor. The <b>living conditions<\/b> are pretty good: it's bright and quiet, and from the balcony we can see a big part of the city.", "<i>Q4 What's the difference between where you are living now and where you have lived in the past?<\/i> → When I was little, we <b>lived<\/b> in a tube house that was a bit cramped. Now we <b>live<\/b> in a flat, which is much brighter.", "<i>Q18 Are the people in your neighbourhood nice and friendly?<\/i> → Yes, most of them are. There's a strong <b>local community<\/b> spirit, and people often chat outside in the evenings."]}, {"type": "mistakes", "items": [{"bad": "I live with my parent.", "good": "I live with my parents.", "note": "Bố và mẹ là hai người → <i>parents<\/i> (đọc rõ âm cuối /ts/)."}, {"bad": "My apartment is in floor 12.", "good": "My apartment is on the twelfth floor.", "note": "Tầng: dùng <i>on the + số thứ tự + floor<\/i>."}, {"bad": "I reside in a serene immediate environment in close proximity to my school, ideally suited to my living conditions.", "good": "It's a quiet area, and my school is close by, so it suits me perfectly.", "note": "Dồn nhiều cụm trang trọng vào một câu nghe như học thuộc. Chọn một cụm, phần còn lại nói đơn giản."}]}, {"type": "choose", "items": [{"h": "<b>living standard / living standards / standard of living<\/b>", "html": "Khi nói về mức sống, người bản xứ thường dùng <b>living standards<\/b> (số nhiều) hoặc <b>standard of living<\/b>: <i>Living standards have improved.<\/i>"}, {"h": "<b>close proximity to / close to<\/b>", "html": "<b>in close proximity to<\/b> đúng nhưng trang trọng. Khi nói, <b>close to / near / within walking distance of<\/b> tự nhiên hơn."}]}, {"type": "sounds", "lines": ["<b>-s/-es:<\/b> parent<b>s<\/b> /s/ · experienc<b>es<\/b> /ɪz/ · adjustment<b>s<\/b> /s/", "<b>Phụ âm cuối (đọc rõ, không nuốt):<\/b> fla<b>t<\/b> /t/ · loca<b>l<\/b> · persona<b>l<\/b>", "<b>Trọng âm:<\/b> a<b>PART<\/b>ment · com<b>MU<\/b>nity · inter<b>AC<\/b>tion"], "tip": "<i>Nói to từng từ ba lần, rồi nói lại cả câu mẫu có chứa từ đó.<\/i>"}], "exercises": [{"title": "Exercise 1: Topic vocabulary → spoken sentence", "intro": "<i>Look at the cues, say the full sentence aloud (without reading), then write it. Each sentence has one topic phrase; use that exact phrase.<\/i>", "items": [{"level": 1, "cue": "I / live with my parents / and / younger brother / high-rise flat", "hint": "Add <i>my<\/i>, <i>in a<\/i>", "answer": "I live with my parents and my younger brother in a high-rise flat.", "model": false, "alt": "At the moment I live with my parents and my younger brother in a high-rise flat in Hanoi.", "note": "<i>live with<\/i> + người; <i>in a high-rise flat<\/i>.", "kind": "write"}, {"level": 1, "cue": "having / my own versity entrance exam. At weekends, though, I help my mum cook.", "model": false, "note": "Đặc điểm thật (đang ôn thi) giải thích vì sao bạn chủ yếu học ở nhà.", "kind": "write", "suggest": true}, {"level": 2, "q": "How long have you lived there?", "qnum": "Q15", "short": "About ten years now.", "expand": "we / move / there / when / I / be / in grade 1", "hint": "Technique: Tense control", "answer": "About ten years now. We moved there when I was in grade 1, so it's basically the only home I remember.", "model": false, "note": "Mốc chuyển nhà ở quá khứ (<i>moved, was<\/i>); khoảng thời gian đến nay dùng <i>I've lived<\/i>.", "kind": "write", "suggest": true}, {"level": 2, "q": "Do you plan to live there for a long time?", "qnum": "Q9", "short": "Probably not forever.", "expand": "after / university / like / rent / flat / of my own | because / want / more personal space", "hint": "Technique: Tense control (future plans)", "answer": "Probably not forever. After university, I'd like to rent a flat of my own, because I want more personal space.", "model": false, "note": "<i>a flat of my own<\/i> = căn hộ riêng; <i>I'd like to<\/i> cho kế hoạch.", "kind": "write", "suggest": true}, {"level": 3, "q": "Do you think it is important to live in a comfortable environment?", "qnum": "Q16", "short": "Yes, I think it's really important.", "expand": "because / living conditions / affect / mood | for example / when / room / messy / can't / focus", "hint": "Technique: 5W1H (Why) + Personalisation", "answer": "Yes, I think it's really important, because our living conditions affect our mood. For example, when my room is messy, I just can't focus.", "model": false, "note": "Ý chung + ví dụ của bản thân.", "kind": "write", "suggest": true}, {"level": 3, "q": "Do you live in a noisy or a quiet area?", "qnum": "Q17", "short": "It's quite noisy.", "expand": "because / live / next to / main road | traffic / start / at around 6 a.m.", "hint": "Technique: 5W1H (Why + When)", "answer": "It's
