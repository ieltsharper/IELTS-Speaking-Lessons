<style>
:root{--page:#f7f5f2;--card:#fff;--line:#e7e5e4;--ink:#1c1917;--muted:#57534e;--heading:#f96c1b;--brand:#c2410c;--on-brand:#fff;--brand-soft:#fff7ed;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--page:#171311;--card:#221c19;--line:#3a302b;--ink:#f5f0eb;--muted:#b8aca3;--brand-soft:#3a2416}}
body{margin:0;background:var(--page);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
.wrap{max-width:800px;margin:0 auto;padding:0 20px}
.topbar{background:var(--card);border-bottom:1px solid var(--line)}
.topbar .wrap{padding:12px 20px;display:flex;align-items:center}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--heading);font-weight:700;font-size:1.15rem;text-decoration:none}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);font-size:.85rem;font-weight:800}
h1{color:var(--heading);margin:28px 0 14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card:hover{background:var(--brand-soft)}
a.card b{color:var(--heading)}
a.card span{display:block;color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><a class="brand" href="https://ieltsharper.github.io/portal/"><span class="brand-mark" aria-hidden="true">IH</span>IELTS Harper Portal</a></div></div>
<main class="wrap">
<h1>IELTS Speaking lessons</h1>

</main>
</body>
</html>
